<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0c1014">
<title>Hold the Hall</title>
<meta name="description" content="A simpler, livelier metagame prototype for Two Thumbs Left: take the town hall in a tap-action opening, then win the town back block by block.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c1014; --ink: #f3efe6; --soft: #aab1bd; --panel: rgba(17, 21, 28, .95); --chip: rgba(17, 21, 28, .84); --line: rgba(255, 255, 255, .1);
  --amber: #ffd27a; --orange: #ff8a3c; --red: #e5484d; --green: #8dffa6; --fuel: #ff6b57;
  --cond: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; --body: Barlow, system-ui, -apple-system, "Segoe UI", sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 500 15px/1.35 var(--body); overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none; }
button, a.chip { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer; text-decoration: none; }
#town { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#hud { position: fixed; inset: 0; pointer-events: none; transition: opacity .5s; }
#hud.off { opacity: 0; visibility: hidden; }

/* top bar */
#top { position: absolute; left: calc(8px + var(--sal)); right: calc(8px + var(--sar)); top: calc(8px + var(--sat)); display: flex; gap: 6px; align-items: center; }
.chip { pointer-events: auto; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 12px; background: var(--chip); display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font: 700 19px/1 var(--cond); letter-spacing: .02em; white-space: nowrap; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.chip svg { width: 20px; height: 20px; flex: none; }
.chip small { font: 600 13px/1 var(--cond); color: var(--soft); }
.chip .plus { width: 22px; height: 22px; border-radius: 7px; background: var(--fuel); color: #1a0f0d; display: inline-flex; align-items: center; justify-content: center; font: 800 18px/1 var(--cond); }
.chip.low b { color: #ff9a8a; }
.chip.pop { animation: pop .35s; }
@keyframes pop { 40% { transform: scale(1.14); } }
.grow { flex: 1; }
#cPeople.alert::after { content: ""; position: absolute; }
#cPeople { position: relative; }
#cPeople .dot { position: absolute; right: -3px; top: -3px; width: 13px; height: 13px; border-radius: 50%; background: var(--red); border: 2px solid #11151c; display: none; }
#cPeople.alert .dot { display: block; }

/* bottom bar */
#bottom { position: absolute; left: calc(8px + var(--sal)); right: calc(8px + var(--sar)); bottom: calc(8px + var(--sab)); display: flex; gap: 8px; align-items: flex-end; }
#goal { pointer-events: auto; flex: 1 1 auto; min-width: 0; max-width: 430px; min-height: 52px; padding: 7px 12px 9px; border-radius: 14px; background: var(--chip); text-align: left; position: relative; overflow: hidden;
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
#goal .gt { display: block; font: 700 17px/1.12 var(--cond); letter-spacing: .01em; }
#goal .gs { display: block; font: 600 13px/1.2 var(--cond); color: var(--soft); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#goal .gb { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--orange); transition: width .4s; }
#goal.done { background: #2a6b3c; }
#expand { pointer-events: auto; flex: none; margin-left: auto; min-width: 150px; min-height: 58px; padding: 6px 16px 8px; border-radius: 16px; background: var(--orange); color: #1b120c; text-align: center;
  box-shadow: 0 4px 0 #a34f17, 0 8px 18px rgba(0, 0, 0, .4); font: 800 24px/1 var(--cond); letter-spacing: .03em; }
#expand small { display: block; font: 700 13px/1.1 var(--cond); letter-spacing: .02em; opacity: .8; margin-top: 3px; white-space: nowrap; }
#expand:active { transform: translateY(3px); box-shadow: 0 1px 0 #a34f17; }
#expand.run { background: #ffd27a; box-shadow: 0 4px 0 #a37f2e, 0 8px 18px rgba(0, 0, 0, .4); }
#expand.wait { background: #39414e; color: var(--ink); box-shadow: 0 4px 0 #20252e; }
#expand.pulse { animation: glow 1.2s infinite; }
@keyframes glow { 50% { box-shadow: 0 4px 0 #a34f17, 0 0 0 7px rgba(255, 138, 60, .35); } }
.panel-open #expand { display: none; }

/* banner and toasts */
#banner { position: absolute; left: 50%; top: calc(60px + var(--sat)); transform: translateX(-50%); padding: 7px 14px; border-radius: 12px; background: var(--red); color: #fff; font: 800 17px/1 var(--cond); letter-spacing: .04em; white-space: nowrap; display: none; }
#banner.on { display: block; animation: pop .4s; }
#toasts { position: absolute; left: 50%; top: calc(100px + var(--sat)); transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; align-items: center; width: min(92vw, 420px); }
.toast { padding: 7px 13px; border-radius: 11px; background: rgba(17, 21, 28, .92); font: 700 16px/1.15 var(--cond); text-align: center; animation: tin .25s; }
.toast.good { color: var(--green); } .toast.bad { color: #ff9a8a; } .toast.out { opacity: 0; transition: opacity .4s; }
@keyframes tin { from { transform: translateY(-8px); opacity: 0; } }

/* the panel: a bottom sheet when narrow or upright, a side panel in landscape */
#panel { position: absolute; pointer-events: auto; left: calc(8px + var(--sal)); right: calc(8px + var(--sar)); bottom: calc(8px + var(--sab)); max-height: 64%; overflow-y: auto; overflow-x: hidden; touch-action: pan-y;
  background: var(--panel); border-radius: 18px; padding: 14px 14px 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); -webkit-overflow-scrolling: touch; animation: up .2s; }
#panel[hidden] { display: none; }
@keyframes up { from { transform: translateY(14px); opacity: 0; } }
@media (min-width: 640px) and (orientation: landscape) {
  #panel { left: auto; top: calc(60px + var(--sat)); width: 318px; max-height: none; }
}
.ph { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
.ph h2 { flex: 1; margin: 0; font: 800 24px/1.02 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.ph h2 small { display: block; font: 600 14px/1.25 var(--cond); letter-spacing: .02em; color: var(--soft); text-transform: none; margin-top: 3px; }
.x { flex: none; width: 44px; height: 44px; margin: -8px -8px 0 0; border-radius: 12px; font: 700 24px/1 var(--cond); color: var(--soft); }
.row { display: flex; align-items: center; gap: 8px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.row b { font: 700 16px/1.1 var(--cond); }
.row .r { margin-left: auto; text-align: right; font: 700 16px/1.1 var(--cond); white-space: nowrap; }
.muted { color: var(--soft); } .good { color: var(--green); } .bad { color: #ff9a8a; } .amber { color: var(--amber); }
p.note { margin: 8px 0 0; color: var(--soft); font-size: 13px; line-height: 1.35; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 48px; margin-top: 9px; padding: 6px 12px; border-radius: 13px; background: rgba(255, 255, 255, .09);
  font: 800 19px/1.05 var(--cond); letter-spacing: .03em; text-transform: uppercase; text-align: center; }
.btn small { display: block; font: 600 13px/1.1 var(--cond); text-transform: none; letter-spacing: .01em; opacity: .85; }
.btn.main { background: var(--orange); color: #1b120c; } .btn.fuel { background: rgba(255, 107, 87, .14); box-shadow: inset 0 0 0 2px var(--fuel); color: #ffb0a4; }
.btn.go { background: var(--green); color: #0e1a12; } .btn.danger { background: transparent; box-shadow: inset 0 0 0 2px rgba(229, 72, 77, .7); color: #ff9a8a; }
.btn.off { opacity: .45; }
.btn:active { transform: translateY(2px); }
.btns { display: flex; gap: 8px; } .btns .btn { flex: 1; }
.pips { display: inline-flex; gap: 4px; vertical-align: middle; } .pips i { width: 10px; height: 10px; border-radius: 50%; background: #ff5a4a; } .pips i.o { background: rgba(255, 255, 255, .22); }
/* runner cards */
.cards { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin: 6px -4px 0; touch-action: pan-x; scrollbar-width: none; }
.cards::-webkit-scrollbar { display: none; }
.card { flex: none; width: 108px; min-height: 96px; padding: 8px 8px 7px; border-radius: 13px; background: rgba(255, 255, 255, .06); text-align: left; box-shadow: inset 0 0 0 2px transparent; }
.card.sel { background: rgba(255, 138, 60, .16); box-shadow: inset 0 0 0 2px var(--orange); }
.card.off { opacity: .5; }
.card .nm { display: flex; align-items: center; gap: 6px; font: 700 17px/1 var(--cond); }
.card .nm i, .who i { flex: none; width: 14px; height: 14px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255, 255, 255, .25); }
.card .lv { font: 600 13px/1.2 var(--cond); color: var(--soft); margin-top: 3px; }
.card .od { font: 800 20px/1 var(--cond); margin-top: 6px; } .card .od small { font: 700 12px/1 var(--cond); color: var(--soft); margin-left: 2px; }
.card .dt { font: 700 13px/1 var(--cond); margin-top: 3px; color: var(--soft); } .card .dt.risk { color: #ff9a8a; }
.who { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 0; border-top: 1px solid var(--line); text-align: left; min-height: 48px; }
.who b { font: 700 18px/1 var(--cond); } .who span { color: var(--soft); font: 600 13px/1.2 var(--cond); }
.who .r { margin-left: auto; font: 700 15px/1.1 var(--cond); text-align: right; }
.bar { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; margin-top: 4px; } .bar i { display: block; height: 100%; background: var(--amber); }
.tag { display: inline-block; padding: 2px 7px; border-radius: 7px; background: rgba(255, 255, 255, .1); font: 700 13px/1.3 var(--cond); letter-spacing: .03em; }
.proto { font: 700 12px/1.2 var(--cond); letter-spacing: .06em; color: var(--soft); text-transform: uppercase; }
pre.json { margin: 8px 0 0; padding: 8px; border-radius: 10px; background: rgba(0, 0, 0, .35); font: 11px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; -webkit-user-select: text; user-select: text; }

/* the opening story */
#story { position: fixed; inset: 0; pointer-events: none; }
#story[hidden] { display: none; }
#stTitle { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-58%); text-align: center; padding: 0 20px; text-shadow: 0 2px 14px rgba(0, 0, 0, .9); }
#stTitle b { display: block; font: 800 clamp(40px, 11vw, 84px)/.95 var(--cond); letter-spacing: .04em; color: #fff; }
#stTitle span { display: block; margin-top: 10px; font: 600 clamp(17px, 3.6vw, 24px)/1.25 var(--cond); color: #dfe4ea; }
#stCap { position: absolute; left: 50%; bottom: calc(20px + var(--sab)); transform: translateX(-50%); width: min(92vw, 520px); padding: 10px 16px 11px; border-radius: 14px; background: rgba(10, 13, 18, .82);
  text-align: center; font: 700 clamp(18px, 4.6vw, 23px)/1.15 var(--cond); letter-spacing: .01em; }
#stCap:empty { display: none; }
#stCap b { color: var(--orange); } #stCap small { display: block; margin-top: 4px; font: 600 14px/1.1 var(--cond); color: var(--soft); letter-spacing: .08em; }
#stSkip { position: absolute; right: calc(10px + var(--sar)); top: calc(10px + var(--sat)); pointer-events: auto; height: 44px; padding: 0 14px; border-radius: 12px; background: rgba(10, 13, 18, .6); font: 700 15px/1 var(--cond); letter-spacing: .08em; color: var(--soft); }
#stBack { position: absolute; left: calc(10px + var(--sal)); top: calc(10px + var(--sat)); pointer-events: auto; }
.noscript { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; background: var(--bg); }

@media (max-width: 480px) {
  .chip { padding: 0 8px; gap: 5px; font-size: 17px; }
  .chip svg { width: 17px; height: 17px; }
  #top { gap: 5px; }
  #cSound { display: none; }
  #expand { min-width: 118px; font-size: 21px; padding: 6px 10px 8px; }
}
@media (max-height: 360px) { #goal { min-height: 46px; } #expand { min-height: 50px; font-size: 21px; } }
@media (prefers-reduced-motion: reduce) { .chip.pop, #expand.pulse, .toast, #panel, #banner.on { animation: none; } }
</style>
</head>
<body>
<canvas id="town" aria-label="The town"></canvas>
<div id="hud" class="off">
  <div id="top">
    <a id="back" class="chip" href="../" aria-label="Back to the gallery"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <button id="cSup" class="chip" data-do="info" data-k="sup" aria-label="Supplies"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2" fill="#b08a55"/><path d="M3 11h18M9 6v13M15 6v13" stroke="#6f5330" stroke-width="1.6"/></svg><b id="vSup">0</b></button>
    <button id="cFuel" class="chip" data-do="panel" data-k="fuel" aria-label="Fuel"><svg viewBox="0 0 24 24"><path d="M6 4h8l4 4v11a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z" fill="#ff6b57"/><path d="M8 10l8 8M16 10l-8 8" stroke="#8a2c20" stroke-width="2"/><rect x="7" y="2" width="5" height="3" fill="#c9c4b8"/></svg><b id="vFuel">0</b><span class="plus">+</span></button>
    <button id="cAmmo" class="chip" data-do="info" data-k="ammo" aria-label="Wall ammo"><svg viewBox="0 0 24 24"><path d="M5 21v-9c0-3 1-6 2-7 1 1 2 4 2 7v9zM11 21v-9c0-3 1-6 2-7 1 1 2 4 2 7v9zM17 21v-9c0-3 1-6 2-7 1 1 2 4 2 7v9z" fill="#ffd27a"/></svg><b id="vAmmo">6</b></button>
    <span class="grow"></span>
    <button id="cPeople" class="chip" data-do="panel" data-k="people" aria-label="Survivors"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4" fill="currentColor"/><path d="M1 21c0-4 3-7 7-7s7 3 7 7z" fill="currentColor"/><circle cx="17.5" cy="9" r="3" fill="currentColor" opacity=".7"/><path d="M16 14c4 0 7 2.5 7 7h-6" fill="currentColor" opacity=".7"/></svg><b id="vPeople">3/3</b><i class="dot"></i></button>
    <button id="cSound" class="chip" data-do="sound" aria-label="Sound on or off"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path id="sndOn" d="M16 8c1.5 1 2 2.5 2 4s-.5 3-2 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <button id="cLab" class="chip" data-do="panel" data-k="lab" aria-label="The Lab"><small>LAB</small></button>
  </div>
  <div id="banner"></div>
  <div id="toasts"></div>
  <div id="bottom">
    <button id="goal" data-do="goal"><span class="gt"></span><span class="gs"></span><i class="gb"></i></button>
    <button id="expand" data-do="expand">EXPAND<small></small></button>
  </div>
  <div id="panel" hidden></div>
</div>
<div id="story" hidden>
  <a id="stBack" class="chip" href="../" aria-label="Back to the gallery"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <button id="stSkip">SKIP ▸▸</button>
  <div id="stTitle"></div>
  <div id="stCap"></div>
</div>
<noscript><div class="noscript">Hold the Hall needs JavaScript.</div></noscript>
<script src="./data.js"></script>
<script src="./engine.js"></script>
<script src="./art.js"></script>
<script src="./scene.js"></script>
<script src="./sfx.js"></script>
<script src="./intro.js"></script>
<script src="./ui.js"></script>
</body>
</html>
