<script src="../shared/casino.js"></script>
<script>
/* Top Buns: a crash game.
   Math: at take-off the crash point is fixed as crash = max(1.00, floor(100 * 0.97 / (1 - u)) / 100) with u = Casino.rng.float(),
   capped at 1000x. So P(crash >= x) = 0.97 / x for any 2-decimal x >= 1.01, and ~3.96% of sorties are shot down on the
   runway at 1.00x. The multiplier is m(t) = e^(0.12 t), t in real seconds since lift-off (performance.now, never frames).
   Ejecting at x pays floor(stake * x); auto eject at target x pays when x <= crash (a tie goes to the pilot), so every
   strategy returns 0.97 on average, minus a hair of rounding on odd stakes.
   Monte Carlo (node, 4M sorties per strategy, crypto RNG, stake 50): auto 1.5x 97.01%, 2x 96.98%, 3x 97.00%,
   5x 97.01%, 10x 96.97%, 100x 97.01%; random manual eject 96.6% (the shown multiplier is floored to the cent).
   Rounding to whole chips costs a little on odd pairs (auto 1.5x at stake 25: 95.7%; 1.01x at stake 10: 96.0%).
   Instant 1.00x crash: 3.97%.
   QA re-check (independent node sim of this exact code, 1M sorties per cell, all six stakes): every preset is 97.0%
   (analytic (97/T) * floor(stake*T/100)/stake) except 1.5x at stake 25 = 95.7%; random-time manual ejects 95.7-97.0%
   (stake 10 lowest). Worst custom auto: 1.09x at stake 10 pays 10, 89.0%; the help says small stakes lose to rounding.
   Leaving mid-flight settles at once (pagehide): only an auto eject at or below the sealed crash point pays. */
(() => {
  'use strict';
  const { wallet, sfx, fx, rng, fmt, sleep, clamp, store } = Casino;
  Casino.init({ id: 'top-buns', title: 'Top Buns', minBet: 10 });

  const $ = (s) => document.querySelector(s);
  const TAU = Math.PI * 2;
  const lerp = (a, b, k) => a + (b - a) * k;
  const R = (a, b) => a + Math.random() * (b - a); // cosmetic jitter only; outcomes use Casino.rng
  const easeOut = (k) => 1 - (1 - k) ** 3;
  const easeBack = (k) => 1 + 2.70158 * (k - 1) ** 3 + 1.70158 * (k - 1) ** 2;
  const xs = (c) => (c / 100).toFixed(2) + 'x';
  const up = (str) => str.toUpperCase().replace(/(\d)X/g, '$1x'); // shout, but keep the little x

  /* ---------- Math ---------- */
  const GROWTH = 0.12;
  const CAP_C = 100000; // 1000.00x in cents
  const ROLL_MS = 1500;
  const mAt = (t) => Math.exp(GROWTH * Math.max(0, t));
  const tAt = (m) => Math.log(m) / GROWTH;
  const crashFrom = (u) => Math.min(CAP_C, Math.max(100, Math.floor(97 / (1 - u)))); // cents

  /* Debug hooks (harmless; fake chips): #crash=1.5,3.2 forces crash points in turn, #warp=s starts the flight s seconds in,
     #speed=k runs the flight clock k times faster, #thumb stages the gallery still, #debug exposes window.TopBuns.
     They only work under automation (navigator.webdriver), so visitors can't force results. */
  const HP = new URLSearchParams(navigator.webdriver ? location.hash.slice(1) : '');
  const DBG = {
    crash: (HP.get('crash') || '').split(',').map(Number).filter((v) => v >= 1).map((v) => Math.min(CAP_C, Math.round(v * 100))),
    warp: Math.max(0, +HP.get('warp') || 0),
    speed: clamp(+HP.get('speed') || 1, 0.25, 20),
    thumb: HP.has('thumb'),
    on: HP.has('debug'),
  };
  if (DBG.thumb) { DBG.crash = [9000]; DBG.warp = 19.39; } // about 11.7x at the 2.6 s capture, between digit pops
  let dbgI = 0;
  const nextCrash = () => (DBG.crash.length ? DBG.crash[dbgI++ % DBG.crash.length] : crashFrom(rng.float()));

  /* ---------- Copy ---------- */
  const QUIPS = {
    win: [
      'Smooth exit, hot shot.', 'Peachy keen, Buns!', 'Soft landing. Silk sheets optional.', 'Cheeks clenched, chips collected.',
      'Easy on the stick. Perfect.', 'Fresh out of the oven and into the money.', 'Tower says: nice package.', 'Hot buns, warm wallet.',
      'Ejected with style and both cheeks intact.', 'The need for greed: satisfied.', 'Pull up, cash out, look fabulous.', 'Smooth as a satin flight suit.',
    ],
    big: [
      'Talk about a long, hard climb.', 'You rode that all the way up.', 'Highest buns in the sky!', 'Somebody frame this flight log.',
      'Steamy! Somebody open a window.', 'Mamma mia, what a climb.',
    ],
    loseHead: ['Mayday! Mayday!', 'Ka-boom!', 'Splash one!', 'Bandit on your tail!', 'Oof!', 'Eject? Too late!'],
    lose: [
      'Buns got roasted.', 'Too hot to handle.', "Should've bailed, hot stuff.", "That one's gonna sting in the cheeks.",
      'Happens to every pilot. Honest.', 'Your peach got grilled.', "Lost that lovin' feelin'.", 'Even hot buns cool down.',
      'Crashed harder than a blind date.', 'Greed got you buns-first.', 'Smoking hot. Literally.', 'Lovely flight. Shame about the ending.',
    ],
    runway: ["Couldn't get it up off the runway.", 'Engine trouble. It happens. Really. To everyone.', 'Grounded before the fun even started.'],
    near: ['Missed it by a peach fuzz!', 'So close you could smell the chips.', 'Your auto eject was RIGHT there. Ouch.'],
    ghostGood: ['Good call, Buns.', 'Bailed like a pro.', 'Called it. Smart buns.'],
    ghostBad: ["Don't think about it.", 'A bun in the hand...', 'Chips are chips. Fly again.'],
  };
  const lastQuip = {};
  function quip(kind) {
    const list = QUIPS[kind];
    let q;
    do { q = list[(Math.random() * list.length) | 0]; } while (list.length > 1 && q === lastQuip[kind]);
    lastQuip[kind] = q;
    return q;
  }
  const CALLOUTS = { 200: 'Sonic boom! Doubled up!', 300: 'Feeling the need...', 400: 'Hot buns, hotter skies', 500: 'Getting steamy up here', 700: 'Too hot to handle',
    1000: 'Welcome to the Danger Zone', 1500: 'Cheeks of steel', 2000: 'Mach Daddy!', 5000: 'Sky-high and sizzling', 10000: 'Legend of the skies', 50000: 'Is this even legal?' };
  // a pop and a chime at every whole number up to 20x, then at the big round ones
  const MILESTONES = [...Array.from({ length: 19 }, (_, i) => 200 + i * 100), 2500, 3000, 4000, 5000, 7500, 10000, 15000, 25000, 50000, 100000];
  const SONIC = { 200: 0.7, 500: 0.85, 1000: 1, 2500: 1, 5000: 1, 10000: 1 }; // vapour-cone booms (strength)
  const PILOTS = [
    ['Goosebumps', '#4dffb0'], ['Tailspin Tina', '#ff8fc7'], ['Peach Fuzz', '#ffb38a'], ['Afterglow', '#ffcf4a'],
    ['Wingnut Walt', '#3ef0ff'], ['Loop-de-Lou', '#b06bff'], ['Joystick Jackie', '#ff3d9a'], ['Mile High Mike', '#8ab4ff'],
    ['Bottoms Up', '#ffd54a'], ['Hot Sauce', '#ff6a3d'], ['Velvet Thunder', '#c48bff'], ['Cherry Bomb', '#ff4d6d'],
    ['Turbulence Terry', '#7dffcf'], ['Lip Service', '#ff7cc6'],
  ];
  const SHADES = '<svg viewBox="0 0 34 16" aria-hidden="true"><path d="M3 3h11c1 0 1.6.8 1.3 2l-.8 4.2C14 12.5 11.5 14 8.5 14S3 12 2.4 8.6L2 5c-.2-1.2.2-2 1-2zM20 3h11c.8 0 1.2.8 1 2l-.4 3.6C31 12 28.5 14 25.5 14s-5.5-1.5-6-4.8L18.7 5c-.2-1.2.3-2 1.3-2z" fill="currentColor" stroke="#ffcf4a" stroke-width="1.4"/><path d="M15.3 5.5q1.7-1.4 3.4 0" stroke="#ffcf4a" stroke-width="1.4" fill="none"/></svg>';
  const MINI_CHUTE = '<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 8a8 7 0 0 1 16 0q-2-1.5-4 0q-2-1.5-4 0q-2-1.5-4 0q-2-1.5-4 0z" fill="#ff3d9a" stroke="#fff" stroke-width=".8"/><path d="M2 8l8 8 8-8M10 8v8" stroke="#ffe6f3" stroke-width=".8" fill="none"/><circle cx="10" cy="17" r="2.2" fill="#ffcf4a"/></svg>';
  const ROMAN = (n) => {
    const v = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    let s = '';
    for (const [k, r] of v) while (n >= k) { s += r; n -= k; }
    return s;
  };

  /* ---------- Elements ---------- */
  const stage = $('#stage');
  const cv = $('#sky');
  let g = cv.getContext('2d'); // swapped briefly to pre-render sprites (see wreckSprite)
  const hud = $('#hud');
  const multEl = $('#mult');
  const multN = $('#multN');
  const subEl = $('#sub');
  const slamEl = $('#slam');
  const logoEl = $('#logo');
  const dzEl = $('#dz');
  const histEl = $('#hist');
  const feedEl = $('#feed');
  const chutesEl = $('#chutes');
  const goBtn = $('#go');
  const goL = $('#goL');
  const goS = $('#goS');
  const goBar = $('#goBar');
  const streakEl = $('#streak');
  const chipsEl = $('#chips');
  const autosEl = $('#autos');
  const customEl = $('#custom');
  const stakeLbl = $('#stakeLbl');
  const autoLbl = $('#autoLbl');
  const wlist = $('#wlist');
  const wingCount = $('#wingCount');
  const callsignEl = $('#callsign');

  /* ---------- State ---------- */
  const STAKES = [10, 25, 50, 100, 250, 500];
  let stakeSel = STAKES.includes(store.get('bmc.topbuns.stake', 50)) ? store.get('bmc.topbuns.stake', 50) : 50;
  let autoC = (() => {
    const a = Math.round(+store.get('bmc.topbuns.auto', 0) || 0);
    return a >= 101 && a <= CAP_C ? a : 0;
  })();
  const S = {
    phase: 'idle', // idle | roll | fly | boom
    player: 'none', // none | in | out | lost
    round: 0,
    stake: 0,
    targetC: 0,
    crashC: 0,
    rollAt: 0,
    rollEnd: 0,
    liftAt: 0,
    gearAt: 0,
    ejectC: 0,
    ejectT: 0,
    win: 0,
    boomT: 0,
    boomAt: 0,
    boomXY: null,
    taxiAt: performance.now(),
    lockUntil: 0,
    lastAct: 0,
    ms: 0,
    danger: false,
    lastBeat: 0,
    histDone: true,
    streak: 0,
    spd: 0.35,
    ang: 0,
    runOff: 0,
    curveFade: 0,
    airframe: Math.max(1, Math.floor(+store.get('bmc.topbuns.airframe', 1) || 1)),
    celebrating: false,
    shownC: -1,
    shownWin: -1,
    shownHot: '',
    kick: 0, // extra camera shake that decays (take-off kick, sonic booms, wreck impact)
    cones: [], // sonic-boom vapour cones riding on the jet
    flyby: null, // idle fly-past of a wingman
    nextFlyby: performance.now() + 5000,
  };
  let freezeUntil = 0;
  const roundLog = []; // finished rounds (debug hook and the "while you were away" toast)
  const logRound = (r) => {
    roundLog.push(r);
    if (roundLog.length > 200) roundLog.shift();
  };
  const flightT = (now) => ((now - S.liftAt) / 1000) * DBG.speed;

  /* ---------- Credit exactly once, timed with the coins ---------- */
  let pending = null;
  function scheduleCredit(n) {
    let done = false;
    const f = () => {
      if (done) return false;
      done = true;
      if (pending === f) pending = null;
      wallet.win(n);
      return true;
    };
    pending = f;
    return f;
  }
  const flush = () => { if (pending) pending(); };
  /* Leaving or reloading mid-flight: the pilot is no longer at the stick, so only the auto eject can save the stake.
     The crash point is already sealed, so settle the sortie right now, exactly as the flight would have ended. */
  function settleAbandoned() {
    if (S.player !== 'in' || (S.phase !== 'roll' && S.phase !== 'fly')) return;
    const ok = S.targetC && S.targetC <= S.crashC;
    const win = ok ? Math.floor((S.stake * S.targetC) / 100) : 0;
    if (ok) {
      S.player = 'out';
      S.ejectC = S.targetC;
      S.ejectT = tAt(S.targetC / 100);
      S.win = win;
      wallet.win(win);
    } else {
      S.player = 'lost';
      S.streak = 0;
    }
    Casino.record({ bet: S.stake, win });
    logRound({ round: S.round, stake: S.stake, crashC: S.crashC, result: ok ? 'win' : 'lose', cents: ok ? S.targetC : 0, win, abandoned: true });
    pushHistory(S.crashC);
  }
  addEventListener('pagehide', () => {
    flush();
    settleAbandoned();
  });
  // If the sortie ended while the tab was hidden, say how it went on return, and swallow the panicked
  // EJECT tap that usually follows for a moment, so it can't launch (and charge) a brand-new sortie.
  const away = { round: -1, player: 'none' };
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      flush();
      away.round = S.round;
      away.player = S.player;
    } else if (away.round === S.round && away.player === 'in' && S.player !== 'in') {
      S.lockUntil = Math.max(S.lockUntil, performance.now() + 900);
      paintButton();
      const last = roundLog[roundLog.length - 1];
      if (last && last.round === S.round) {
        Casino.toast(last.result === 'win' ? `While you were away: auto eject at ${xs(last.cents)}, +${fmt(last.win)}` : `While you were away: shot down at ${xs(last.crashC)}`, last.result === 'win' ? 'good' : 'bad');
      }
      away.round = -1;
    }
    engine.update(true);
  });

  /* ---------- Engine audio: detuned saws + brown-noise roar + turbine whine through sfx.out ---------- */
  const engine = (() => {
    let n = null;
    let buf = null;
    let want = { on: false, power: 0, m: 1, duck: 1 };
    function noise(c) {
      if (buf && buf.sampleRate === c.sampleRate) return buf;
      buf = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < d.length; i++) {
        last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
        d[i] = last * 3.5;
      }
      return buf;
    }
    function build() {
      const c = sfx.ctx();
      if (!c || !sfx.out) return null;
      const out = c.createGain();
      out.gain.value = 0.0001;
      out.connect(sfx.out);
      const lp = c.createBiquadFilter();
      lp.type = 'lowpass';
      lp.frequency.value = 300;
      lp.Q.value = 1.4;
      lp.connect(out);
      const og = c.createGain();
      og.gain.value = 0.2;
      og.connect(lp);
      const o1 = c.createOscillator();
      o1.type = 'sawtooth';
      o1.frequency.value = 42;
      const o2 = c.createOscillator();
      o2.type = 'sawtooth';
      o2.frequency.value = 42.6;
      o1.connect(og);
      o2.connect(og);
      const ns = c.createBufferSource();
      ns.buffer = noise(c);
      ns.loop = true;
      const nf = c.createBiquadFilter();
      nf.type = 'bandpass';
      nf.frequency.value = 450;
      nf.Q.value = 0.7;
      const ng = c.createGain();
      ng.gain.value = 1.1;
      ns.connect(nf).connect(ng).connect(out);
      const wh = c.createOscillator();
      wh.type = 'sine';
      wh.frequency.value = 600;
      const wg = c.createGain();
      wg.gain.value = 0.05; // the turbine whine carries the pitch rise on small speakers
      wh.connect(wg).connect(out);
      o1.start();
      o2.start();
      ns.start();
      wh.start();
      return { c, out, lp, o1, o2, nf, wh, srcs: [o1, o2, ns, wh] };
    }
    let lastUpd = 0;
    function update(force) {
      if (!want.on) {
        if (n) {
          const k = n;
          n = null;
          const t = k.c.currentTime;
          k.out.gain.cancelScheduledValues(t);
          k.out.gain.setTargetAtTime(0.0001, t, want.fast ? 0.015 : 0.35);
          setTimeout(() => {
            for (const s of k.srcs) { try { s.stop(); } catch { /* already stopped */ } }
            k.out.disconnect();
          }, want.fast ? 250 : 2200);
        }
        return;
      }
      let fresh = false;
      if (!n) {
        n = build();
        fresh = true;
      }
      if (!n) return;
      // ~20 automation updates a second is plenty (the params glide with setTargetAtTime anyway)
      const wall = performance.now();
      if (!force && !fresh && wall - lastUpd < 50) return;
      lastUpd = wall;
      const t = n.c.currentTime;
      const lm = Math.log(Math.max(1, want.m));
      const p = want.power;
      const vol = document.hidden ? 0.0001 : (0.09 + 0.2 * p) * want.duck;
      n.out.gain.setTargetAtTime(vol, t, 0.08);
      const f = 38 + 26 * p + 16 * lm;
      n.o1.frequency.setTargetAtTime(f, t, 0.12);
      n.o2.frequency.setTargetAtTime(f * 1.014, t, 0.12);
      n.lp.frequency.setTargetAtTime(220 + 520 * p + 650 * lm, t, 0.12);
      n.nf.frequency.setTargetAtTime(380 + 900 * p + 800 * lm, t, 0.12);
      n.wh.frequency.setTargetAtTime(520 + 900 * p + 520 * lm, t, 0.12);
    }
    return {
      set(power, m, duck = 1) { want = { on: true, power, m, duck }; update(); },
      stop(fast) { want = { on: false, fast }; update(true); },
      // a short throttle blip (eject, sonic boom): the drone surges, then settles back on the next updates
      surge(k = 1) {
        if (!n) return;
        const t = n.c.currentTime;
        n.lp.frequency.setTargetAtTime(2400 * k, t, 0.02);
        n.out.gain.setTargetAtTime(0.26 * k * (want.duck || 1), t, 0.02);
        lastUpd = performance.now() + 120;
      },
      update,
    };
  })();

  /* ---------- Stage geometry ---------- */
  let W = 1;
  let H = 1;
  let DPR = 1;
  let L = 80; // jet length
  let x0 = 60;
  let y0 = 200;
  let groundY = 220;
  let horizonY = 160;
  let plotR = 300;
  let plotT = 90;
  let bg = null;
  let floorGrad = null;
  let clouds = [];
  const lines = [];
  const stars = [];
  const SPR = {};

  function sprite(size, stops) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const x = c.getContext('2d');
    const gr = x.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (const [o, col] of stops) gr.addColorStop(o, col);
    x.fillStyle = gr;
    x.fillRect(0, 0, size, size);
    return c;
  }
  SPR.hot = sprite(64, [[0, 'rgba(255,255,240,1)'], [0.35, 'rgba(255,230,140,.9)'], [1, 'rgba(255,160,60,0)']]);
  SPR.fire = sprite(64, [[0, 'rgba(255,200,90,1)'], [0.4, 'rgba(255,110,50,.8)'], [1, 'rgba(255,40,80,0)']]);
  SPR.pink = sprite(64, [[0, 'rgba(255,150,220,.95)'], [0.45, 'rgba(255,61,154,.6)'], [1, 'rgba(140,40,255,0)']]);
  SPR.smoke = sprite(64, [[0, 'rgba(60,28,70,.85)'], [0.6, 'rgba(50,22,60,.45)'], [1, 'rgba(40,16,50,0)']]);
  SPR.haze = sprite(64, [[0, 'rgba(255,190,230,.5)'], [0.6, 'rgba(255,140,200,.2)'], [1, 'rgba(255,140,200,0)']]);
  SPR.glow = sprite(128, [[0, 'rgba(255,255,255,1)'], [0.25, 'rgba(255,210,120,.8)'], [0.6, 'rgba(255,61,120,.35)'], [1, 'rgba(255,40,100,0)']]);

  // soft, streaky synthwave clouds lit from below by the sun
  function cloudSprite(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * DPR);
    c.height = Math.ceil(h * DPR);
    const x = c.getContext('2d');
    x.scale(DPR, DPR);
    const n = 5 + ((Math.random() * 4) | 0);
    for (let i = 0; i < n; i++) {
      const k = i / (n - 1);
      const rx = w * R(0.14, 0.24) * (1 - Math.abs(k - 0.5) * 0.6);
      const ry = rx * R(0.3, 0.46);
      const cx = w * (0.18 + 0.64 * k) + R(-5, 5);
      const cy = h * 0.68 - ry * R(0.1, 0.7) * (1 - Math.abs(k - 0.5));
      x.save();
      x.translate(cx, cy);
      x.scale(1, ry / rx);
      const gr = x.createRadialGradient(0, 0, 0, 0, 0, rx);
      gr.addColorStop(0, 'rgba(255,255,255,.95)');
      gr.addColorStop(0.55, 'rgba(255,255,255,.7)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      x.fillStyle = gr;
      x.beginPath();
      x.arc(0, 0, rx, 0, TAU);
      x.fill();
      x.restore();
    }
    // a long thin streak underneath
    x.save();
    x.translate(w * 0.5, h * 0.8);
    x.scale(1, 0.09);
    const st = x.createRadialGradient(0, 0, 0, 0, 0, w * 0.5);
    st.addColorStop(0, 'rgba(255,255,255,.9)');
    st.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = st;
    x.beginPath();
    x.arc(0, 0, w * 0.5, 0, TAU);
    x.fill();
    x.restore();
    // tint: dusky violet on top, hot peach where the sun hits the underside
    x.globalCompositeOperation = 'source-atop';
    const tint = x.createLinearGradient(0, 0, 0, h);
    tint.addColorStop(0, '#5a1c78');
    tint.addColorStop(0.45, '#b0408f');
    tint.addColorStop(0.78, '#ff7fa8');
    tint.addColorStop(1, '#ffc08a');
    x.fillStyle = tint;
    x.fillRect(0, 0, w, h);
    return c;
  }

  function layout(force) {
    // clientWidth/Height ignore transforms: a rotating screen shake must not look like a resize
    const nw = Math.max(1, stage.clientWidth);
    const nh = Math.max(1, stage.clientHeight);
    // DPR up to 2, but keep the backing store under ~2.2M pixels so big desktop decks stay cheap to fill
    const nd = Math.round(Math.min(2, devicePixelRatio || 1, Math.sqrt(2.2e6 / (nw * nh))) * 100) / 100;
    if (!force && nw === W && nh === H && nd === DPR && bg) return;
    const sizeChanged = nw !== W || nh !== H || nd !== DPR || !bg;
    W = nw;
    H = nh;
    DPR = nd;
    if (sizeChanged) {
      cv.width = Math.round(W * DPR);
      cv.height = Math.round(H * DPR);
    }
    L = clamp(Math.min(W * 0.19, H * 0.26), 62, 132);
    groundY = H - Math.max(20, H * 0.065);
    horizonY = H * 0.7;
    x0 = Math.max(16, W * 0.045) + L * 0.55;
    y0 = groundY - L * 0.2;
    plotR = W - L * 0.62 - 8;
    // the flight band starts under the multiplier, so the jet never flies behind the digits
    const hudBottom = hud.offsetTop + hud.offsetHeight + 10;
    plotT = Math.min(Math.max(hudBottom, H * 0.2, 60), y0 - H * 0.34);
    if (sizeChanged) {
      buildBg();
      buildClouds();
    }
    SPR.wreck = wreckSprite();
  }
  // the burnt-out Hot Buns, pre-rendered once per size so the falling wreck costs one drawImage a frame
  function wreckSprite() {
    const s = L;
    const c = document.createElement('canvas');
    const px = Math.ceil(s * 1.25 * DPR);
    c.width = c.height = px;
    const x = c.getContext('2d');
    x.scale(DPR, DPR);
    const keep = g;
    g = x;
    try {
      drawJet(s * 0.625, s * 0.625, 0, s, { gear: 0, flame: 0, art: false });
    } finally {
      g = keep;
    }
    x.globalCompositeOperation = 'source-atop';
    const sc = x.createLinearGradient(0, s * 0.4, s * 1.25, s * 0.85);
    sc.addColorStop(0, 'rgba(30,8,24,.82)');
    sc.addColorStop(0.5, 'rgba(70,20,30,.55)');
    sc.addColorStop(1, 'rgba(20,6,18,.85)');
    x.fillStyle = sc;
    x.fillRect(0, 0, s * 1.25, s * 1.25);
    // glowing embers along the hull
    x.globalCompositeOperation = 'source-atop';
    x.fillStyle = 'rgba(255,140,60,.75)';
    for (let i = 0; i < 9; i++) x.fillRect(s * (0.2 + i * 0.09), s * (0.6 + Math.sin(i * 2.3) * 0.03), s * 0.03, s * 0.014);
    return c;
  }

  function buildBg() {
    bg = document.createElement('canvas');
    bg.width = Math.round(W * DPR);
    bg.height = Math.round(H * DPR);
    const b = bg.getContext('2d');
    b.scale(DPR, DPR);
    const sky = b.createLinearGradient(0, 0, 0, horizonY);
    sky.addColorStop(0, '#0b021d');
    sky.addColorStop(0.32, '#26084a');
    sky.addColorStop(0.62, '#6c176c');
    sky.addColorStop(0.86, '#d63a7c');
    sky.addColorStop(1, '#ff8a52');
    b.fillStyle = sky;
    b.fillRect(0, 0, W, horizonY + 1);
    stars.length = 0;
    for (let i = 0; i < Math.round(W * H / 2600); i++) {
      const s = { x: Math.random() * W, y: Math.random() * horizonY * 0.62, r: R(0.5, 1.4), p: R(0, TAU), v: R(1, 3) };
      if (i % 4) {
        b.fillStyle = `rgba(255,240,255,${R(0.15, 0.55)})`;
        b.fillRect(s.x, s.y, s.r, s.r);
      } else stars.push(s);
    }
    // the sun, with the classic stripes cut into its lower half
    const sr = Math.min(W * 0.24, horizonY * 0.5);
    const sx = W * 0.56;
    const sy = horizonY - sr * 0.28;
    const glow = b.createRadialGradient(sx, sy, sr * 0.5, sx, sy, sr * 2.6);
    glow.addColorStop(0, 'rgba(255,140,90,.5)');
    glow.addColorStop(1, 'rgba(255,61,154,0)');
    b.fillStyle = glow;
    b.fillRect(0, 0, W, horizonY);
    const sun = document.createElement('canvas');
    const sp = Math.ceil(sr * 2 * DPR) + 2;
    sun.width = sun.height = sp;
    const s = sun.getContext('2d');
    s.scale(DPR, DPR);
    const sg = s.createLinearGradient(0, 0, 0, sr * 2);
    sg.addColorStop(0, '#fff4a8');
    sg.addColorStop(0.42, '#ffb347');
    sg.addColorStop(0.75, '#ff5a86');
    sg.addColorStop(1, '#ff2e9a');
    s.fillStyle = sg;
    s.beginPath();
    s.arc(sr, sr, sr, 0, TAU);
    s.fill();
    s.globalCompositeOperation = 'destination-out';
    for (let i = 0; i < 8; i++) s.fillRect(0, sr * (0.92 + i * 0.13), sr * 2, 1 + i * 1.5 * (sr / 90));
    b.drawImage(sun, sx - sr, sy - sr, sp / DPR, sp / DPR);
    // mountains: far ridge, near ridge with a neon rim
    const ridge = (base, amp, n, fill, rim) => {
      b.beginPath();
      b.moveTo(0, horizonY + 1);
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const x = (i / n) * W;
        const peak = i % 2 ? amp * R(0.55, 1) : amp * R(0.05, 0.3);
        pts.push([x, base - peak]);
      }
      for (const [x, y] of pts) b.lineTo(x, y);
      b.lineTo(W, horizonY + 1);
      b.closePath();
      b.fillStyle = fill;
      b.fill();
      if (rim) {
        b.beginPath();
        pts.forEach(([x, y], i) => (i ? b.lineTo(x, y) : b.moveTo(x, y)));
        b.strokeStyle = rim;
        b.lineWidth = 1.5;
        b.stroke();
      }
    };
    ridge(horizonY, H * 0.11, 9, '#3b0f5e', null);
    ridge(horizonY, H * 0.065, 14, '#1d0636', 'rgba(255,90,200,.55)');
    const fl = b.createLinearGradient(0, horizonY, 0, H);
    fl.addColorStop(0, '#2c0a40');
    fl.addColorStop(1, '#08020f');
    b.fillStyle = fl;
    b.fillRect(0, horizonY, W, H - horizonY);
    b.fillStyle = 'rgba(255,160,210,.9)';
    b.fillRect(0, horizonY - 0.5, W, 1.5);
    floorGrad = g.createLinearGradient(0, horizonY, 0, H);
    floorGrad.addColorStop(0, 'rgba(255,61,200,0)');
    floorGrad.addColorStop(0.25, 'rgba(255,61,200,.35)');
    floorGrad.addColorStop(1, 'rgba(255,110,230,.95)');
  }

  function buildClouds() {
    clouds = [];
    const layers = [
      { n: 4, scale: 0.6, speed: 10, alpha: 0.5, front: false },
      { n: 3, scale: 0.95, speed: 24, alpha: 0.78, front: false },
      { n: 2, scale: 1.5, speed: 55, alpha: 0.4, front: true },
    ];
    for (const ly of layers) {
      const count = Math.max(1, Math.round(ly.n * clamp(W / 420, 0.8, 1.8)));
      for (let i = 0; i < count; i++) {
        const w = L * 2.6 * ly.scale * R(0.8, 1.3);
        const h = w * 0.3;
        clouds.push({ ...ly, w, h, spr: cloudSprite(w, h), x: R(-w, W), y: ly.front ? R(plotT * 0.6, groundY - h) : R(40, horizonY - h * 0.9) });
      }
    }
  }
  // re-measure on size changes only (never per frame: that forces a synchronous layout every frame)
  new ResizeObserver(() => layout()).observe(stage);
  addEventListener('resize', () => layout());
  layout();
  document.fonts?.ready.then(() => layout(true)); // the HUD's height (and so the flight band) depends on the font

  /* ---------- Graph mapping ---------- */
  const scaleAt = (t) => ({ xMax: Math.max(8, t / 0.74), yMax: Math.max(2, 1 + (mAt(t) - 1) / 0.7) });
  function toXY(ti, sc) {
    return {
      x: x0 + (ti / sc.xMax) * (plotR - x0),
      y: y0 - ((mAt(ti) - 1) / (sc.yMax - 1)) * (y0 - plotT),
    };
  }
  function slopeAngle(t, sc) {
    const dx = (plotR - x0) / sc.xMax;
    const dy = ((y0 - plotT) / (sc.yMax - 1)) * GROWTH * mAt(t);
    return -Math.min(0.7, Math.atan2(dy, dx) * 0.85);
  }

  /* ---------- Heat colour: white -> gold -> pink -> red, on a log scale ---------- */
  const HEAT = [[1, [255, 255, 255]], [2, [255, 226, 120]], [5, [255, 70, 160]], [10, [255, 40, 50]]];
  function heat(m) {
    if (m <= 1) return HEAT[0][1];
    for (let i = 1; i < HEAT.length; i++) {
      if (m <= HEAT[i][0]) {
        const [ma, ca] = HEAT[i - 1];
        const [mb, cb] = HEAT[i];
        const k = Math.log(m / ma) / Math.log(mb / ma);
        return ca.map((v, j) => Math.round(lerp(v, cb[j], k)));
      }
    }
    return HEAT[HEAT.length - 1][1];
  }

  /* ---------- Particles on the stage canvas ---------- */
  const P = [];
  function emit(o) {
    if (P.length >= 900) return null;
    const p = { vx: 0, vy: 0, g: 0, drag: 0, grow: 0, rot: Math.random() * TAU, vr: 0, drift: 0, age: 0, alpha: 1, ...o };
    P.push(p);
    return p;
  }
  const RMK = () => (fx.reducedMotion ? 0.4 : 1);

  function drawPeach(c, x, y, r, rot = 0) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    const gr = c.createRadialGradient(-r * 0.4, -r * 0.4, r * 0.1, 0, 0, r * 1.3);
    gr.addColorStop(0, '#ffe2c4');
    gr.addColorStop(0.55, '#ff9a66');
    gr.addColorStop(1, '#e8456a');
    c.fillStyle = gr;
    c.beginPath();
    c.arc(-r * 0.42, r * 0.06, r * 0.62, 0, TAU);
    c.arc(r * 0.42, r * 0.06, r * 0.62, 0, TAU);
    c.fill();
    c.strokeStyle = 'rgba(170,30,70,.7)';
    c.lineWidth = Math.max(0.8, r * 0.1);
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, -r * 0.42);
    c.quadraticCurveTo(-r * 0.1, r * 0.05, 0, r * 0.45);
    c.stroke();
    c.fillStyle = '#3fbf6a';
    c.beginPath();
    c.ellipse(r * 0.32, -r * 0.62, r * 0.36, r * 0.16, -0.5, 0, TAU);
    c.fill();
    c.restore();
  }

  function drawParticles(dt, worldV) {
    for (let i = P.length - 1; i >= 0; i--) {
      const p = P[i];
      p.age += dt;
      if (p.age < 0) continue;
      if (p.age >= p.life) {
        P[i] = P[P.length - 1];
        P.pop();
        continue;
      }
      const k = Math.exp(-p.drag * dt);
      p.vx *= k;
      p.vy = p.vy * k + p.g * dt;
      p.x += (p.vx - worldV * p.drift) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      const f = p.age / p.life;
      const sz = p.size * (1 + p.grow * f);
      switch (p.kind) {
        case 'hot': case 'fire': case 'pink': case 'glow': {
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = p.alpha * (1 - f) ** 1.3;
          const s = SPR[p.kind];
          g.drawImage(s, p.x - sz, p.y - sz, sz * 2, sz * 2);
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'smoke': case 'haze': {
          g.globalAlpha = p.alpha * (f < 0.15 ? f / 0.15 : 1 - (f - 0.15) / 0.85);
          g.drawImage(SPR[p.kind], p.x - sz, p.y - sz, sz * 2, sz * 2);
          break;
        }
        case 'spark': {
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 1 - f;
          g.strokeStyle = p.color || '#ffe9a0';
          g.lineWidth = p.size;
          g.lineCap = 'round';
          g.beginPath();
          g.moveTo(p.x, p.y);
          g.lineTo(p.x - p.vx * 0.035, p.y - p.vy * 0.035);
          g.stroke();
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'ring': {
          const e = easeOut(f);
          const r = p.size + (p.max - p.size) * e;
          g.globalAlpha = (1 - f) * p.alpha;
          g.strokeStyle = p.color || '#fff';
          g.lineWidth = Math.max(0.5, p.width * (1 - f));
          g.beginPath();
          g.ellipse(p.x, p.y, r, r * (p.flat || 1), 0, 0, TAU);
          g.stroke();
          break;
        }
        case 'wreck': {
          // the burning airframe tumbles down trailing fire and smoke, then hits the deck
          if (!p.landed && p.y >= groundY - L * 0.06) {
            p.landed = true;
            p.y = groundY - L * 0.06;
            p.vy = 0;
            p.vx *= 0.2;
            p.g = 0;
            p.vr = 0;
            p.rot = Math.round(p.rot / Math.PI) * Math.PI + 0.12;
            if (p.onLand) p.onLand(p);
          }
          p.acc = (p.acc || 0) + dt * (p.landed ? 9 : 42) * RMK();
          while (p.acc >= 1) {
            p.acc -= 1;
            const hot = Math.random() < (p.landed ? 0.35 : 0.55);
            emit(hot
              ? { kind: 'fire', x: p.x + R(-8, 8), y: p.y + R(-4, 4), vx: R(-30, 30), vy: R(-90, -30), drag: 2, life: R(0.25, 0.5), size: L * R(0.06, 0.13), grow: 0.4, alpha: 0.85 }
              : { kind: 'smoke', x: p.x + R(-6, 6), y: p.y, vx: R(-20, 20), vy: R(-70, -30), drag: 1, g: -20, life: R(0.9, 1.6), size: L * R(0.07, 0.13), grow: 1.8, alpha: 0.75 });
          }
          g.globalAlpha = f > 0.82 ? (1 - f) / 0.18 : 1;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.rot);
          const d = sz * 1.25;
          if (SPR.wreck) g.drawImage(SPR.wreck, -d / 2, -d / 2, d, d);
          g.restore();
          break;
        }
        case 'debris': {
          g.globalAlpha = f > 0.75 ? (1 - f) / 0.25 : 1;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.rot);
          g.fillStyle = p.color;
          g.beginPath();
          g.moveTo(-sz, -sz * 0.4);
          g.lineTo(sz * 0.8, -sz * 0.7);
          g.lineTo(sz, sz * 0.5);
          g.lineTo(-sz * 0.4, sz * 0.7);
          g.closePath();
          g.fill();
          g.fillStyle = 'rgba(255,255,255,.6)';
          g.fillRect(-sz * 0.5, -sz * 0.35, sz * 0.9, sz * 0.18);
          g.restore();
          break;
        }
        case 'peach': {
          g.globalAlpha = f > 0.8 ? (1 - f) / 0.2 : 1;
          drawPeach(g, p.x, p.y, sz, p.rot);
          break;
        }
        case 'star': {
          g.globalCompositeOperation = 'lighter';
          g.globalAlpha = 1 - f;
          g.save();
          g.translate(p.x, p.y);
          g.rotate(p.rot);
          g.fillStyle = p.color || '#fff6c8';
          const s = sz * (0.6 + 0.4 * Math.sin(p.age * 18));
          g.beginPath();
          for (let j = 0; j < 8; j++) {
            const rr = j % 2 ? s * 0.25 : s;
            g.lineTo(Math.cos((j / 8) * TAU) * rr, Math.sin((j / 8) * TAU) * rr);
          }
          g.fill();
          g.restore();
          g.globalCompositeOperation = 'source-over';
          break;
        }
        case 'chute': {
          g.globalAlpha = f > 0.7 ? (1 - f) / 0.3 : Math.min(1, p.age * 6);
          g.save();
          g.translate(p.x, p.y);
          g.rotate(Math.sin(p.age * 3) * 0.2);
          const s = sz;
          g.fillStyle = p.color;
          g.beginPath();
          g.arc(0, 0, s, Math.PI, 0);
          g.closePath();
          g.fill();
          g.strokeStyle = 'rgba(255,240,250,.8)';
          g.lineWidth = 0.8;
          g.beginPath();
          g.moveTo(-s, 0);
          g.lineTo(0, s * 1.3);
          g.lineTo(s, 0);
          g.moveTo(0, 0);
          g.lineTo(0, s * 1.3);
          g.stroke();
          g.fillStyle = '#ffcf4a';
          g.beginPath();
          g.arc(0, s * 1.4, s * 0.28, 0, TAU);
          g.fill();
          g.restore();
          break;
        }
        default: break;
      }
    }
    g.globalAlpha = 1;
  }

  /* ---------- The Hot Buns ---------- */
  function drawFlame(s, k, now) {
    const flick = 0.86 + 0.14 * Math.sin(now * 0.045) + Math.random() * 0.12;
    const len = s * (0.18 + 0.62 * k) * flick;
    const x = -0.5 * s;
    g.save();
    g.globalCompositeOperation = 'lighter';
    let gr = g.createLinearGradient(x, 0, x - len, 0);
    gr.addColorStop(0, 'rgba(255,150,220,.95)');
    gr.addColorStop(0.45, 'rgba(255,61,154,.55)');
    gr.addColorStop(1, 'rgba(120,40,255,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(x, -0.055 * s);
    g.quadraticCurveTo(x - len * 0.45, -0.085 * s, x - len, 0);
    g.quadraticCurveTo(x - len * 0.45, 0.085 * s, x, 0.055 * s);
    g.fill();
    gr = g.createLinearGradient(x, 0, x - len * 0.6, 0);
    gr.addColorStop(0, 'rgba(255,255,240,1)');
    gr.addColorStop(0.5, 'rgba(255,220,120,.8)');
    gr.addColorStop(1, 'rgba(255,140,60,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(x, -0.03 * s);
    g.quadraticCurveTo(x - len * 0.3, -0.04 * s, x - len * 0.6, 0);
    g.quadraticCurveTo(x - len * 0.3, 0.04 * s, x, 0.03 * s);
    g.fill();
    if (k > 0.45) {
      g.fillStyle = 'rgba(255,255,255,.75)';
      for (let i = 1; i <= 3; i++) {
        const dx = x - len * 0.16 * i;
        const r = s * 0.022 * (1 - i * 0.2);
        g.beginPath();
        g.moveTo(dx + r * 1.8, 0);
        g.lineTo(dx, -r);
        g.lineTo(dx - r * 1.8, 0);
        g.lineTo(dx, r);
        g.fill();
      }
    }
    g.restore();
  }

  function drawJet(x, y, ang, s, o = {}) {
    const { gear = 0, flame = 0, now = 0, alpha = 1, art = true } = o;
    g.save();
    g.translate(x, y);
    g.rotate(ang);
    g.globalAlpha = alpha;
    if (flame > 0) drawFlame(s, flame, now);
    const line = Math.max(1, s * 0.012);
    g.lineJoin = 'round';
    g.strokeStyle = 'rgba(28,8,48,.6)';
    g.lineWidth = line;
    // far wing and far stabilizer
    g.fillStyle = '#4f5480';
    g.beginPath();
    g.moveTo(0.04 * s, -0.035 * s);
    g.lineTo(-0.2 * s, -0.15 * s);
    g.lineTo(-0.28 * s, -0.15 * s);
    g.lineTo(-0.2 * s, -0.035 * s);
    g.closePath();
    g.fill();
    // tail fin, hot pink with an aviator-gold flash
    let gr = g.createLinearGradient(0, -0.36 * s, 0, -0.04 * s);
    gr.addColorStop(0, '#ff8fcf');
    gr.addColorStop(1, '#c0136a');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(-0.25 * s, -0.055 * s);
    g.lineTo(-0.4 * s, -0.33 * s);
    g.lineTo(-0.475 * s, -0.33 * s);
    g.lineTo(-0.47 * s, -0.055 * s);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#ffcf4a';
    g.beginPath();
    g.moveTo(-0.335 * s, -0.2 * s);
    g.lineTo(-0.375 * s, -0.265 * s);
    g.lineTo(-0.474 * s, -0.265 * s);
    g.lineTo(-0.473 * s, -0.2 * s);
    g.closePath();
    g.fill();
    // fuselage in chrome
    gr = g.createLinearGradient(0, -0.085 * s, 0, 0.085 * s);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.32, '#d3daee');
    gr.addColorStop(0.52, '#666c94');
    gr.addColorStop(0.7, '#b2bad8');
    gr.addColorStop(1, '#eef1fa');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(0.53 * s, 0.018 * s);
    g.bezierCurveTo(0.42 * s, -0.035 * s, 0.26 * s, -0.075 * s, 0.1 * s, -0.078 * s);
    g.lineTo(-0.44 * s, -0.066 * s);
    g.lineTo(-0.49 * s, -0.048 * s);
    g.lineTo(-0.49 * s, 0.056 * s);
    g.lineTo(-0.3 * s, 0.078 * s);
    g.bezierCurveTo(0.08 * s, 0.088 * s, 0.36 * s, 0.07 * s, 0.53 * s, 0.018 * s);
    g.closePath();
    g.fill();
    g.stroke();
    // pink racing stripe
    g.fillStyle = 'rgba(255,61,154,.9)';
    g.beginPath();
    g.moveTo(0.42 * s, 0.03 * s);
    g.lineTo(-0.46 * s, 0.03 * s);
    g.lineTo(-0.46 * s, 0.045 * s);
    g.lineTo(0.38 * s, 0.045 * s);
    g.closePath();
    g.fill();
    // intake
    g.fillStyle = '#1e1a33';
    g.beginPath();
    g.moveTo(0.04 * s, -0.004 * s);
    g.lineTo(-0.15 * s, -0.01 * s);
    g.lineTo(-0.15 * s, 0.03 * s);
    g.lineTo(0.0, 0.03 * s);
    g.closePath();
    g.fill();
    // canopy and the pilot's gold visor
    gr = g.createLinearGradient(0.05 * s, -0.15 * s, 0.25 * s, -0.05 * s);
    gr.addColorStop(0, '#7ff8ff');
    gr.addColorStop(0.5, '#2048a8');
    gr.addColorStop(1, '#0c1030');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(0.31 * s, -0.052 * s);
    g.bezierCurveTo(0.23 * s, -0.152 * s, 0.05 * s, -0.152 * s, -0.05 * s, -0.072 * s);
    g.closePath();
    g.fill();
    g.stroke();
    if (art) {
      g.fillStyle = '#2a1238';
      g.beginPath();
      g.arc(0.1 * s, -0.085 * s, 0.034 * s, 0, TAU);
      g.fill();
      g.fillStyle = '#ffcf4a';
      g.fillRect(0.105 * s, -0.098 * s, 0.035 * s, 0.014 * s);
    }
    g.strokeStyle = 'rgba(255,255,255,.85)';
    g.lineWidth = s * 0.012;
    g.beginPath();
    g.moveTo(0.21 * s, -0.11 * s);
    g.quadraticCurveTo(0.14 * s, -0.135 * s, 0.05 * s, -0.115 * s);
    g.stroke();
    g.strokeStyle = 'rgba(28,8,48,.6)';
    g.lineWidth = line;
    // near wing: big chrome delta with a pink tip
    gr = g.createLinearGradient(0, 0.02 * s, 0, 0.23 * s);
    gr.addColorStop(0, '#e9edf9');
    gr.addColorStop(1, '#757ca6');
    g.fillStyle = gr;
    g.beginPath();
    g.moveTo(0.09 * s, 0.04 * s);
    g.lineTo(-0.23 * s, 0.215 * s);
    g.lineTo(-0.32 * s, 0.215 * s);
    g.lineTo(-0.27 * s, 0.05 * s);
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = '#ff3d9a';
    g.beginPath();
    g.moveTo(-0.205 * s, 0.2 * s);
    g.lineTo(-0.23 * s, 0.215 * s);
    g.lineTo(-0.32 * s, 0.215 * s);
    g.lineTo(-0.315 * s, 0.2 * s);
    g.closePath();
    g.fill();
    // near stabilizer
    g.fillStyle = '#c3c9e2';
    g.beginPath();
    g.moveTo(-0.36 * s, 0.05 * s);
    g.lineTo(-0.465 * s, 0.13 * s);
    g.lineTo(-0.505 * s, 0.13 * s);
    g.lineTo(-0.475 * s, 0.05 * s);
    g.closePath();
    g.fill();
    g.stroke();
    // nozzle
    g.fillStyle = '#2b2440';
    g.beginPath();
    g.moveTo(-0.49 * s, -0.048 * s);
    g.lineTo(-0.535 * s, -0.04 * s);
    g.lineTo(-0.535 * s, 0.05 * s);
    g.lineTo(-0.49 * s, 0.056 * s);
    g.closePath();
    g.fill();
    // nose art: the peach
    if (art) drawPeach(g, 0.3 * s, 0.022 * s, 0.05 * s, 0.1);
    // landing gear
    if (gear > 0.02) {
      const d = 0.085 * s * gear;
      g.strokeStyle = '#3a3550';
      g.lineWidth = Math.max(1.5, s * 0.02);
      g.beginPath();
      g.moveTo(-0.2 * s, 0.07 * s);
      g.lineTo(-0.2 * s, 0.07 * s + d);
      g.moveTo(0.3 * s, 0.055 * s);
      g.lineTo(0.3 * s, 0.055 * s + d);
      g.stroke();
      g.fillStyle = '#16121f';
      g.beginPath();
      g.arc(-0.2 * s, 0.07 * s + d, 0.032 * s * gear, 0, TAU);
      g.arc(0.3 * s, 0.055 * s + d, 0.025 * s * gear, 0, TAU);
      g.fill();
    }
    g.restore();
  }

  /* ---------- Background layers ---------- */
  let grid = 0;
  let lat = 0;
  function drawFloor() {
    const top = horizonY;
    const bot = H;
    const vx = W * 0.56;
    g.save();
    g.beginPath();
    g.rect(0, top, W, bot - top);
    g.clip();
    g.strokeStyle = floorGrad;
    g.lineWidth = 1.3;
    g.beginPath();
    const ph = grid % 1;
    for (let k = 0; k < 16; k++) {
      const z = k + 1 - ph;
      if (z < 0.05) continue;
      const y = top + (bot - top) * (0.9 / (z * 0.9 + 0.12)) * 0.95;
      if (y > bot + 2 || y < top) continue;
      g.moveTo(0, y);
      g.lineTo(W, y);
    }
    const sp = W * 0.11;
    const off = (lat % 1) * sp;
    for (let i = -14; i <= 14; i++) {
      const bx = vx + i * sp * 2.2 - off * 2.2;
      g.moveTo(vx + (bx - vx) * 0.04, top);
      g.lineTo(bx, bot);
    }
    g.stroke();
    g.restore();
  }

  function drawRunway(now) {
    const y = groundY;
    const end = W * 0.95 - S.runOff;
    if (end < -20) return;
    const start = -20 - S.runOff;
    g.fillStyle = '#120818';
    g.fillRect(Math.max(-2, start), y, Math.min(W + 2, end) - Math.max(-2, start), 11);
    g.fillStyle = 'rgba(255,120,220,.5)';
    g.fillRect(Math.max(-2, start), y, Math.min(W + 2, end) - Math.max(-2, start), 1.5);
    g.fillStyle = 'rgba(255,255,255,.75)';
    const dash = 26;
    for (let x = start + 10; x < Math.min(W, end - 12); x += dash * 2) if (x > -dash) g.fillRect(x, y + 5, dash, 2);
    const blink = (Math.sin(now * 0.008) + 1) / 2;
    for (let x = start + 6, i = 0; x < Math.min(W + 10, end); x += 34, i++) {
      if (x < -10) continue;
      const col = i % 2 ? `rgba(255,207,74,${0.55 + blink * 0.45})` : `rgba(62,240,255,${0.55 + (1 - blink) * 0.45})`;
      g.fillStyle = col;
      g.beginPath();
      g.arc(x, y + 1, 2.2, 0, TAU);
      g.fill();
      g.globalCompositeOperation = 'lighter';
      g.globalAlpha = 0.35;
      g.drawImage(SPR.glow, x - 8, y - 7, 16, 16);
      g.globalAlpha = 1;
      g.globalCompositeOperation = 'source-over';
    }
    // end-of-runway chevrons
    if (end < W + 10) {
      g.fillStyle = '#ffcf4a';
      for (let i = 0; i < 3; i++) {
        const x = end - 6 - i * 7;
        g.beginPath();
        g.moveTo(x, y + 2);
        g.lineTo(x + 4, y + 5.5);
        g.lineTo(x, y + 9);
        g.lineTo(x - 2, y + 9);
        g.lineTo(x + 2, y + 5.5);
        g.lineTo(x - 2, y + 2);
        g.fill();
      }
    }
  }

  function drawClouds(dt, front) {
    for (const c of clouds) {
      if (c.front !== front) continue;
      if (dt) {
        c.x -= dt * c.speed * S.spd * (fx.reducedMotion ? 0.5 : 1);
        if (c.x < -c.w - 10) {
          c.x = W + R(10, W * 0.5);
          c.y = c.front ? R(plotT * 0.6, groundY - c.h) : R(40, horizonY - c.h * 0.9);
        }
      }
      g.globalAlpha = c.alpha;
      g.drawImage(c.spr, c.x, c.y, c.w, c.h);
    }
    g.globalAlpha = 1;
  }

  function drawSpeedLines(dt, m) {
    const want = S.phase === 'fly' && !fx.reducedMotion ? Math.min(18, Math.floor((m - 1.6) * 2.2)) : 0;
    while (lines.length < want) lines.push({ x: W + R(0, W), y: R(plotT * 0.4, groundY - 10), len: R(30, 90), v: R(600, 1100) });
    if (!lines.length) return;
    g.strokeStyle = 'rgba(255,230,250,.35)';
    g.lineWidth = 1.2;
    g.beginPath();
    for (let i = lines.length - 1; i >= 0; i--) {
      const l = lines[i];
      l.x -= l.v * dt * (0.6 + 0.2 * Math.log(m));
      if (l.x + l.len < 0) {
        if (lines.length > want) { lines.splice(i, 1); continue; }
        l.x = W + R(0, W * 0.3);
        l.y = R(plotT * 0.4, groundY - 10);
      }
      g.moveTo(l.x, l.y);
      g.lineTo(l.x + l.len, l.y);
    }
    g.stroke();
  }

  function drawGraph(t, sc, opts) {
    const { danger, crashed, alpha } = opts;
    const m = mAt(t);
    g.save();
    g.globalAlpha = alpha;
    // guide lines at friendly multipliers
    g.font = `700 ${clamp(W / 34, 11, 14)}px "Barlow Condensed", "Arial Narrow", sans-serif`;
    g.textBaseline = 'middle';
    let lastY = 1e9;
    for (const v of [1.5, 2, 3, 5, 10, 20, 50, 100, 200, 500, 1000]) {
      if (v >= sc.yMax) break;
      const y = y0 - ((v - 1) / (sc.yMax - 1)) * (y0 - plotT);
      if (lastY - y < 30) continue;
      lastY = y;
      g.strokeStyle = 'rgba(255,200,240,.16)';
      g.lineWidth = 1;
      g.setLineDash([3, 6]);
      g.beginPath();
      g.moveTo(x0 - L * 0.3, y);
      g.lineTo(W, y);
      g.stroke();
      g.setLineDash([]);
      g.fillStyle = 'rgba(255,220,245,.55)';
      g.fillText(`${v}x`, 6, y);
    }
    if (t > 0) {
      const N = 64;
      const pts = [];
      for (let i = 0; i <= N; i++) pts.push(toXY((t * i) / N, sc));
      const head = pts[N];
      const col = crashed ? [255, 60, 80] : danger ? [255, 50, 70] : heat(m);
      const rgb = `${col[0]},${col[1]},${col[2]}`;
      // area under the curve: a glow that hangs from the curve and fades toward the deck
      const fill = g.createLinearGradient(0, Math.min(head.y, y0 - 20), 0, y0 + 6);
      fill.addColorStop(0, `rgba(${rgb},.5)`);
      fill.addColorStop(0.45, `rgba(${rgb},.26)`);
      fill.addColorStop(1, `rgba(${rgb},.04)`);
      g.beginPath();
      g.moveTo(pts[0].x, y0);
      for (const p of pts) g.lineTo(p.x, p.y);
      g.lineTo(head.x, y0);
      g.closePath();
      // a dusky veil first, so the area still reads where it crosses the bright sun
      g.fillStyle = 'rgba(28,4,48,.34)';
      g.fill();
      g.fillStyle = fill;
      g.fill();
      // scrolling vertical hatching inside the fill for that 80s print look (it rushes past faster as the world speeds up)
      g.save();
      g.clip();
      g.strokeStyle = `rgba(${rgb},.3)`;
      g.lineWidth = 1;
      g.beginPath();
      const gap = 9;
      const off = gap - ((lat * 120) % gap);
      for (let x = x0 + off; x < head.x; x += gap) {
        g.moveTo(x, plotT - 10);
        g.lineTo(x, y0);
      }
      g.stroke();
      // a hot drop line from the jet to the deck, so the fill's leading edge reads as intentional
      const drop = g.createLinearGradient(0, head.y, 0, y0);
      drop.addColorStop(0, `rgba(${rgb},.85)`);
      drop.addColorStop(1, `rgba(${rgb},0)`);
      g.fillStyle = drop;
      g.fillRect(head.x - 1.5, head.y, 3, y0 - head.y);
      g.restore();
      g.lineCap = 'round';
      g.lineJoin = 'round';
      const path = () => {
        g.beginPath();
        pts.forEach((p, i) => (i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y)));
      };
      path();
      g.strokeStyle = `rgba(${rgb},.25)`;
      g.lineWidth = 12;
      g.stroke();
      path();
      g.strokeStyle = `rgb(${rgb})`;
      g.lineWidth = 4;
      g.stroke();
      path();
      g.strokeStyle = 'rgba(255,255,255,.85)';
      g.lineWidth = 1.4;
      g.stroke();
    }
    // auto eject target line
    if (S.targetC && (S.player === 'in' || S.player === 'out') && S.phase !== 'idle') {
      const v = S.targetC / 100;
      if (v < sc.yMax) {
        const y = y0 - ((v - 1) / (sc.yMax - 1)) * (y0 - plotT);
        const near = S.player === 'in' && m >= v * 0.8;
        g.strokeStyle = near ? `rgba(255,207,74,${0.6 + 0.4 * Math.sin(performance.now() * 0.02)})` : 'rgba(255,207,74,.6)';
        g.lineWidth = near ? 2.5 : 1.5;
        g.setLineDash([8, 6]);
        g.beginPath();
        g.moveTo(x0, y);
        g.lineTo(W - 4, y);
        g.stroke();
        g.setLineDash([]);
        g.fillStyle = '#ffcf4a';
        g.textAlign = 'right';
        g.fillText(`AUTO ${xs(S.targetC)}`, W - 8, y - 10);
        g.textAlign = 'left';
      }
    }
    // where Buns bailed
    if (S.ejectC && S.player === 'out' && S.ejectT <= t + 1e-6) {
      const p = toXY(S.ejectT, sc);
      const labelOn = slamEl.classList.contains('fade') || !slamEl.firstChild;
      g.fillStyle = '#4dffb0';
      g.strokeStyle = '#08130e';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(p.x, p.y, 6, 0, TAU);
      g.fill();
      g.stroke();
      if (labelOn) {
        g.font = `800 ${clamp(W / 28, 12, 16)}px "Barlow Condensed", sans-serif`;
        const label = `BAILED ${xs(S.ejectC)}`;
        const tw = g.measureText(label).width;
        const lx = clamp(p.x - tw / 2, 4, W - tw - 4);
        g.fillStyle = 'rgba(8,20,14,.75)';
        g.fillRect(lx - 4, p.y + 9, tw + 8, 18);
        g.fillStyle = '#4dffb0';
        g.fillText(label, lx, p.y + 18.5);
      }
    }
    g.restore();
  }

  /* ---------- Sonic boom: a vapour cone that blooms around the fuselage and sweeps back ---------- */
  function sonicBoom(k) {
    S.cones.push({ t0: performance.now(), ms: 520, k });
    if (S.cones.length > 3) S.cones.shift();
    const j = S.jet;
    if (j) {
      emit({ kind: 'ring', x: j.x, y: j.y, size: L * 0.3, max: L * (1.6 + k * 0.8), width: 3, life: 0.45, color: '#ffffff', alpha: 0.85 });
      for (let i = 0; i < 16 * RMK(); i++) {
        const a = R(-1.1, 1.1) + Math.PI + (j.ang || 0);
        const sp = R(120, 320);
        emit({ kind: 'haze', x: j.x + R(-L * 0.2, L * 0.1), y: j.y + R(-L * 0.25, L * 0.25), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 2.4, life: R(0.4, 0.8), size: L * R(0.08, 0.16), grow: 1.4, alpha: 0.6, drift: 0.6 });
      }
    }
    // the crack: a hard transient, then a low thump
    sfx.noise({ type: 'highpass', freq: 1800, dur: 0.09, vol: 0.32 * k, attack: 0.002 });
    sfx.noise({ type: 'lowpass', freq: 600, to: 90, dur: 0.45, vol: 0.3 * k, attack: 0.004, delay: 0.03 });
    sfx.tone({ freq: 90, to: 36, dur: 0.32, vol: 0.34 * k, delay: 0.03 });
    engine.surge(1);
    if (!fx.reducedMotion) S.kick = Math.max(S.kick, 3 + 3 * k);
    fx.vibrate(18);
  }
  function drawCones(x, y, ang, now) {
    for (let i = S.cones.length - 1; i >= 0; i--) {
      const c = S.cones[i];
      const k = (now - c.t0) / c.ms;
      if (k >= 1) {
        S.cones.splice(i, 1);
        continue;
      }
      if (k < 0) continue;
      const e = easeOut(k);
      const ry = L * (0.2 + 0.5 * e) * (0.8 + 0.2 * c.k);
      const rx = L * (0.07 + 0.16 * e);
      g.save();
      g.translate(x, y);
      g.rotate(ang);
      g.translate(-L * (0.02 + 0.42 * e), 0);
      g.scale(rx / ry, 1);
      const gr = g.createRadialGradient(0, 0, ry * 0.15, 0, 0, ry);
      gr.addColorStop(0, 'rgba(255,255,255,0)');
      gr.addColorStop(0.72, `rgba(255,240,252,${0.42 * (1 - k)})`);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(0, 0, ry, 0, TAU);
      g.fill();
      // bright bow edge facing forward
      g.strokeStyle = `rgba(255,255,255,${0.9 * (1 - k) ** 1.5})`;
      g.lineWidth = (2.6 * ry) / rx / 2;
      g.beginPath();
      g.arc(0, 0, ry * 0.9, -1.35, 1.35);
      g.stroke();
      g.restore();
    }
  }
  // the empty jet flies on with its own little readout: what might have been
  function drawGhostLabel(x, y, c) {
    const txt = `${(c / 100).toFixed(2)}x`;
    const fs = clamp(W / 20, 15, 26);
    g.save();
    g.font = `800 ${fs}px "Barlow Condensed", "Arial Narrow", sans-serif`;
    const tw = g.measureText(txt).width;
    const bw = tw + fs * 0.8;
    const bh = fs * 1.22;
    const bx = clamp(x - bw / 2, 6, W - bw - 6);
    const by = clamp(y - L * 0.42 - bh, plotT * 0.55, H - bh - 6);
    const col = heat(c / 100);
    g.fillStyle = 'rgba(14,4,26,.72)';
    g.strokeStyle = `rgba(${col},.75)`;
    g.lineWidth = 1.5;
    g.beginPath();
    g.roundRect ? g.roundRect(bx, by, bw, bh, bh / 2) : g.rect(bx, by, bw, bh);
    g.fill();
    g.stroke();
    g.fillStyle = `rgb(${col})`;
    g.textBaseline = 'middle';
    g.textAlign = 'center';
    g.fillText(txt, bx + bw / 2, by + bh / 2 + 1);
    g.restore();
  }
  // idle life: now and then a wingman tears across the sunset trailing a contrail
  function drawFlyby(now) {
    if (!S.flyby) {
      if (now < S.nextFlyby || fx.reducedMotion || document.hidden) return;
      const dir = Math.random() < 0.5 ? 1 : -1;
      S.flyby = { t0: now, ms: R(1500, 2300), dir, y: R(H * 0.1, horizonY * 0.45), s: L * R(0.3, 0.42), climb: R(-0.12, 0.05) };
    }
    const f = S.flyby;
    const k = (now - f.t0) / f.ms;
    if (k >= 1) {
      S.flyby = null;
      S.nextFlyby = now + R(6000, 11000);
      return;
    }
    const span = W + f.s * 4;
    const px = f.dir > 0 ? -f.s * 2 + span * k : W + f.s * 2 - span * k;
    const py = f.y + f.climb * span * k;
    const tail = Math.min(span * k, W * 0.55);
    const tg = g.createLinearGradient(px, 0, px - f.dir * tail, 0);
    tg.addColorStop(0, 'rgba(255,230,250,.55)');
    tg.addColorStop(1, 'rgba(255,230,250,0)');
    g.strokeStyle = tg;
    g.lineWidth = Math.max(1.2, f.s * 0.05);
    g.beginPath();
    g.moveTo(px - f.dir * f.s * 0.5, py);
    g.lineTo(px - f.dir * (f.s * 0.5 + tail), py - f.climb * tail);
    g.stroke();
    g.save();
    g.translate(px, py);
    g.scale(f.dir, 1);
    drawJet(0, 0, Math.atan(f.climb), f.s, { flame: 0.8, now, alpha: 0.85, art: false });
    g.restore();
  }

  /* ---------- Render loop (all timing from performance.now) ---------- */
  let prevNow = performance.now();
  let lastFrame = 0;
  let flameAcc = 0;
  let smokeAcc = 0;
  let dzFlick = 0;
  function render(now) {
    const dt = Math.min(0.05, Math.max(0, (now - prevNow) / 1000));
    prevNow = now;
    if (now < freezeUntil) return; // hit-stop holds the frame
    const rm = fx.reducedMotion;
    const ph = S.phase;
    let t = 0;
    let m = 1;
    let p = 0;
    let target = 0.35;
    if (ph === 'roll') {
      p = clamp((now - S.rollAt) / (S.rollEnd - S.rollAt), 0, 1);
      target = 0.35 + 2.4 * p * p;
    } else if (ph === 'fly') {
      t = Math.min(flightT(now), tAt(S.crashC / 100));
      m = mAt(t);
      target = 2.6 + 2.2 * Math.log(m);
    } else if (ph === 'boom') {
      t = S.boomT;
      m = S.crashC / 100;
      target = 0.6;
    }
    S.spd += (target - S.spd) * Math.min(1, dt * (ph === 'boom' ? 1.5 : 5));
    const worldV = S.spd * 70;
    if (ph === 'roll' || ph === 'fly') S.runOff += dt * worldV * (ph === 'roll' ? 1.6 : 1);
    grid += dt * S.spd * (rm ? 0.35 : 0.9);
    lat += dt * S.spd * (rm ? 0.1 : 0.32);

    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    g.drawImage(bg, 0, 0, W, H);
    // twinkles and a breathing sun glow
    for (const s of stars) {
      g.fillStyle = `rgba(255,245,255,${0.35 + 0.65 * Math.abs(Math.sin(s.p + now * 0.001 * s.v))})`;
      g.fillRect(s.x, s.y, s.r * 1.5, s.r * 1.5);
    }
    const pulse = 0.5 + 0.5 * Math.sin(now * 0.0016);
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = 0.12 + 0.1 * pulse;
    const sr = Math.min(W * 0.24, horizonY * 0.5) * 2.4;
    g.drawImage(SPR.glow, W * 0.56 - sr, horizonY - sr * 0.45, sr * 2, sr * 1.1);
    g.globalAlpha = 1;
    g.globalCompositeOperation = 'source-over';
    drawFloor();

    // camera shake that grows with the multiplier
    let amp = 0;
    if (!rm) {
      if (ph === 'roll') amp = 0.4 + 1.6 * p;
      else if (ph === 'fly') amp = Math.min(7, 0.5 + 1.5 * Math.log2(m)) * (S.player === 'in' ? 1 : 0.5);
      amp += S.kick;
    }
    S.kick *= Math.exp(-dt * 7);
    if (S.kick < 0.05) S.kick = 0;
    g.save();
    if (amp) g.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
    drawClouds(dt, false);
    if (ph === 'idle') drawFlyby(now);
    drawSpeedLines(dt, m);
    drawRunway(now);

    // the curve
    if (ph === 'fly' || ph === 'boom') {
      S.curveFade = 1;
      drawGraph(t, scaleAt(t), { danger: m >= 10, crashed: ph === 'boom', alpha: 1 });
    } else if (S.curveFade > 0 && S.boomT) {
      S.curveFade = Math.max(0, S.curveFade - dt * 2.5);
      drawGraph(S.boomT, scaleAt(S.boomT), { crashed: true, alpha: S.curveFade });
    }

    // jet position and attitude
    let jx = x0;
    let jy = y0;
    let ang = 0;
    let gear = 1;
    let flame = 0.12 + 0.05 * Math.sin(now * 0.02);
    let power = 0;
    let showJet = true;
    if (ph === 'idle') {
      const k = clamp((now - S.taxiAt) / 1000, 0, 1);
      jx = lerp(-L * 0.8, x0, easeBack(k));
      jy = y0 + Math.sin(now * 0.03) * 0.35;
      S.ang = 0;
    } else if (ph === 'roll') {
      jy = y0 + (Math.random() - 0.5) * (rm ? 0 : 1.2 * p);
      const rot = p > 0.72 ? -0.2 * easeOut((p - 0.72) / 0.28) : 0;
      S.ang += (rot - S.ang) * Math.min(1, dt * 12);
      ang = S.ang;
      flame = 0.3 + 0.7 * p;
      power = 0.35 + 0.65 * p;
    } else if (ph === 'fly') {
      const sc = scaleAt(t);
      const h = toXY(t, sc);
      jx = h.x;
      jy = h.y;
      const a = slopeAngle(t, sc);
      S.ang += (a - S.ang) * Math.min(1, dt * 7);
      ang = S.ang + Math.sin(now * 0.004) * 0.025;
      gear = Math.max(0, 1 - (now - S.gearAt) / 450);
      flame = 0.78 + 0.22 * Math.min(1, Math.log(m) / Math.log(20));
      power = 1;
    } else {
      showJet = false;
    }

    // wingmen in loose formation behind the leader
    if (ph === 'fly') {
      const sc = scaleAt(t);
      let i = 0;
      for (const w of wing) {
        if (w.state !== 'air' || i >= 3) continue;
        const ti = t - 0.8 * (i + 1);
        if (ti > 0.05) {
          const q = toXY(ti, sc);
          const off = (i % 2 ? 1 : -1) * (12 + i * 6);
          w.xy = { x: q.x - L * 0.2, y: q.y + off };
          drawJet(w.xy.x, w.xy.y, slopeAngle(ti, sc), L * 0.38, { flame: 0.7, now: now + i * 300, alpha: 0.5, art: false });
        } else w.xy = { x: x0, y: y0 };
        i++;
      }
    }

    // exhaust particles
    if (showJet && dt > 0) {
      const cos = Math.cos(ang);
      const sin = Math.sin(ang);
      const nx = jx - cos * L * 0.53;
      const ny = jy - sin * L * 0.53;
      const rate = (ph === 'fly' ? 70 + 30 * Math.log(m) : ph === 'roll' ? 25 + 70 * p : 3) * RMK();
      flameAcc += rate * dt;
      while (flameAcc >= 1) {
        flameAcc -= 1;
        const sp = R(140, 260) * (ph === 'idle' ? 0.25 : 1);
        emit({ kind: Math.random() < 0.3 ? 'hot' : Math.random() < 0.6 ? 'fire' : 'pink', x: nx, y: ny + R(-2, 2), vx: -cos * sp + R(-30, 30), vy: -sin * sp + R(-30, 30), drag: 3, life: R(0.16, ph === 'idle' ? 0.25 : 0.42), size: L * R(0.05, 0.09), grow: -0.5, drift: ph === 'fly' ? 0.6 : 0 });
      }
      smokeAcc += (ph === 'fly' ? 16 : ph === 'roll' ? 12 * p : 0) * RMK() * dt;
      while (smokeAcc >= 1) {
        smokeAcc -= 1;
        emit({ kind: 'haze', x: nx - cos * L * 0.2, y: ny, vx: -cos * 60, vy: -sin * 60 - 10, drag: 1.2, life: R(0.7, 1.2), size: L * R(0.08, 0.14), grow: 2, drift: 1, alpha: 0.55 });
      }
      if (ph === 'roll' && Math.random() < p * 0.6 * RMK()) {
        emit({ kind: 'spark', x: jx - L * 0.2, y: groundY, vx: -R(200, 500), vy: -R(20, 120), g: 600, drag: 1, life: R(0.2, 0.4), size: 1.5 });
      }
    }

    drawParticles(dt, ph === 'fly' ? worldV * 0.8 : ph === 'roll' ? worldV * 1.2 : 0);
    if (showJet) {
      drawJet(jx, jy, ang, L, { gear, flame, now });
      if (S.cones.length) drawCones(jx, jy, ang, now);
      if (S.player === 'out' && ph === 'fly' && S.shownC > 0) drawGhostLabel(jx, jy, S.shownC);
    }
    drawClouds(dt, true);
    g.restore();
    S.jet = { x: jx, y: jy, ang };

    // audio follows the throttle
    if (ph === 'roll' || ph === 'fly') engine.set(power, m, S.player === 'out' ? 0.45 : 1);

    // HUD numbers
    if (ph === 'fly' || ph === 'boom') {
      const c = ph === 'boom' ? S.crashC : Math.min(Math.floor(m * 100 + 1e-9), S.crashC);
      if (c !== S.shownC) {
        S.shownC = c;
        multN.textContent = (c / 100).toFixed(2);
        if (ph === 'fly') {
          const col = heat(c / 100);
          multEl.style.setProperty('--heat', `rgb(${col})`);
          multEl.style.setProperty('--heat-glow', `rgba(${col},.6)`);
          // the EJECT button runs hotter too: its glow takes the digits' colour and spreads as m climbs
          const key = `${Math.floor(c / 10)}`;
          if (S.player === 'in' && key !== S.shownHot) {
            S.shownHot = key;
            goBtn.style.setProperty('--glow', `rgba(${col},.95)`);
            goBtn.style.setProperty('--hot', clamp(Math.log(c / 100) / Math.log(10), 0, 1).toFixed(2));
            goBtn.style.setProperty('--pulse', `${clamp(0.85 - 0.12 * Math.log(c / 100), 0.28, 0.85).toFixed(2)}s`);
          }
        }
      }
      if (ph === 'fly' && !rm && S.player === 'in') {
        const j = Math.min(3, Math.log2(m) * 0.7);
        multEl.style.translate = `${(Math.random() * 2 - 1) * j}px ${(Math.random() * 2 - 1) * j}px`;
      } else if (multEl.style.translate) multEl.style.translate = '';
      if (S.player === 'in' && ph === 'fly') {
        const w = Math.floor((S.stake * c) / 100);
        if (w !== S.shownWin) {
          S.shownWin = w;
          goS.textContent = `+${fmt(w)} chips`;
        }
      }
    }
    if (ph === 'roll') goBar.style.scale = `${p} 1`;

    // neon sign: flickers more as the multiplier heats up, fully lit at 10x
    if (!S.danger && !DBG.thumb) {
      dzFlick -= dt;
      if (dzFlick <= 0) {
        const hot = ph === 'fly' ? clamp((m - 3) / 7, 0, 1) : 0;
        const on = dzEl.classList.toggle('on', Math.random() < 0.25 + hot * 0.6);
        dzFlick = on ? R(0.04, 0.12 + hot * 0.4) : R(0.05, 1.6 - hot * 1.4);
        if (on && hot > 0.3) sfx.tone({ freq: 120, type: 'square', dur: 0.03, vol: 0.02 + hot * 0.03, filter: { freq: 800 } });
      }
    }
  }

  const frameTimes = [];
  const jsTimes = [];
  function frame(now) {
    if (DBG.on && frameTimes.length < 2000) frameTimes.push(now - lastFrame);
    lastFrame = now;
    try {
      const t0 = performance.now();
      tick(now);
      render(now);
      if (DBG.on && jsTimes.length < 2000) jsTimes.push(performance.now() - t0);
    } catch (err) {

    }
