  }
  requestAnimationFrame(frame);
  // If frames stop (background tab), keep resolving the round on real time anyway.
  setInterval(() => {
    const now = performance.now();
    if (now - lastFrame > 300) tick(now);
  }, 250);

  /* ---------- Round logic ---------- */
  function tick(now) {
    if (S.phase === 'roll' && now >= S.rollEnd) liftOff(now);
    if (S.phase !== 'fly') return;
    const t = flightT(now);
    const m = mAt(t);
    const m100 = m * 100 + 1e-9;
    wingTick(m100);
    // auto eject comes first: a tie with the crash point goes to the pilot
    if (S.player === 'in' && S.targetC && S.targetC <= S.crashC && m100 >= S.targetC) eject(now, S.targetC, true);
    if (m100 >= S.crashC) {
      boom(now);
      return;
    }
    // milestones: pop, chime, callouts (only the latest if several passed while hidden)
    let hit = -1;
    let said = '';
    while (S.ms < MILESTONES.length && m100 >= MILESTONES[S.ms]) {
      hit = S.ms++;
      if (CALLOUTS[MILESTONES[hit]]) said = CALLOUTS[MILESTONES[hit]];
    }
    if (hit >= 0 && !document.hidden) {
      milestone(MILESTONES[hit], hit);
      if (said && !CALLOUTS[MILESTONES[hit]] && S.player === 'in') say(said);
    }
    // tension heartbeat near the target or when it gets hot
    if (S.player === 'in' && !document.hidden) {
      const near = S.targetC && m100 >= S.targetC * 0.8;
      if (near || m >= 4) {
        const every = clamp(1000 - 220 * Math.log2(m), 380, 1000) * (near ? 0.7 : 1);
        if (now - S.lastBeat > every) {
          S.lastBeat = now;
          sfx.heartbeat();
          fx.vibrate(8);
        }
      }
    }
  }

  function milestone(c, i) {
    const aboard = S.player === 'in';
    // (no boom on the very tick an auto eject fires at a preset: the eject owns that moment)
    if (SONIC[c] && !(S.player === 'out' && S.ejectC === c)) sonicBoom(aboard ? SONIC[c] : SONIC[c] * 0.5);
    if (aboard) {
      fx.anim(multEl, 'c-pop');
      fx.anim(goS, 'c-pop');
      // a pentatonic step up for every whole number, capped before it gets shrill; sparkles on top past 12x
      sfx.chime(Math.min(i, 11));
      if (i > 11) sfx.spark();
      if (S.jet) for (let k = 0; k < (10 + Math.min(i, 12)) * RMK(); k++) emit({ kind: 'star', x: S.jet.x, y: S.jet.y, vx: R(-240, 240), vy: R(-240, 170), drag: 3, life: R(0.4, 0.8), size: R(4, 8 + Math.min(i, 8) * 0.4), vr: R(-6, 6) });
      if (CALLOUTS[c]) say(CALLOUTS[c]);
    } else {
      // the empty jet keeps ticking past the numbers you walked away from
      sfx.tick(1.2 + Math.min(i, 12) * 0.06);
    }
    if (c >= 1000 && !S.danger) dangerZone();
  }

  function dangerZone() {
    S.danger = true;
    stage.classList.add('danger');
    dzEl.classList.add('on', 'lit');
    fx.anim(dzEl, 'c-jelly');
    // full alarm with the pilot aboard; an empty jet only lights the sign and whoops quietly
    const aboard = S.player === 'in';
    if (aboard) {
      fx.flash('#ff3d9a', 260, 0.35);
      fx.vibrate([30, 40, 30]);
    }
    const v = aboard ? 1 : 0.4;
    for (let i = 0; i < 3; i++) {
      sfx.tone({ freq: 620, to: 980, type: 'square', dur: 0.22, vol: 0.05 * v, delay: i * 0.26, filter: { freq: 2400 } });
      sfx.tone({ freq: 980, to: 620, type: 'square', dur: 0.2, vol: 0.04 * v, delay: i * 0.26 + 0.12, filter: { freq: 2400 } });
    }
    if (S.player === 'in') fx.floatText(stagePoint({ x: W / 2, y: H * 0.62 }), 'DANGER ZONE!', { color: '#ff5fb0', size: clamp(W / 12, 26, 54), rise: 70, ms: 1400, font: 'var(--f-neon)' });
  }

  function say(text) {
    subEl.textContent = up(text);
    subEl.classList.remove('pop');
    void subEl.offsetWidth;
    subEl.classList.add('pop');
  }

  function liftOff(now) {
    S.phase = 'fly';
    S.gearAt = now;
    S.ms = 0;
    sfx.whoosh(0.55, 0.22);
    sfx.tone({ freq: 200, to: 640, type: 'sawtooth', dur: 0.5, vol: 0.04, filter: { freq: 1400 } });
    // gear up: a hydraulic whirr and a solid clunk into the wells
    sfx.tone({ freq: 340, to: 620, type: 'sawtooth', dur: 0.26, vol: 0.025, delay: 0.08, filter: { freq: 1200 } });
    sfx.tone({ freq: 150, to: 70, type: 'square', dur: 0.07, vol: 0.09, delay: 0.38, filter: { freq: 700 } });
    sfx.noise({ type: 'bandpass', freq: 900, q: 2, dur: 0.05, vol: 0.14, delay: 0.38 });
    if (!fx.reducedMotion) S.kick = Math.max(S.kick, 2.5);
    fx.vibrate(15);
    say(S.crashC <= 100 ? 'Rotate...' : 'Airborne!');
    if (DBG.warp) S.runOff = W * 3; // a warped start is already far from the runway
    if (DBG.thumb) {
      // staged still for the gallery thumbnail
      spawnChute({ x: W * 0.17, y: H * 0.5 }, 25, 2, true);
      dzEl.classList.add('on');
    }
    for (let k = 0; k < 14 * RMK(); k++) emit({ kind: 'haze', x: x0 + R(-L * 0.4, L * 0.3), y: groundY - 2, vx: R(-160, -40), vy: R(-50, -10), drag: 2, life: R(0.6, 1.1), size: L * R(0.1, 0.2), grow: 1.5, alpha: 0.7 });
    paintButton();
  }

  function eject(now, cents, auto) {
    if (S.player !== 'in' || S.phase !== 'fly') return;
    cents = clamp(Math.round(cents), 100, S.crashC);
    const win = Math.floor((S.stake * cents) / 100);
    const rid = S.round;
    S.player = 'out';
    S.ejectC = cents;
    S.ejectT = tAt(cents / 100);
    S.win = win;
    S.streak++;
    S.lockUntil = Math.max(S.lockUntil, now + 900);
    Casino.record({ bet: S.stake, win });
    logRound({ round: rid, stake: S.stake, crashC: S.crashC, result: 'win', cents, win });
    // the win is committed now: big wins go straight in, others wait for the coins (flushed on take-off or page hide)
    const big = win >= S.stake * 10;
    let credit = null;
    if (big) {
      wallet.win(win);
      S.celebrating = true;
    } else credit = scheduleCredit(win);
    stage.classList.add('ghost');
    say(auto ? 'Auto eject! Buns is out' : 'Buns is out!');
    paintYou();
    paintButton();
    setControls(true); // pick the next stake while the empty jet flies on
    celebrate(rid, cents, win, S.stake, auto, big, credit);
  }

  async function celebrate(rid, cents, win, stake, auto, big, credit) {
    const mult = cents / 100;
    const level = mult >= 5 ? 3 : mult >= 2 ? 2 : 1;
    const tNow = Math.min(flightT(performance.now()), tAt(S.crashC / 100));
    const at = S.round === rid && S.phase === 'fly' ? toXY(S.ejectT, scaleAt(Math.max(tNow, S.ejectT))) : { x: W / 2, y: H / 2 };
    // hit-stop: freeze the frame for 120 ms
    freezeUntil = performance.now() + 120;
    sfx.tone({ freq: 2200, to: 500, type: 'square', dur: 0.06, vol: 0.07 });
    sfx.noise({ type: 'highpass', freq: 2400, dur: 0.12, vol: 0.2 });
    fx.vibrate([25, 30, 50]);
    await sleep(120);
    // the canopy blows, the seat rockets out and a candy-striped chute pops
    const chute = spawnChute(at, stake, level);
    sfx.whoosh(0.28, 0.2);
    sfx.pop(1.15 + Math.min(10, S.streak) * 0.06);
    sfx.noise({ type: 'bandpass', freq: 900, to: 300, q: 0.8, dur: 0.3, vol: 0.28, attack: 0.01 });
    sfx.kiss();
    sfx.win(level >= 2 ? 2 : 1);
    // streaks ring a little higher every time
    if (S.streak >= 2) {
      const f = 784 * 2 ** (Math.min(14, (S.streak - 1) * 2) / 12);
      sfx.tone({ freq: f, type: 'triangle', dur: 0.34, vol: 0.11, delay: 0.3 });
      sfx.tone({ freq: f * 1.5, dur: 0.26, vol: 0.05, delay: 0.36 });
    }
    fx.shake(3 + level * 2.5, 300 + level * 80);
    fx.flash('#fff3c0', 180, 0.18 + level * 0.06);
    const sp = stagePoint(at);
    fx.burst(sp, { type: 'star', count: 16 + level * 6, speed: [200, 600] });
    fx.burst(sp, { type: level >= 3 ? 'kiss' : 'heart', count: 8 + level * 4, speed: [180, 420] });
    if (level >= 2) fx.burst(sp, { type: 'confetti', count: 30 + level * 10 });
    for (let k = 0; k < 2; k++) emit({ kind: 'ring', x: at.x, y: at.y, size: 6, max: L * (1.4 + k * 0.6), width: 4, life: 0.5 + k * 0.15, color: k ? '#ffcf4a' : '#4dffb0', alpha: 0.9, age: -k * 0.08 });
    const streakTxt = S.streak >= 2 ? `${S.streak} sorties in a row!` : '';
    showSlam({
      k: streakTxt || (auto ? 'Auto eject!' : 'Buns is out!'),
      head: `Ejected at ${xs(cents)}!`,
      amt: `+${fmt(win)}`,
      q: quip(mult >= 5 ? 'big' : 'win'),
      cls: 'win',
    });
    paintStreak();
    const amtEl = slamEl.querySelector('.slam-amt');
    if (amtEl) fx.countUp(amtEl, 0, win, { ms: clamp(300 + win * 2, 380, 1100), format: (v) => `+${fmt(v)}` });
    fx.floatText({ x: sp.x, y: sp.y - 30 }, `+${fmt(win)}`, { color: '#fff3a8', size: 30 });
    if (big) {
      S.celebrating = true;
      paintButton();
      await sleep(650);
      try {
        const tier = Casino.winTier(win, stake);
        await Casino.bigWin(win, stake, { label: ['HOT BUNS!', 'HOT BUNS!', 'TOO HOT TO HANDLE!', 'DANGER ZONE!', 'TOP BUNS!!!'][tier] });
      } finally {
        S.celebrating = false;
        S.lockUntil = Math.max(S.lockUntil, performance.now() + 250);
        paintButton();
      }
      return;
    }
    setTimeout(credit, 2600); // safety net if the coin flight never lands (hidden tab)
    await sleep(220);
    if (rid !== S.round) {
      credit();
      return;
    }
    const from = chute.querySelector('svg') || chute;
    fx.collect(from, null, { count: clamp(Math.round(5 + mult * 2.5), 6, 22) }).then(() => {
      // the till rings only if this is the moment the chips actually land
      if (credit()) {
        sfx.cash();
        fx.vibrate(12);
      }
    });
  }

  function stagePoint(p) {
    const r = stage.getBoundingClientRect();
    return { x: r.left + p.x, y: r.top + p.y };
  }

  function spawnChute(at, stake, level, stay = false) {
    const d = document.createElement('div');
    d.className = 'chute';
    if (stay) d.style.animation = 'none';
    d.style.left = `${(at.x / W) * 100}%`;
    d.style.top = `${(at.y / H) * 100}%`;
    d.style.setProperty('--dx', `${-Math.round(W * 0.5 + R(0, W * 0.12))}px`);
    d.style.setProperty('--dy', `${Math.round(H * 0.16)}px`);
    d.style.setProperty('--life', fx.reducedMotion ? '3s' : '4.6s');
    const chipCols = ['#e8334a', '#2f7bff', '#1fae5b', '#d43ad6', '#ffcf4a'];
    const n = clamp(level + 1, 2, 4);
    let chips = '';
    for (let i = 0; i < n; i++) {
      const c = chipCols[(stake + i) % chipCols.length];
      chips += `<ellipse cx="50" cy="${126 - i * 4.4}" rx="9" ry="3.6" fill="${c}" stroke="#fff" stroke-width="1.1" stroke-dasharray="2.4 2.4"/>`;
    }
    d.innerHTML = `<div><svg viewBox="0 0 100 140">
      <path d="M5 46C5 12 95 12 95 46q-9-6-18 2q-13-8-27 0q-14-8-27 0q-9-8-18-2z" fill="url(#tbSilk)" stroke="#8a0f50" stroke-width="1.6"/>
      <path d="M5 46C5 12 95 12 95 46q-9-6-18 2q-13-8-27 0q-14-8-27 0q-9-8-18-2z" fill="url(#tbSilkShade)"/>
      <path d="M6 46L50 92M23 48L50 92M50 48L50 92M77 48L50 92M94 46L50 92" stroke="#ffe6f3" stroke-width="1.1" opacity=".85"/>
      <use href="#tbPeachArt" transform="translate(50 100) scale(.95)"/>
      <path d="M38.5 98.5h9.5q.6 4.8-4.6 5.4q-4.6-.2-4.9-5.4zM52 98.5h9.5q-.3 5.2-4.9 5.4q-5.2-.6-4.6-5.4z" fill="#1b1030" stroke="#ffcf4a" stroke-width="1.1"/>
      <path d="M48 99.3q2-1.2 4 0" stroke="#ffcf4a" stroke-width="1.1" fill="none"/>
      <path d="M50 109v8" stroke="#ffe6f3" stroke-width="1"/>
      ${chips}
    </svg></div>`;
    chutesEl.appendChild(d);
    if (!stay) setTimeout(() => d.remove(), 5400);
    return d;
  }

  function showSlam({ k = '', head = '', amt = '', q = '', cls = 'win' }) {
    clearTimeout(showSlam.timer);
    clearTimeout(showSlam.gone);
    slamEl.className = `slam ${cls}`;
    slamEl.innerHTML = '';
    const add = (c, text) => {
      if (!text) return null;
      const e = document.createElement('div');
      e.className = c;
      e.textContent = text;
      slamEl.appendChild(e);
      return e;
    };
    add('slam-k', up(k));
    const h = add('slam-h', up(head));
    if (h) h.style.setProperty('--len', String(Math.max(10, head.length)));
    add('slam-amt', amt);
    add('slam-q', q);
    stage.classList.add('slamming');
    void slamEl.offsetWidth;
    slamEl.classList.add('go');
    showSlam.timer = setTimeout(fadeSlam, 3200);
  }
  function fadeSlam() {
    clearTimeout(showSlam.timer);
    if (!slamEl.firstChild || slamEl.classList.contains('fade')) return;
    slamEl.classList.add('fade');
    stage.classList.remove('slamming');
    showSlam.gone = setTimeout(clearSlam, 460);
  }
  function clearSlam() {
    clearTimeout(showSlam.timer);
    clearTimeout(showSlam.gone);
    slamEl.className = 'slam';
    slamEl.innerHTML = '';
    stage.classList.remove('slamming');
  }
  const slamShowing = () => !!slamEl.firstChild && !slamEl.classList.contains('fade');

  function explode(x, y, k) {
    const n = RMK() * Math.min(k, 1.2); // rings scale with k; particle counts stay bounded
    emit({ kind: 'glow', x, y, size: L * 2.4, life: 0.5 });
    for (let i = 0; i < 3; i++) emit({ kind: 'ring', x, y, size: L * 0.2, max: Math.max(W, H) * (0.35 + i * 0.22) * k, width: 7 - i * 2, life: 0.55 + i * 0.18, color: i === 1 ? '#ffcf4a' : i ? '#ff3d9a' : '#ffffff', alpha: 0.95, age: -i * 0.07 });
    for (let i = 0; i < 54 * n; i++) {
      const a = Math.random() * TAU;
      const sp = R(40, 380);
      emit({ kind: i % 4 ? 'fire' : 'hot', x: x + R(-8, 8), y: y + R(-8, 8), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, drag: 3.2, g: -50, life: R(0.5, 1.15), size: L * R(0.13, 0.34), grow: 0.7, alpha: 0.9 });
    }
    for (let i = 0; i < 26 * n; i++) {
      const a = Math.random() * TAU;
      const sp = R(20, 150);
      emit({ kind: 'smoke', x: x + R(-10, 10), y: y + R(-10, 10), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30, drag: 1.4, g: -30, life: R(1.4, 2.6), size: L * R(0.14, 0.3), grow: 1.6, alpha: 0.9, age: -R(0, 0.15) });
    }
    const metals = ['#e9edf8', '#b2bad8', '#666c94', '#ff3d9a', '#ffcf4a'];
    for (let i = 0; i < 18 * n; i++) {
      const a = -Math.PI / 2 + R(-1.6, 1.6);
      const sp = R(180, 560);
      emit({ kind: 'debris', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 900, drag: 0.4, life: R(1.4, 2.4), size: L * R(0.03, 0.08), vr: R(-14, 14), color: metals[i % metals.length] });
    }
    for (let i = 0; i < 40 * n; i++) {
      const a = Math.random() * TAU;
      const sp = R(300, 950);
      emit({ kind: 'spark', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 500, drag: 2.4, life: R(0.3, 0.75), size: R(1.2, 2.6) });
    }
    // a second, slower fireball so the bang has a body, not just a flash
    emit({ kind: 'fire', x, y, size: L * 0.85, grow: 0.5, life: 0.85, alpha: 0.75, age: -0.05 });
    // the nose art goes flying
    emit({ kind: 'peach', x, y, vx: R(60, 180), vy: -R(380, 520), g: 1000, drag: 0.2, life: 2.6, size: L * 0.09, vr: R(6, 10) });
  }

  // what's left of the Hot Buns tumbles down and hits the deck: one last thump and a fire on the ground
  function dropWreck(x, y, rid, k) {
    const dir = Math.random() < 0.5 ? -1 : 1;
    emit({
      kind: 'wreck', x, y, vx: dir * R(30, 110), vy: -R(140, 260), g: 950, drag: 0.15, life: 2.6, size: L * 0.85, vr: dir * R(5, 9),
      onLand(p) {
        const n = RMK();
        emit({ kind: 'ring', x: p.x, y: groundY, size: L * 0.2, max: L * 2.2 * k, width: 4, life: 0.55, color: '#ffb36b', alpha: 0.9, flat: 0.22 });
        emit({ kind: 'glow', x: p.x, y: groundY - L * 0.1, size: L * 1.3, life: 0.4 });
        for (let i = 0; i < 22 * n; i++) emit({ kind: i % 3 ? 'fire' : 'hot', x: p.x + R(-L * 0.3, L * 0.3), y: groundY - 4, vx: R(-120, 120), vy: -R(80, 340), drag: 2.6, g: -40, life: R(0.35, 0.8), size: L * R(0.08, 0.2), grow: 0.6, alpha: 0.9 });
        for (let i = 0; i < 12 * n; i++) emit({ kind: 'smoke', x: p.x + R(-L * 0.3, L * 0.3), y: groundY - 6, vx: R(-60, 60), vy: -R(30, 110), drag: 1.2, g: -25, life: R(1, 1.8), size: L * R(0.12, 0.22), grow: 1.6, alpha: 0.8 });
        for (let i = 0; i < 18 * n; i++) emit({ kind: 'spark', x: p.x, y: groundY - 3, vx: R(-420, 420), vy: -R(60, 300), g: 700, drag: 1.5, life: R(0.25, 0.6), size: R(1.2, 2.2) });
        if (S.round !== rid) return; // a new sortie is already rolling: no thump over it
        sfx.thud(0.75);
        sfx.noise({ type: 'lowpass', freq: 900, to: 120, dur: 0.5, vol: 0.32, attack: 0.004 });
        sfx.noise({ type: 'bandpass', freq: 2600, q: 1.5, dur: 0.12, vol: 0.12, delay: 0.02 });
        if (!fx.reducedMotion) S.kick = Math.max(S.kick, 5 * k);
        fx.vibrate(30);
      },
    });
  }

  function boom(now) {
    if (S.phase !== 'fly') return;
    const rid = S.round;
    const wasIn = S.player === 'in';
    S.phase = 'boom';
    S.boomAt = now;
    S.boomT = tAt(S.crashC / 100);
    const sc = scaleAt(S.boomT);
    const at = S.boomT > 0 ? toXY(S.boomT, sc) : { x: x0, y: y0 };
    engine.stop(true);
    pushHistory(S.crashC);
    wingCrash(false);
    stage.classList.remove('danger');
    dzEl.classList.remove('lit');
    S.airframe++;
    store.set('bmc.topbuns.airframe', S.airframe);
    S.cones.length = 0;
    multEl.classList.add('boom');
    multN.textContent = (S.crashC / 100).toFixed(2);
    multEl.style.translate = '';
    // hit-stop, then the bang (bigger the higher it got)
    freezeUntil = now + (wasIn ? 90 : 60);
    const k = wasIn ? 1 + Math.min(0.45, Math.log10(S.crashC / 100) * 0.3) : 0.7;
    explode(at.x, at.y, k);
    if (S.crashC > 100) dropWreck(at.x, at.y, rid, k);
    sfx.explode();
    sfx.thud(0.6);
    sfx.noise({ type: 'lowpass', freq: 220, dur: 1.4, vol: 0.4, attack: 0.01 });
    fx.flash('#ffffff', 140, wasIn ? 0.85 : 0.45);
    setTimeout(() => fx.flash('#ff2e2e', 420, wasIn ? 0.42 : 0.2), 90);
    fx.shake(wasIn ? 20 : 9, wasIn ? 760 : 420);
    fx.vibrate(wasIn ? [70, 40, 140] : 40);
    if (wasIn) {
      S.player = 'lost';
      S.streak = 0;
      Casino.record({ bet: S.stake, win: 0 });
      logRound({ round: rid, stake: S.stake, crashC: S.crashC, result: 'lose', cents: 0, win: 0 });
      S.lockUntil = Math.max(S.lockUntil, now + 800);
      const near = S.targetC && S.crashC >= S.targetC * 0.85 && S.crashC < S.targetC;
      const runway = S.crashC <= 100;
      showSlam({
        k: runway ? 'Stalled on the runway!' : near ? `So close! Needed ${xs(S.targetC)}` : quip('loseHead'),
        head: `Shot down at ${xs(S.crashC)}`,
        q: runway ? quip('runway') : near ? quip('near') : quip('lose'),
        cls: 'lose',
      });
      setTimeout(() => { if (S.round === rid) sfx.lose(); }, 420);
      paintYou();
      paintStreak();
    } else if (S.player === 'out') {
      // the empty jet goes down: tell the pilot how their call played out
      const good = S.crashC < S.ejectC * 1.3;
      const msg = good ? quip('ghostGood') : quip('ghostBad');
      const kick = `Empty jet down at ${xs(S.crashC)}`;
      if (slamShowing()) {
        const kEl = slamEl.querySelector('.slam-k');
        const qEl = slamEl.querySelector('.slam-q');
        if (kEl) {
          kEl.textContent = up(kick);
          fx.anim(kEl, 'pop');
        }
        if (qEl) qEl.textContent = msg;
      } else showSlam({ k: kick, q: msg, cls: 'win' });
      const sp = stagePoint(at);
      fx.floatText({ x: sp.x, y: sp.y - 10 }, xs(S.crashC), { color: '#ff6b81', size: 28, rise: 50 });
      if (good && S.crashC - S.ejectC <= 25) fx.floatText({ x: sp.x, y: sp.y - 52 }, 'CLOSE CALL!', { color: '#4dffb0', size: 26 });
    }
    paintButton();
    paintWingCount();
    setControls(true);
    setTimeout(() => { if (S.round === rid && S.phase === 'boom') respawn(performance.now()); }, 2300);
  }

  function respawn(now) {
    S.phase = 'idle';
    S.taxiAt = now;
    S.runOff = 0;
    S.player = 'none';
    S.ejectC = 0;
    S.targetC = 0;
    S.danger = false;
    hud.hidden = true;
    multEl.classList.remove('boom');
    stage.classList.remove('danger', 'ghost');
    fadeSlam();
    logoEl.classList.remove('out');
    paintCallsign();
    sfx.whoosh(0.5, 0.06);
    for (const w of wing) if (w.state !== 'out') w.state = 'deck';
    paintWing();
    paintButton();
  }

  // The player took off again while their ejected jet was still climbing: settle the old flight quietly.
  function endGhost() {
    pushHistory(S.crashC);
    wingCrash(true);
    engine.stop(true);
    S.boomT = Math.min(flightT(performance.now()), tAt(S.crashC / 100));
    S.curveFade = 0.6;
    toastGhost(S.crashC);
  }
  function toastGhost(c) {
    const d = document.createElement('div');
    d.innerHTML = `${MINI_CHUTE}<span></span>`;
    d.querySelector('span').textContent = `Last jet would have made ${xs(c)}`;
    d.style.color = '#ffd6ee';
    d.style.boxShadow = 'inset 0 0 0 1px rgba(255,214,238,.4)';
    feedEl.appendChild(d);
    setTimeout(() => d.remove(), 2900);
  }

  function takeOff(now) {
    flush();
    if (!wallet.bet(stakeSel)) {
      fx.anim(chipsEl, 'c-wobble');
      fx.anim(goBtn, 'c-wobble');
      sfx.buzz();
      fx.vibrate([20, 40, 20]);
      // keep the next sortie one tap away: drop to the biggest stake the wallet still covers
      const fit = STAKES.filter((v) => v <= wallet.balance).pop();
      if (fit) {
        stakeSel = fit;
        store.set('bmc.topbuns.stake', fit);
        paintStake();
        paintButton();
        fx.anim(chipsEl.querySelector(`[data-v="${fit}"]`), 'c-pop');
        Casino.toast(`Not enough chips for that, hot shot. Stake dropped to ${fit}: tap again.`, 'bad');
      } else Casino.toast('Out of fuel. Cash your residuals up top.', 'bad');
      return;
    }
    if (S.phase === 'fly') endGhost();
    sfx.chips(4);
    S.round++;
    S.stake = stakeSel;
    S.targetC = autoC;
    S.crashC = nextCrash();
    S.player = 'in';
    S.phase = 'roll';
    S.rollAt = now;
    S.rollEnd = now + ROLL_MS / DBG.speed;
    S.liftAt = S.rollEnd - (DBG.warp * 1000) / DBG.speed;
    S.runOff = 0;
    S.ejectC = 0;
    S.win = 0;
    S.ms = 0;
    S.danger = false;
    S.shownC = -1;
    S.shownWin = -1;
    S.shownHot = '';
    S.cones.length = 0;
    S.flyby = null;
    S.ang = 0;
    S.lockUntil = now + 250;
    S.boomT = 0;
    S.curveFade = 0;
    S.taxiAt = now - 2000;
    clearSlam();
    logoEl.classList.add('out');
    hud.hidden = false;
    multEl.classList.remove('boom');
    multEl.style.removeProperty('--heat');
    multEl.style.removeProperty('--heat-glow');
    for (const v of ['--glow', '--hot', '--pulse']) goBtn.style.removeProperty(v);
    // afterburner kick: a shock ring at the nozzle and a gout of flame
    const nx = x0 - L * 0.53;
    emit({ kind: 'ring', x: nx, y: y0, size: L * 0.08, max: L * 1.3, width: 3, life: 0.4, color: '#ff9ad6', alpha: 0.9 });
    for (let i = 0; i < 18 * RMK(); i++) emit({ kind: i % 3 ? 'fire' : 'hot', x: nx, y: y0 + R(-3, 3), vx: -R(200, 420), vy: R(-50, 50), drag: 3, life: R(0.2, 0.45), size: L * R(0.06, 0.12), grow: 0.3 });
    if (!fx.reducedMotion) S.kick = Math.max(S.kick, 3);
    multN.textContent = '1.00';
    fx.anim(multEl, 'c-slam');
    stage.classList.remove('danger', 'ghost');
    dzEl.classList.remove('lit', 'on');
    const rid = S.round;
    say('Throttle up, Buns');
    setTimeout(() => { if (S.phase === 'roll' && S.round === rid) say('V1... rotate!'); }, (ROLL_MS * 0.62) / DBG.speed);
    // afterburner light: a whump, then the spool-up riser
    sfx.noise({ type: 'lowpass', freq: 900, to: 160, dur: 0.5, vol: 0.38, attack: 0.008 });
    sfx.tone({ freq: 70, to: 38, dur: 0.4, vol: 0.32 });
    sfx.riser(ROLL_MS / 1000 / DBG.speed);
    fx.vibrate(12);
    engine.set(0.3, 1);
    newWingmen();
    paintYou();
    setControls(false);
    paintButton();
  }

  /* ---------- Input ---------- */
  function mainAction() {
    const now = performance.now();
    if (now - S.lastAct < 220 || now < S.lockUntil || S.celebrating) return;
    if (document.querySelector('dialog[open], .cbig')) return;
    if (S.player === 'in') {
      if (S.phase !== 'fly') return; // no ejecting on the runway
      tick(now);
      if (S.phase === 'fly' && S.player === 'in') {
        S.lastAct = now;
        const c = Math.floor(mAt(flightT(now)) * 100 + 1e-9);
        eject(now, Math.min(c, S.crashC - 1), false);
      }
      return;
    }
    S.lastAct = now;
    fx.anim(goBtn, 'c-jelly');
    takeOff(now);
  }
  goBtn.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    mainAction();
  });
  goBtn.addEventListener('click', (e) => { if (e.detail === 0) mainAction(); });
  addEventListener('keydown', (e) => {
    if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    const el = e.target instanceof Element ? e.target : document.activeElement;
    if (el && (el.closest('input, textarea, select, [contenteditable]'))) return;
    if (document.querySelector('dialog[open]')) return;
    if (e.key === 'Enter' && el && el !== document.body && el !== document.documentElement && el !== goBtn) return;
    e.preventDefault();
    mainAction();
  });

  // stake chips
  STAKES.forEach((v, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'cchip';
    b.dataset.v = v;
    b.textContent = v;
    b.setAttribute('aria-label', `Stake ${v}`);
    b.addEventListener('click', () => {
      if (b.disabled) return;
      stakeSel = v;
      store.set('bmc.topbuns.stake', v);
      sfx.chip(0.85 + i * 0.07);
      fx.anim(b, 'c-pop');
      paintStake();
      paintButton();
    });
    chipsEl.appendChild(b);
  });
  function paintStake() {
    for (const b of chipsEl.children) b.setAttribute('aria-pressed', String(+b.dataset.v === stakeSel));
    stakeLbl.textContent = `${fmt(stakeSel)} chips`;
  }

  // auto eject
  for (const b of autosEl.querySelectorAll('.seg')) {
    b.addEventListener('click', () => {
      if (b.disabled) return;
      setAuto(+b.dataset.a);
      customEl.value = '';
      sfx.click();
      sfx.tick(1 + (+b.dataset.a || 100) / 1000);
      fx.anim(b, 'c-pop');
    });
  }
  function parseCustom() {
    const v = parseFloat(String(customEl.value).replace(',', '.').replace(/x/i, ''));
    if (!Number.isFinite(v)) return null;
    return clamp(Math.round(v * 100), 101, CAP_C);
  }
  function applyCustom(final) {
    const c = parseCustom();
    if (c === null) {
      if (final && customEl.value.trim()) {
        customEl.value = '';
        fx.anim(customEl, 'c-wobble');
        sfx.buzz();
      }
      if (final && !customEl.value) paintAuto();
      return;
    }
    setAuto(c, true);
    if (final) {
      customEl.value = (c / 100).toFixed(2);
      sfx.tick(1.4);
    }
  }
  customEl.addEventListener('input', () => applyCustom(false));
  customEl.addEventListener('change', () => applyCustom(true));
  customEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      e.stopPropagation(); // Enter here only confirms the number, it never takes off
      customEl.blur();
    }
  });
  function setAuto(c, custom = false) {
    autoC = c;
    store.set('bmc.topbuns.auto', c);
    paintAuto(custom);
    paintButton();
  }
  function paintAuto(custom) {
    const preset = [...autosEl.querySelectorAll('.seg')].some((b) => +b.dataset.a === autoC);
    const isCustom = custom || (!preset && autoC);
    for (const b of autosEl.querySelectorAll('.seg')) b.setAttribute('aria-pressed', String(!isCustom && +b.dataset.a === autoC));
    customEl.classList.toggle('on', !!isCustom);
    if (isCustom && !customEl.value && document.activeElement !== customEl) customEl.value = (autoC / 100).toFixed(2);
    autoLbl.textContent = autoC ? `At ${xs(autoC)}` : 'Off';
  }
  function setControls(enabled) {
    for (const b of chipsEl.children) b.disabled = !enabled;
    for (const b of autosEl.querySelectorAll('.seg')) b.disabled = !enabled;
    customEl.disabled = !enabled;
  }

  function paintButton() {
    const cls = goBtn.classList;
    cls.remove('idle', 'roll', 'eject', 'cool', 'lost');
    goBar.style.scale = '0 1';
    const now = performance.now();
    const cooling = now < S.lockUntil || S.celebrating;
    if (S.player === 'in' && S.phase === 'roll') {
      cls.add('roll');
      goL.textContent = 'Rolling';
      goS.textContent = `${fmt(S.stake)} chips aboard`;
      goBtn.setAttribute('aria-label', 'Rolling down the runway');
    } else if (S.player === 'in' && S.phase === 'fly') {
      cls.add('eject');
      goL.textContent = 'Eject!';
      S.shownWin = -1;
      goBtn.setAttribute('aria-label', 'Eject and cash out');
    } else if (cooling && (S.player === 'out' || S.player === 'lost')) {
      cls.add('cool');
      if (S.player === 'lost') cls.add('lost');
      goL.textContent = S.player === 'lost' ? 'Shot down' : 'Ejected!';
      goS.textContent = S.player === 'lost' ? `-${fmt(S.stake)} chips` : `+${fmt(S.win)} chips`;
      goBtn.setAttribute('aria-label', goL.textContent);
      clearTimeout(paintButton.t);
      paintButton.t = setTimeout(paintButton, Math.max(60, S.lockUntil - now + 20));
    } else {
      cls.add('idle');
      goL.textContent = S.phase === 'fly' ? 'Fly again' : 'Take off';
      goS.textContent = `${fmt(stakeSel)} chips${autoC ? ` · auto ${xs(autoC)}` : ''}`;
      goBtn.setAttribute('aria-label', `Take off with ${stakeSel} chips`);
    }
  }
  function paintStreak() {
    if (S.streak >= 2) {
      streakEl.hidden = false;
      streakEl.textContent = `${S.streak}x streak`;
      fx.anim(streakEl, 'c-pop');
    } else streakEl.hidden = true;
  }

  /* ---------- History pills ---------- */
  const HIST_KEY = 'bmc.topbuns.hist';
  let hist = store.get(HIST_KEY, null);
  if (!Array.isArray(hist) || !hist.every((v) => Number.isFinite(v))) {
    hist = Array.from({ length: 10 }, () => crashFrom(rng.float()));
  }
  function pillClass(c) { return c < 150 ? 'h0' : c < 200 ? 'h1' : c < 500 ? 'h2' : c < 1000 ? 'h3' : 'h4'; }
  function paintHist(fresh) {
    histEl.innerHTML = '';
    hist.slice(0, 16).forEach((c, i) => {
      const li = document.createElement('li');
      li.className = pillClass(c) + (fresh && i === 0 ? ' new' : '');
      li.textContent = xs(c);
      histEl.appendChild(li);
    });
  }
  function pushHistory(c) {
    if (S.histDone) return;
    S.histDone = true;
    hist.unshift(c);
    hist = hist.slice(0, 24);
    store.set(HIST_KEY, hist);
    paintHist(true);
  }

  /* ---------- Wingmen ---------- */
  let wing = [];
  const youRow = document.createElement('li');
  function newWingmen() {
    S.histDone = false;
    const pool = rng.shuffle(PILOTS.slice());
    wing = pool.slice(0, 6).map(([name, color]) => {
      const bet = rng.pick([20, 25, 50, 50, 100, 100, 250, 500, 1000]);
      let target = 1.1 + -Math.log(1 - rng.float()) * 1.5;
      if (rng.chance(0.12)) target = rng.range(8, 30);
      if (DBG.thumb && name.length % 3 === 0) target = 40;
      return { name, color, bet, targetC: Math.round(Math.min(target, 60) * 100), state: 'air', el: null, xy: null };
    });
    paintWing();
  }
  function paintWing() {
    wlist.innerHTML = '';
    youRow.className = 'wrow you';
    wlist.appendChild(youRow);
    paintYou();
    for (const w of wing) {
      const li = document.createElement('li');
      li.style.setProperty('--c', w.color);
      li.innerHTML = `${SHADES}<span class="nm"></span><span class="st"></span>`;
      li.querySelector('.nm').textContent = w.name;
      w.el = li;
      paintW(w);
      wlist.appendChild(li);
    }
    paintWingCount();
  }
  function paintW(w) {
    if (!w.el) return;
    w.el.className = `wrow ${w.state}`;
    const st = w.el.querySelector('.st');
    st.textContent = w.state === 'air' ? `${fmt(w.bet)} in the air` : w.state === 'out' ? `${xs(w.targetC)} · +${fmt(Math.floor((w.bet * w.targetC) / 100))}` : w.state === 'dead' ? `toasted · -${fmt(w.bet)}` : `on deck · ${fmt(w.bet)}`;
  }
  function paintYou() {
    youRow.style.setProperty('--c', '#ffcf4a');
    if (!youRow.firstChild) youRow.innerHTML = `${SHADES}<span class="nm">Buns (you)</span><span class="st"></span>`;
    const st = youRow.querySelector('.st');
    youRow.className = `wrow you ${S.player === 'in' ? 'air' : S.player === 'out' ? 'out' : S.player === 'lost' ? 'dead' : ''}`;
    st.textContent = S.player === 'in' ? `${fmt(S.stake)} in the air` : S.player === 'out' ? `${xs(S.ejectC)} · +${fmt(S.win)}` : S.player === 'lost' ? `toasted · -${fmt(S.stake)}` : `on deck · ${fmt(stakeSel)}`;
    if (S.player === 'out' || S.player === 'lost') fx.anim(youRow, S.player === 'out' ? 'tb-pop' : 'c-wobble');
  }
  function paintWingCount() {
    const air = wing.filter((w) => w.state === 'air').length + (S.player === 'in' ? 1 : 0);
    wingCount.textContent = S.phase === 'idle' && S.player === 'none' ? 'On deck' : `${air} in the air`;
  }
  function wingTick(m100) {
    let changed = false;
    for (const w of wing) {
      if (w.state !== 'air') continue;
      if (w.targetC <= S.crashC && m100 >= w.targetC) {
        w.state = 'out';
        changed = true;
        paintW(w);
        if (!document.hidden) {
          fx.anim(w.el, 'tb-pop');
          sfx.tone({ freq: 520 * R(0.9, 1.25), to: 1300 * R(0.9, 1.2), dur: 0.07, vol: 0.06 });
          feed(w);
          if (w.xy) emit({ kind: 'chute', x: w.xy.x, y: w.xy.y, vx: -40, vy: 30, drag: 0.5, life: 2.4, size: L * 0.11, color: w.color, drift: 0.5 });
        }
      }
    }
    if (changed) paintWingCount();
  }
  function wingCrash(silent) {
    for (const w of wing) {
      if (w.state !== 'air') continue;
      w.state = w.targetC <= S.crashC ? 'out' : 'dead';
      paintW(w);
      if (!silent && w.state === 'dead' && w.el) fx.anim(w.el, 'c-wobble');
    }
    paintWingCount();
  }
  let feedCount = 0;
  function feed(w) {
    const d = document.createElement('div');
    d.innerHTML = `${MINI_CHUTE}<span></span>`;
    d.querySelector('span').textContent = `${w.name} bailed at ${xs(w.targetC)}`;
    feedEl.appendChild(d);
    while (feedEl.children.length > 3) feedEl.firstChild.remove();
    feedCount++;
    setTimeout(() => d.remove(), 2900);
  }

  function paintCallsign() {
    callsignEl.textContent = `Call sign Buns · Hot Buns ${ROMAN(Math.min(3999, S.airframe))} on the runway`;
  }

  /* ---------- Help ---------- */
  $('#help').addEventListener('click', () => {
    sfx.tap();
    const row = (x) => `<tr><td>${x}x</td><td>${(97 / x).toFixed(x >= 10 ? 2 : 1)}%</td><td>${x}× stake</td></tr>`;
    Casino.dialog({
      title: 'Flight briefing',
      html: `<p>Pick a stake and hit <b>TAKE OFF</b>. From lift-off the multiplier climbs as <b>e<sup>0.12t</sup></b> (2x at about 6 s, 10x at 19 s). Hit <b>EJECT</b> or Space to bail out with stake × multiplier, or set <b>Auto eject</b> to bail at a target. Shot down first? The stake is gone.</p>
        <table><tr><th>Auto eject at</th><th>Makes it</th><th>Pays</th></tr>${[1.5, 2, 5, 10].map(row).join('')}</table>
        <p>The crash point is sealed at take-off: the chance of reaching <i>x</i> is 0.97 ÷ <i>x</i>, so every strategy returns <b>97%</b>. About 1 sortie in 25 never leaves the runway (1.00x). Max 1000x. Wingmen are for show.</p>
        <p>Wins round down to whole chips, so tiny stakes at low custom targets pay a bit less (10 chips at 1.05x still pays 10). Leave or reload mid-flight and only your auto eject can save the stake.</p>
        <p>Measured RTP: 97.0% for the auto presets at every stake except 25 at 1.5x (95.7%); manual ejects 96-97% (95.7% at stake 10). Monte Carlo, 1M sorties per case.</p>
        <p style="font-size:13px">Parody. Fake chips, no real money.</p>`,
      button: 'Ready to fly',
    });
  });

  /* ---------- Boot ---------- */
  paintStake();
  paintAuto();
  paintHist(false);
  paintCallsign();
  wing = rng.shuffle(PILOTS.slice()).slice(0, 6).map(([name, color]) => ({ name, color, bet: rng.pick([25, 50, 100, 250, 500]), targetC: 0, state: 'deck', el: null }));
  paintWing();
  paintButton();

  if (HP.has('debug') || DBG.thumb) {
    window.TopBuns = {
      get state() { return { phase: S.phase, player: S.player, stake: S.stake, crashC: S.crashC, targetC: S.targetC, ejectC: S.ejectC, win: S.win, round: S.round, locked: performance.now() < S.lockUntil, celebrating: S.celebrating, pending: !!pending }; },
      action: mainAction,
      log: roundLog,
      frames: () => frameTimes.splice(0),
      js: () => jsTimes.splice(0),
    };
  }
  if (DBG.thumb) {
    hist = [1240, 187, 342, 115, 2210, 503, 161, 298, 100, 744, 1305, 226];
    paintHist(false);
    dzEl.classList.add('on');
  }
})();
</script>
</body>
</html>
