<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Top Buns · Blue Movie Casino</title>
<meta name="description" content="A synthwave crash game: ride the Hot Buns up the multiplier curve and eject before you get shot down in the Danger Zone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&family=Bungee&family=Monoton&family=Shrikhand&family=Russo+One&display=swap">
<link rel="stylesheet" href="../shared/casino.css">
<style>
/* Top Buns: 80s synthwave sunset, chrome-and-aviator-gold type, a neon DANGER ZONE sign.
   Layout: phone = flight deck, controls, wingmen stacked; wide = deck on the left, controls and wingmen on the right. */
:root {
  --accent: #ff3d9a;
  --accent-2: #ffcf4a;
  --f-chrome: "Russo One", "Bungee", "Arial Black", Impact, sans-serif;
  --heat: #ffffff;
  --heat-glow: rgba(255, 255, 255, .45);
  --chrome: linear-gradient(180deg, #ffffff 0%, #e4ebff 28%, #9aa8dc 46%, #2b1a5c 50%, #ff8fd0 54%, #ffd6ee 72%, #ffffff 100%);
  --aviator: linear-gradient(180deg, #fff6cf 0%, #ffd866 40%, #c98a00 52%, #ffe9a3 62%, #ffcf4a 100%);
}
/* screen shake moves <main>; clip it here so a shake can never open a sideways scroll */
html { overflow-x: hidden }
body {
  overflow-x: clip;
  background:
    radial-gradient(120% 70% at 50% 0%, rgba(255, 61, 154, .16), transparent 60%),
    linear-gradient(180deg, #170629, #0b0314 70%) fixed,
    var(--velvet);
}
.tb {
  display: grid;
  gap: 10px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "stage" "ctrl" "wing";
  max-width: 1400px;
  margin: 0 auto;
  padding: 10px max(10px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
}

/* ---------- Flight deck ---------- */
.stage {
  grid-area: stage;
  position: relative;
  height: clamp(270px, calc(100svh - var(--bar-h) - 316px), 540px);
  border-radius: 18px;
  overflow: hidden;
  isolation: isolate;
  container-type: size;
  background: #1a0633;
  box-shadow: 0 0 0 1px rgba(255, 61, 154, .4), 0 0 38px rgba(255, 61, 154, .18), 0 18px 46px rgba(0, 0, 0, .55);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
/* cheap VHS scanlines over the deck only (the full-page c-vhs blend layer is too heavy over a live canvas) */
.stage::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  border-radius: inherit;
  background: repeating-linear-gradient(180deg, rgba(10, 0, 20, .16) 0 1px, transparent 1px 3px);
  box-shadow: inset 0 0 60px rgba(10, 0, 30, .55);
}
.vign {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(255, 20, 60, .55) 100%);
  transition: opacity .4s;
}
.stage.danger .vign { opacity: 1; animation: tb-alarm .55s ease-in-out infinite alternate }
/* after an eject (or a crash) the result slam takes the multiplier's spot; the ghost jet carries its own label */
.stage.ghost .hud, .stage.slamming .hud { opacity: 0; scale: .82 }

/* history of crash points */
.hist {
  position: absolute;
  z-index: 3;
  top: 8px;
  left: 8px;
  right: 58px;
  display: flex;
  gap: 5px;
  margin: 0;
  padding: 0;
  list-style: none;
  overflow: hidden;
  -webkit-mask: linear-gradient(90deg, #000 78%, transparent);
  mask: linear-gradient(90deg, #000 78%, transparent);
}
.hist li {
  flex: none;
  padding: 5px 8px 4px;
  border-radius: 999px;
  background: rgba(10, 2, 20, .62);
  box-shadow: inset 0 0 0 1px currentColor;
  font: 800 13px/1 var(--f-cond);
  font-variant-numeric: tabular-nums;
  letter-spacing: .02em;
}
.hist li.h0 { color: #ff6b81 }
.hist li.h1 { color: #ffa25c }
.hist li.h2 { color: var(--gold) }
.hist li.h3 { color: var(--cyan) }
.hist li.h4 { color: #ff5fc0; background: rgba(255, 61, 154, .2); text-shadow: 0 0 8px #ff3d9a }
.hist li.new { animation: tb-pill .5s var(--ease-back) }
.helpbtn {
  position: absolute;
  z-index: 4;
  top: 2px;
  right: 4px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}
.helpbtn span {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(10, 2, 20, .6);
  box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 12px rgba(255, 207, 74, .35);
  color: var(--gold);
  font: 400 17px/1 var(--f-chrome);
}
.helpbtn:hover span { background: rgba(255, 207, 74, .18) }

/* the neon sign */
.dz {
  position: absolute;
  z-index: 2;
  top: 50px;
  right: 10px;
  display: grid;
  justify-items: center;
  padding: 5px 9px 6px;
  border: 2px solid currentColor;
  border-radius: 10px;
  rotate: -4deg;
  color: rgba(255, 90, 170, .3);
  background: rgba(10, 2, 20, .25);
  font: 400 clamp(13px, min(5.4cqw, 7cqh), 30px)/1.05 var(--f-neon);
  letter-spacing: .04em;
  text-transform: uppercase;
  pointer-events: none;
  transition: color .08s, opacity .3s;
}
.dz span:last-child { color: inherit; font-size: 1.18em }
.dz.on {
  color: #ff7cc6;
  text-shadow: 0 0 2px #fff, 0 0 8px #ff3d9a, 0 0 20px #ff3d9a, 0 0 40px #ff2e63;
  box-shadow: 0 0 10px #ff3d9a, inset 0 0 10px rgba(255, 61, 154, .6), 0 0 34px rgba(255, 46, 99, .55);
}
.dz.lit { animation: tb-neon 1.1s ease-in-out infinite }
/* step back while a result slam is up, unless the sign is properly lit */
.stage.slamming .dz:not(.lit) { opacity: 0; transition: opacity .25s, color .08s }

/* idle logo */
.logo {
  position: absolute;
  inset: 34px 0 18% 0;
  z-index: 2;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: .4cqh;
  text-align: center;
  pointer-events: none;
  transition: opacity .45s, scale .5s var(--ease-back), filter .45s;
}
.logo.out { opacity: 0; scale: 1.7; filter: blur(10px) }
.logo .wings { width: clamp(120px, 44cqw, 300px); height: auto; filter: drop-shadow(0 2px 0 #6a3a00) drop-shadow(0 0 14px rgba(255, 207, 74, .5)); animation: tb-float 3.2s ease-in-out infinite }
.logo h1 {
  margin: 0;
  padding: 0 .1em;
  font: 400 clamp(44px, min(17cqw, 22cqh), 128px)/.92 var(--f-chrome);
  letter-spacing: .01em;
  text-transform: uppercase;
  transform: skewX(-10deg);
  background: var(--chrome);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 2px 0 #ffcf4a) drop-shadow(0 4px 0 #7a3c00) drop-shadow(0 0 24px rgba(255, 61, 154, .65));
}
.logo .tag {
  margin: 0;
  font: 400 clamp(15px, min(4.6cqw, 6cqh), 26px)/1.15 var(--f-retro);
  color: #ff8fd0;
  text-shadow: 0 2px 0 #3a0630, 0 0 16px rgba(255, 61, 154, .7);
}
.logo .callsign {
  margin: .4em 0 0;
  padding: 5px 12px;
  border-radius: 999px;
  background: rgba(10, 2, 20, .55);
  box-shadow: inset 0 0 0 1px rgba(255, 207, 74, .5);
  font: 700 clamp(11px, 3.3cqw, 15px)/1 var(--f-cond);
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--gold);
}

/* flight numbers */
.hud {
  position: absolute;
  left: 0;
  right: 0;
  top: max(40px, 15cqh);
  z-index: 2;
  display: grid;
  justify-items: center;
  pointer-events: none;
  transform-origin: 50% 0;
  transition: opacity .3s, scale .35s var(--ease-out);
}
.hud[hidden] { display: grid !important; opacity: 0 }
.mult {
  font: 800 clamp(58px, min(25cqw, 27cqh), 190px)/.86 var(--f-cond);
  font-variant-numeric: tabular-nums;
  letter-spacing: -.01em;
  color: var(--heat);
  transform: skewX(-8deg);
  text-shadow: 0 4px 0 rgba(40, 0, 40, .6), 0 0 28px var(--heat-glow), 0 0 4px rgba(0, 0, 0, .4);
  will-change: transform;
}
.mult small { font-size: .5em; margin-left: .04em }
.mult.boom { color: #ff4d5e; text-shadow: 0 4px 0 rgba(40, 0, 10, .7), 0 0 30px rgba(255, 30, 60, .8) }
.sub {
  margin-top: .8cqh;
  padding: 4px 12px 3px;
  border-radius: 999px;
  background: rgba(10, 2, 20, .5);
  font: 800 clamp(12px, min(4cqw, 5cqh), 20px)/1.2 var(--f-cond);
  letter-spacing: .2em;
  text-align: center;
  color: #ffe0f2;
  text-shadow: 0 2px 0 rgba(0, 0, 0, .6), 0 0 12px rgba(255, 61, 154, .6);
}
.sub:empty { visibility: hidden }
.sub.pop { animation: tb-sub .45s var(--ease-back) }

/* result slam: sits where the multiplier was, above the flight band */
.slam {
  position: absolute;
  left: 8px;
  right: 8px;
  top: max(34px, 10cqh);
  z-index: 3;
  display: grid;
  justify-items: center;
  gap: 2px;
  text-align: center;
  pointer-events: none;
}
.slam::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: -14% -4%;
  background: radial-gradient(closest-side, rgba(12, 2, 24, .62), rgba(12, 2, 24, .3) 60%, transparent);
}
.slam:empty::before { display: none }
.slam.go { animation: c-slam .5s var(--ease-back) both }
/* (an animation, not a transition: the slam's own fill-mode would otherwise pin opacity at 1) */
.slam.fade { animation: tb-out .45s ease-in forwards }
.slam-k { font: 800 clamp(12px, min(3.6cqw, 4.6cqh), 18px)/1.1 var(--f-cond); letter-spacing: .2em; text-transform: uppercase; color: #ffe0f2; text-shadow: 0 2px 0 rgba(0, 0, 0, .6), 0 0 12px rgba(255, 61, 154, .7) }
.slam.lose .slam-k { color: #ffb3c0 }
.slam-k.pop { animation: tb-sub .45s var(--ease-back) }
.slam-h {
  padding: 0 .1em;
  white-space: nowrap;
  /* shrink long headlines so "SHOT DOWN AT 123.45x" stays on one line */
  font: 400 clamp(20px, min(9cqw, 11cqh, calc(132cqw / var(--len, 14))), 64px)/1.05 var(--f-chrome);
  transform: skewX(-8deg);
  background: var(--aviator);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 #5a2a00) drop-shadow(0 0 18px rgba(255, 207, 74, .55));
}
.slam.lose .slam-h { background: linear-gradient(180deg, #fff0f0 0%, #ff8a8a 40%, #c0102e 55%, #ff5c6c 100%); -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 3px 0 #3a0010) drop-shadow(0 0 18px rgba(255, 46, 70, .6)) }
.slam-amt {
  font: 800 clamp(30px, min(11cqw, 13cqh), 74px)/1 var(--f-cond);
  font-variant-numeric: tabular-nums;
  color: #fff6c8;
  text-shadow: 0 3px 0 rgba(0, 0, 0, .55), 0 0 22px rgba(255, 207, 74, .9);
}
.slam-q {
  max-width: 32ch;
  padding: 3px 12px;
  border-radius: 10px;
  background: rgba(10, 2, 20, .55);
  font: 600 clamp(13px, min(3.9cqw, 5cqh), 19px)/1.25 var(--f-text);
  color: #ffe6f4;
}

/* wingmen bail-out feed */
.feed {
  position: absolute;
  z-index: 3;
  left: 8px;
  bottom: max(26px, 8cqh);
  display: flex;
  flex-direction: column-reverse;
  align-items: flex-start;
  gap: 4px;
  max-width: 62%;
  pointer-events: none;
}
.feed div {
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: 100%;
  padding: 4px 9px 4px 5px;
  border-radius: 999px;
  background: rgba(10, 2, 20, .72);
  box-shadow: inset 0 0 0 1px rgba(77, 255, 176, .45);
  color: var(--mint);
  font: 700 12px/1.1 var(--f-cond);
  letter-spacing: .03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  animation: tb-feed-in .4s var(--ease-back), tb-feed-out .5s 2.3s ease-in forwards;
}
.feed div.dead { color: #ff8fa3; box-shadow: inset 0 0 0 1px rgba(255, 77, 109, .45) }
.feed svg { flex: none; width: 15px; height: 15px }

/* parachutes */
.chutes { position: absolute; inset: 0; z-index: 2; pointer-events: none }
.chute {
  position: absolute;
  width: clamp(78px, min(26cqw, 34cqh), 150px);
  translate: -50% -34%;
  animation: tb-drift var(--life, 4.6s) .4s linear forwards;
}
.chute > div { animation: tb-chute-pop .55s var(--ease-back) both }
.chute svg { display: block; width: 100%; height: auto; transform-origin: 50% 8%; animation: tb-sway 1.6s ease-in-out infinite alternate }

/* ---------- Controls ---------- */
.ctrl { grid-area: ctrl; display: grid; gap: 10px; padding: 12px; position: relative }
.row { display: grid; gap: 6px }
.row-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px }
.row-h b { font: 800 14px/1 var(--f-cond); letter-spacing: .08em; color: var(--gold); font-variant-numeric: tabular-nums }
.chips { display: flex; justify-content: space-between; gap: 4px }
.chips .cchip { width: 46px; height: 46px; font-size: 13px }
.chips .cchip:disabled { cursor: not-allowed; filter: grayscale(.7) brightness(.6) }
.autos { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.35fr); gap: 5px }
.seg {
  min-height: 44px;
  padding: 0 2px;
  border: 0;
  border-radius: 12px;
  background: rgba(255, 255, 255, .06);
  box-shadow: inset 0 0 0 1px var(--rule), 0 3px 0 rgba(0, 0, 0, .35);
  color: var(--ink);
  font: 800 16px/1 var(--f-cond);
  letter-spacing: .02em;
  cursor: pointer;
  touch-action: manipulation;
  transition: translate .12s var(--ease-back), background .15s;
}
.seg:active { translate: 0 2px }
.seg[aria-pressed="true"] { background: var(--aviator); color: #2b1600; box-shadow: 0 3px 0 #8a5a00, 0 0 16px rgba(255, 207, 74, .45) }
.seg:disabled, .custom input:disabled { cursor: not-allowed; opacity: .45 }
.custom input {
  width: 100%;
  min-height: 44px;
  padding: 0 4px;
  border: 0;
  border-radius: 12px;
  background: rgba(0, 0, 0, .35);
  box-shadow: inset 0 0 0 1px var(--rule);
  color: var(--ink);
  font: 800 16px/1 var(--f-cond);
  text-align: center;
  -moz-appearance: textfield;
  appearance: textfield;
}
.custom input::placeholder { color: var(--ink-soft); opacity: .8 }
.custom input.on { background: rgba(255, 207, 74, .14); box-shadow: inset 0 0 0 2px var(--gold), 0 0 14px rgba(255, 207, 74, .35); color: var(--gold) }
.custom input:focus { outline: 2px solid var(--gold); outline-offset: 1px }

.go {
  position: relative;
  width: 100%;
  min-height: 78px;
  flex-direction: column;
  gap: 3px;
  overflow: hidden;
  font: 400 32px/1 var(--f-chrome);
  letter-spacing: .06em;
  --b1: #fff1b8;
  --b2: #ffc93a;
  --b3: #8a5400;
}
.go .go-l { position: relative; z-index: 1; transform: skewX(-8deg) }
.go .go-s { position: relative; z-index: 1; font: 800 14px/1 var(--f-cond); letter-spacing: .14em; opacity: .85; font-variant-numeric: tabular-nums }
.go .go-bar { position: absolute; inset: 0; z-index: 0; transform-origin: 0 50%; scale: 0 1; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .45)); pointer-events: none }
.go.idle { animation: tb-breathe 1.8s ease-in-out infinite }
.go.roll { --b1: #ffb0d8; --b2: #ff5fb0; --b3: #8a0a4c; --bt: #fff; cursor: progress }
.go.eject { --b1: #ff8aa6; --b2: #ff1f55; --b3: #7a0022; --bt: #fff; font-size: 40px; animation: tb-eject var(--pulse, .8s) ease-in-out infinite }
.go.eject .go-s { font-size: 17px; opacity: 1; color: #fff3a8 }
.go.cool { --b1: #a6ffd9; --b2: var(--mint); --b3: #12784b; --bt: #062a1a; text-shadow: none; cursor: default }
.go.cool.lost { --b1: #ffa0b0; --b2: #ff4d6d; --b3: #7a0022; --bt: #fff }
.go-wrap { position: relative }
.streak {
  position: absolute;
  z-index: 2;
  right: 10px;
  top: -11px;
  padding: 4px 9px;
  border-radius: 999px;
  background: linear-gradient(180deg, #ff7cc6, #ff3d9a);
  box-shadow: 0 2px 0 #8a0a4c, 0 0 14px rgba(255, 61, 154, .6);
  font: 800 13px/1 var(--f-cond);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #fff;
  pointer-events: none;
}
.fine { margin: 0; font: 600 11px/1.3 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); text-align: center; opacity: .8 }

/* ---------- Wingmen ---------- */
.wing { grid-area: wing; padding: 12px; display: grid; align-content: start; gap: 8px; min-height: 0 }
.wing-h { display: flex; align-items: baseline; justify-content: space-between }
.wing h2 { margin: 0; font: 400 20px/1 var(--f-chrome); letter-spacing: .04em; text-transform: uppercase; transform: skewX(-8deg); background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent }
.wlist { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 0; padding: 0; list-style: none }
.wrow {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  align-items: center;
  column-gap: 7px;
  padding: 6px 8px;
  border-radius: 10px;
  background: rgba(0, 0, 0, .28);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
  transition: background .25s, opacity .3s;
}
.wrow svg { grid-row: span 2; width: 30px; height: 15px; color: var(--c, #ff3d9a) }
.wrow .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 700 14px/1.15 var(--f-cond); letter-spacing: .02em }
.wrow .st { font: 700 12px/1.15 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wrow.air .st { color: #ffd6ee }
.wrow.air svg { animation: tb-bob 1.2s ease-in-out infinite alternate }
.wrow.out { background: rgba(77, 255, 176, .12); box-shadow: inset 0 0 0 1px rgba(77, 255, 176, .4) }
.wrow.out .st { color: var(--mint) }
.wrow.dead { opacity: .5 }
.wrow.dead .st { color: #ff8fa3 }
.wrow.you { box-shadow: inset 0 0 0 1.5px var(--gold), 0 0 14px rgba(255, 207, 74, .18); background: rgba(255, 207, 74, .08) }
.wrow.you .nm { color: var(--gold) }
.wrow.you.out { background: rgba(77, 255, 176, .14) }

@media (min-width: 900px), (min-width: 640px) and (max-height: 560px) and (orientation: landscape) {
  .tb {
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "stage ctrl" "stage wing";
    height: calc(100svh - var(--bar-h) - env(safe-area-inset-top, 0px));
    min-height: 520px;
  }
  .stage { height: auto; min-height: 0 }
  .wing { overflow: auto }
  .wlist { grid-template-columns: 1fr }
  .wrow { grid-template-columns: 30px minmax(0, 1fr) auto }
  .wrow svg { grid-row: auto }
  .wrow .st { text-align: right }
}
@media (min-width: 640px) and (max-height: 560px) and (orientation: landscape) {
  .tb { grid-template-columns: minmax(0, 1fr) 300px; min-height: 0 }
}

/* short phones: tighten the controls so TAKE OFF / EJECT stays on screen */
@media (max-height: 740px) and (max-width: 639px) {
  .stage { height: clamp(250px, calc(100svh - var(--bar-h) - 268px), 540px) }
  .ctrl { gap: 7px; padding: 10px 12px }
  .row { gap: 4px }
  .chips .cchip { width: 44px; height: 44px }
  .go { min-height: 66px; font-size: 28px }
  .go.eject { font-size: 34px }
  .fine { font-size: 10px }
}

@keyframes tb-alarm { from { opacity: .55 } to { opacity: 1 } }
@keyframes tb-pill { 0% { scale: .2; opacity: 0 } 60% { scale: 1.25; opacity: 1 } 100% { scale: 1 } }
@keyframes tb-neon { 0%, 100% { filter: brightness(1) } 50% { filter: brightness(1.35) } 52% { filter: brightness(.7) } 54% { filter: brightness(1.3) } }
@keyframes tb-float { 0%, 100% { translate: 0 0 } 50% { translate: 0 -5px } }
@keyframes tb-sub { 0% { scale: .6; opacity: 0 } 60% { scale: 1.12; opacity: 1 } 100% { scale: 1 } }
@keyframes tb-feed-in { from { translate: -30px 0; opacity: 0; scale: .7 } to { translate: 0 0; opacity: 1; scale: 1 } }
@keyframes tb-feed-out { to { opacity: 0; translate: 0 -10px } }
