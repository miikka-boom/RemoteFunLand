<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dirty Dicing · Blue Movie Casino</title>
<meta name="description" content="Blow on a pair of pink fuzzy dice and throw them across a 1963 resort dance floor. Nobody puts your chips in a corner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&family=Bungee&family=Monoton&family=Shrikhand&family=Yellowtail&display=swap">
<link rel="stylesheet" href="../shared/casino.css">
<style>
/* Dirty Dicing: a 1963 summer-resort dance hall. Teal, coral and sunset pink, a varnished plank floor
   under string lights, and two pink fuzzy dice drawn as CSS 3D cubes. */
:root {
  --accent: #ff8fab;
  --accent-2: #2ee6c9;
  --teal: #1fb5a3;
  --teal-2: #2ee6c9;
  --teal-d: #0e5b5c;
  --night: #0a2a33;
  --coral: #ff6f59;
  --sunset: #ff8fab;
  --peach: #ffb38a;
  --butter: #ffd166;
  --cream: #fff3e0;
  --fur: #ff4f9a;
  --f-script: "Yellowtail", "Brush Script MT", cursive;
  --beat: 280ms;
}
html { background: var(--night) }
body.dd {
  background:
    radial-gradient(90% 60% at 50% -10%, rgba(255, 143, 171, .22), transparent 60%),
    radial-gradient(120% 90% at 50% 0%, #134a52 0%, #0b2f37 45%, #061b21 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

/* ---------- Layout ---------- */
.dd-main {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 560px;
  height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px));
  height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px));
  min-height: 600px;
  margin: 0 auto;
  padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
}
.stage { position: relative; flex: 1 1 auto; min-height: 250px }
.table { flex: none; display: grid; gap: 8px; min-width: 0 }
@media (min-width: 900px) {
  .dd-main {
    max-width: 1280px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 460px;
    gap: 18px;
    padding: 16px 22px 14px;
    min-height: 560px;
  }
  .table { align-content: center; gap: 14px }
}

/* ---------- Scene ---------- */
.scene {
  position: absolute;
  inset: 0;
  overflow: hidden;
  border-radius: 22px;
  background: #0b2d35;
  perspective: var(--persp, 900px);
  perspective-origin: 50% 0;
  box-shadow: 0 0 0 2px rgba(46, 230, 201, .25), 0 0 0 6px rgba(10, 42, 51, .9), 0 0 0 7px rgba(255, 143, 171, .25), 0 18px 50px rgba(0, 0, 0, .55);
  isolation: isolate;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
.wall { position: absolute; left: 0; right: 0; top: 0; height: calc(var(--horizon, 180px) + 2px); z-index: 0 }
.stars { position: absolute; inset: 0 }
.wall svg { display: block; width: 100%; height: 100% }
.stars i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff6e8; box-shadow: 0 0 4px #fff; animation: dd-twinkle 3s ease-in-out infinite }
.stars i:nth-child(2n) { animation-delay: -1.3s }
.stars i:nth-child(3n) { animation-delay: -2.1s; animation-duration: 4s }

.lights { position: absolute; left: 0; top: 0; width: 100%; z-index: 6; pointer-events: none; overflow: visible; animation: dd-bulb 2.6s ease-in-out infinite; will-change: opacity }
.lights.b { animation-delay: -1.3s }
.lights .wire { fill: none; stroke: #062026; stroke-width: 1.6 }
.lights .glow { opacity: .6 }
.scene.party .lights { animation: dd-flash calc(var(--beat) * 2) steps(1, end) infinite }
.scene.party .lights.b { animation-delay: calc(var(--beat) * -1) }

.logo {
  position: absolute;
  left: 0;
  right: 0;
  top: max(14px, calc(var(--horizon, 180px) * .1));
  z-index: 1;
  display: grid;
  justify-items: center;
  pointer-events: none;
  line-height: 1;
  text-align: center;
  transition: opacity .3s, translate .4s var(--ease-out);
}
.logo .l1 {
  margin: 0 0 -.38em -1.6em;
  font: 400 clamp(32px, 9.6vw, 60px)/1 var(--f-script);
  color: #fff4ec;
  rotate: -9deg;
  text-shadow: 0 0 2px #fff, 0 0 8px var(--coral), 0 0 18px #ff3d6e, 0 0 34px rgba(255, 61, 110, .7);
  animation: dd-neon 5s linear infinite;
}
.logo .l2 {
  font: 400 clamp(40px, 12.4vw, 84px)/.92 var(--f-retro);
  letter-spacing: .02em;
  background: linear-gradient(180deg, #fff3cf 0 32%, var(--butter) 32% 49%, #ff9a5a 49% 64%, #ff5f7e 64% 80%, #e8408f 80%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 3px 0 var(--teal-d)) drop-shadow(0 6px 0 rgba(3, 24, 29, .75));
}
.logo .l0 { margin-bottom: 2px; font: 700 clamp(9px, 2.5vw, 12px)/1 var(--f-cond); letter-spacing: .3em; text-transform: uppercase; color: #c9fff5; text-shadow: 0 1px 0 rgba(0, 0, 0, .5) }
.logo .l3 { margin-top: 4px; font: 400 clamp(17px, 4.8vw, 26px)/1 var(--f-script); color: #fff1e6; text-shadow: 0 2px 0 rgba(90, 20, 60, .6), 0 0 12px rgba(255, 79, 154, .6) }
.scene.rolling .logo { opacity: .18; translate: 0 -6px }
.scene.showing .logo, .scene.lifting .logo { opacity: 0; translate: 0 -10px }

/* Dance floor: a plank plane tilted away from the camera; dice live on it in 3D. */
.plane {
  position: absolute;
  left: 50%;
  bottom: 0;
  width: var(--fw, 800px);
  height: var(--fd, 400px);
  margin-left: calc(var(--fw, 800px) / -2);
  transform-origin: 50% 100%;
  transform: rotateX(var(--tilt, 58deg));
  z-index: 1;
  pointer-events: none;
}
.floor { z-index: 2 }
.dieplane { transform-style: preserve-3d; z-index: 3 }
.floor {
  --plank: calc(var(--u, 4px) * 7);
  background:
    linear-gradient(180deg, rgba(6, 28, 33, .7), rgba(6, 28, 33, 0) 28%),
    repeating-linear-gradient(0deg, rgba(70, 30, 8, .45) 0 2px, transparent 2px calc(var(--plank) * 6)),
    repeating-linear-gradient(90deg, rgba(70, 30, 8, .6) 0 2px, transparent 2px var(--plank)),
    repeating-linear-gradient(90deg, rgba(255, 230, 190, .07) 0 1px, transparent 1px 5px),
    repeating-linear-gradient(90deg, #c98a4b 0 var(--plank), #b4733a var(--plank) calc(var(--plank) * 2), #d49a5b calc(var(--plank) * 2) calc(var(--plank) * 3), #bf7f43 calc(var(--plank) * 3) calc(var(--plank) * 4));
}
.floor::after {
  /* varnish: reflected string lights */
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(18% 8% at 20% 8%, rgba(255, 230, 160, .35), transparent),
    radial-gradient(18% 8% at 50% 6%, rgba(255, 200, 200, .35), transparent),
    radial-gradient(18% 8% at 80% 8%, rgba(190, 255, 240, .3), transparent),
    linear-gradient(180deg, rgba(255, 220, 170, .14), transparent 40%);
  pointer-events: none;
}
.pool {
  position: absolute;
  width: 46%;
  height: 52%;
  border-radius: 50%;
  opacity: .55;
  animation: dd-drift 9s ease-in-out infinite alternate;
  pointer-events: none;
}
.pool.p1 { left: 18%; top: 8%; background: radial-gradient(closest-side, rgba(255, 111, 89, .75), transparent) }
.pool.p2 { left: 38%; top: 30%; background: radial-gradient(closest-side, rgba(46, 230, 201, .6), transparent); animation-delay: -3s }
.pool.p3 { left: 48%; top: 4%; background: radial-gradient(closest-side, rgba(255, 143, 171, .75), transparent); animation-delay: -6s }
.scene.party .pool { animation: dd-pool calc(var(--beat) * 2) ease-out infinite }
.scene.party .pool.p2 { animation-delay: calc(var(--beat) * -1) }
.scene.party .floor { filter: brightness(1.12) saturate(1.15) }

.shadow {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--s, 48px);
  height: var(--s, 48px);
  margin: calc(var(--s, 48px) / -2) 0 0 calc(var(--s, 48px) / -2);
  border-radius: 32%;
  background: radial-gradient(closest-side, rgba(40, 10, 0, .7), rgba(40, 10, 0, .35) 60%, transparent);
  pointer-events: none;
}
.halo {
  position: absolute;
  left: 0;
  top: 0;
  width: calc(var(--s, 48px) * 2.6);
  height: calc(var(--s, 48px) * 2.6);
  margin: calc(var(--s, 48px) * -1.3) 0 0 calc(var(--s, 48px) * -1.3);
  border-radius: 50%;
  background: radial-gradient(closest-side, rgba(255, 209, 102, .7), rgba(255, 79, 154, .35) 55%, transparent);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s;
}
.halo.on { opacity: 1; animation: dd-halo calc(var(--beat) * 2) ease-in-out infinite }
.impact {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--s, 48px);
  height: var(--s, 48px);
  margin: calc(var(--s, 48px) / -2) 0 0 calc(var(--s, 48px) / -2);
  border-radius: 50%;
  border: 3px solid rgba(255, 236, 214, .85);
  box-shadow: 0 0 10px rgba(255, 143, 171, .8), inset 0 0 8px rgba(255, 209, 102, .6);
  pointer-events: none;
}

/* Fuzzy dice */
.die { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; will-change: transform }
.die .dbody { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; animation: dd-sway 1.25s ease-in-out infinite alternate }
#die1 .dbody { animation-delay: -1.25s }
.scene.charging .dbody, .scene.rolling .dbody { animation: none }
.die .face, .die .core {
  position: absolute;
  left: calc(var(--s, 48px) / -2);
  top: calc(var(--s, 48px) / -2);
  width: var(--s, 48px);
  height: var(--s, 48px);
}
.die .core { left: calc(var(--s, 48px) * -.45); top: calc(var(--s, 48px) * -.45); width: calc(var(--s, 48px) * .9); height: calc(var(--s, 48px) * .9); background: #c22a6c }
.die .k1 { transform: translateZ(calc(var(--s, 48px) * .45)) }
.die .k6 { transform: rotateY(180deg) translateZ(calc(var(--s, 48px) * .45)) }
.die .k2 { transform: rotateY(90deg) translateZ(calc(var(--s, 48px) * .45)) }
.die .k5 { transform: rotateY(-90deg) translateZ(calc(var(--s, 48px) * .45)) }
.die .k3 { transform: rotateX(90deg) translateZ(calc(var(--s, 48px) * .45)) }
.die .k4 { transform: rotateX(-90deg) translateZ(calc(var(--s, 48px) * .45)) }
.die .face {
  border-radius: 24%;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background:
    radial-gradient(circle at 28% 22%, rgba(255, 255, 255, .34), transparent 55%),
    repeating-radial-gradient(circle at 23% 37%, rgba(255, 220, 240, .14) 0 1px, transparent 1px 3px),
    repeating-radial-gradient(circle at 71% 64%, rgba(120, 0, 55, .16) 0 1px, transparent 1px 2.6px),
    repeating-conic-gradient(from 7deg at 50% 50%, rgba(255, 255, 255, .05) 0 4deg, rgba(90, 0, 40, .05) 4deg 9deg),
    var(--fur);
  box-shadow: inset 0 0 calc(var(--s, 48px) * .13) rgba(130, 0, 60, .6), inset 0 0 0 1px rgba(255, 170, 210, .35), 0 0 2px 1px rgba(255, 120, 185, .65);
}
.die .f1 { transform: translateZ(calc(var(--s, 48px) / 2)) }
.die .f6 { transform: rotateY(180deg) translateZ(calc(var(--s, 48px) / 2)) }
.die .f2 { transform: rotateY(90deg) translateZ(calc(var(--s, 48px) / 2)) }
.die .f5 { transform: rotateY(-90deg) translateZ(calc(var(--s, 48px) / 2)) }
.die .f3 { transform: rotateX(90deg) translateZ(calc(var(--s, 48px) / 2)) }
.die .f4 { transform: rotateX(-90deg) translateZ(calc(var(--s, 48px) / 2)) }
.die .shade { position: absolute; inset: 0; border-radius: inherit; background: #3a0420; opacity: .3; pointer-events: none }
.pip {
  position: absolute;
  width: 20%;
  height: 20%;
  margin: -10% 0 0 -10%;
  border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #fff 0 28%, #ffe4f1 55%, #f2a3c9);
  box-shadow: inset 0 -1px 2px rgba(120, 0, 60, .45), 0 0 0 1px rgba(150, 20, 80, .22), 0 1px 1px rgba(255, 255, 255, .25);
}

.vignette {
  position: absolute;
  inset: 0;
  z-index: 5;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 55%, transparent 55%, rgba(3, 20, 24, .55));
  transition: background .4s;
}
.vignette::after { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 55% at 50% 82%, transparent 35%, rgba(3, 14, 18, .7)); opacity: 0; transition: opacity .3s }
.scene.charging .vignette::after { opacity: 1; transition: opacity 1.1s ease-in }
.scene.charged .lights { animation-duration: .36s }
.scene.drama .vignette { background: radial-gradient(60% 55% at var(--spot-x, 50%) var(--spot-y, 70%), transparent 30%, rgba(3, 14, 18, .82)) }
.scene.lifting .vignette { background: radial-gradient(38% 46% at var(--spot-x, 50%) var(--spot-y, 50%), rgba(255, 240, 200, .16) 25%, rgba(3, 14, 18, .78) 80%) }
.readout { transition: opacity .25s }
.scene.lifting .readout { opacity: 0 }

/* Readout: total + call + quip */
.readout {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(var(--horizon, 180px) * .5);
  z-index: 7;
  display: grid;
  justify-items: center;
  pointer-events: none;
  text-align: center;
  translate: 0 -50%;
}
.total {
  font: 400 clamp(64px, 19vw, 128px)/.86 var(--f-retro);
  background: linear-gradient(180deg, #fff7dc 10%, var(--butter) 42%, #ff8f5a 68%, var(--fur));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 4px 0 #6b1d3a) drop-shadow(0 0 22px rgba(255, 120, 160, .7));
  opacity: 0;
}
.total.on { opacity: 1; animation: dd-slam .5s var(--ease-back) both }
.call {
  margin-top: 4px;
  font: 400 clamp(18px, 5.4vw, 30px)/1 var(--f-marquee);
  color: #fff;
  letter-spacing: .03em;
  text-shadow: 0 2px 0 #7a1d47, 0 0 14px var(--fur);
  opacity: 0;
}
.call.on { opacity: 1; animation: dd-rise .45s .12s var(--ease-back) both }
.call.seven { color: var(--butter); text-shadow: 0 2px 0 #7a3a00, 0 0 18px #ffb000 }
.call.snake { color: #b9ffd9; text-shadow: 0 2px 0 #0b4d33, 0 0 16px #2bff9a }
.call.sad { color: #ffd9e2; text-shadow: 0 2px 0 #4a1530, 0 0 10px rgba(255, 143, 171, .5) }
.winline {
  position: absolute;
  left: 50%;
  top: 100%;
  margin-top: 6px;
  translate: -50% 0;
  padding: 3px 18px 5px;
  border-radius: 999px;
  white-space: nowrap;
  font: 800 clamp(30px, 8.6vw, 50px)/1 var(--f-cond);
  letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  color: #fff6d6;
  background: linear-gradient(180deg, rgba(120, 40, 0, .55), rgba(60, 10, 20, .55));
  box-shadow: 0 0 0 2px rgba(255, 209, 102, .75), 0 0 26px rgba(255, 209, 102, .55);
  text-shadow: 0 2px 0 #6b2a00, 0 0 16px rgba(255, 209, 102, .9);
  opacity: 0;
}
.winline.on { opacity: 1; animation: dd-slam .45s var(--ease-back) both }
.winline.part { color: var(--cream); box-shadow: 0 0 0 1.5px rgba(255, 243, 224, .5); text-shadow: 0 2px 0 rgba(0, 0, 0, .5); font-size: clamp(24px, 6.6vw, 36px) }
.winline.pop { animation: dd-pop .4s var(--ease-back) }
.hint {
  position: absolute;
  left: 50%;
  bottom: 12px;
  z-index: 7;
  width: max-content;
  max-width: calc(100% - 24px);
  translate: -50% 0;
  padding: 6px 16px 7px;
  border-radius: 20px;
  background: rgba(6, 28, 33, .74);
  box-shadow: 0 0 0 1px rgba(46, 230, 201, .3);
  font: 400 clamp(19px, 5vw, 26px)/1.1 var(--f-script);
  color: #ffe9dc;
  text-align: center;
  text-wrap: balance;
  pointer-events: none;
  transition: opacity .25s;
}
.hint.pop { animation: dd-hint .45s var(--ease-back) }
.hint.good { color: var(--butter); box-shadow: 0 0 0 1px rgba(255, 209, 102, .6), 0 0 22px rgba(255, 209, 102, .35) }
.hint.bad { color: #ffc0cf }
.scene.charging .hint, .scene.rolling .hint, .hint:empty { opacity: 0 }

.help { position: absolute; top: 8px; right: 8px; z-index: 8; width: 44px; height: 44px; min-height: 44px; font: 400 20px/1 var(--f-marquee) }

/* THE LIFT banner */
.liftbanner {
  position: absolute;
  left: 0;
  right: 0;
  top: 12%;
  z-index: 9;
  display: grid;
  justify-items: center;
  pointer-events: none;
  text-align: center;
  opacity: 0;
}
.liftbanner.on { opacity: 1 }
.liftbanner b {
  font: 400 clamp(54px, 16vw, 120px)/.9 var(--f-retro);
  background: linear-gradient(180deg, #fff 0 20%, #ffe08a 45%, var(--coral) 75%, var(--fur));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 5px 0 var(--teal-d)) drop-shadow(0 0 30px rgba(255, 143, 171, .9));
  animation: dd-slam .6s var(--ease-back) both;
}
.liftbanner span { font: 400 clamp(22px, 6vw, 36px)/1.1 var(--f-script); color: #fff1e6; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 12px var(--fur); animation: dd-rise .5s .25s var(--ease-back) both }
.liftbanner i { margin-top: 6px; font: 800 clamp(26px, 7vw, 44px)/1 var(--f-cond); font-style: normal; color: var(--butter); text-shadow: 0 2px 0 #6b3a00, 0 0 16px rgba(255, 209, 102, .8); animation: dd-rise .5s .45s var(--ease-back) both }

/* ---------- Lift meter + stake ---------- */
.liftrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 38px }
.lift {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 12px 4px 10px;
  border-radius: 999px;
  background: rgba(6, 28, 33, .6);
  box-shadow: inset 0 0 0 1px rgba(255, 143, 171, .3);
  min-height: 38px;
}
.lift-label { display: grid; line-height: 1 }
.lift-label b { font: 400 15px/1 var(--f-marquee); color: var(--sunset); letter-spacing: .03em }
.lift-label small { font: 700 10px/1.2 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: #9fd9cf }
.hearts { display: flex; gap: 4px }
.heart { width: 26px; height: 24px; display: block; transition: filter .2s }
.heart path { fill: rgba(255, 143, 171, .14); stroke: rgba(255, 143, 171, .55); stroke-width: 1.5; transition: fill .2s }
.heart.on path { fill: url(#hg); stroke: #fff1f6 }
.heart.on { filter: drop-shadow(0 0 6px rgba(255, 79, 154, .9)) }
.lift.hot { animation: dd-throb 1s ease-in-out infinite }
.lift.full { box-shadow: inset 0 0 0 2px var(--butter), 0 0 24px rgba(255, 209, 102, .6) }
.lift.warn { box-shadow: inset 0 0 0 1.5px rgba(255, 111, 89, .9) }
.lift.warn .lift-label small { color: #ffb3a3 }
.lift.warn .heart.on { filter: grayscale(.4) drop-shadow(0 0 4px rgba(255, 111, 89, .8)) }
.stake { display: grid; justify-items: end; line-height: 1; font: 700 11px/1 var(--f-cond); letter-spacing: .16em; text-transform: uppercase; color: #9fd9cf }
.stake b { font: 800 24px/1 var(--f-cond); letter-spacing: .02em; color: var(--cream); font-variant-numeric: tabular-nums }
.stake b.pulse { animation: c-pop .35s var(--ease-back) }

/* ---------- Betting board ---------- */
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.spot {
  --c1: #1a9a8e;
  --c2: #0f6c66;
  position: relative;
  display: grid;
  align-content: start;
  justify-items: start;
  gap: 1px;
  min-height: 66px;
  min-width: 0;
  padding: 7px 8px 6px;
  border: 0;
  border-radius: 14px;
  text-align: left;
  color: #fff;
  cursor: pointer;
  background:
    repeating-linear-gradient(-45deg, rgba(255, 255, 255, .05) 0 6px, transparent 6px 12px),
    linear-gradient(180deg, var(--c1), var(--c2));
  box-shadow: 0 4px 0 rgba(0, 0, 0, .38), inset 0 0 0 1.5px rgba(255, 243, 224, .35), inset 0 1px 0 rgba(255, 255, 255, .35);
  transition: translate .12s var(--ease-back), box-shadow .2s, filter .25s, opacity .25s;
  touch-action: manipulation;
}
.spot:active { translate: 0 2px }
.spot { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none }
.spot[data-k="seven"] { --c1: #ff7f66; --c2: #d94a3a }
.spot[data-k="doubles"] { --c1: #f2679b; --c2: #b83170 }
.spot[data-k="snake"] { --c1: #3e9a72; --c2: #1d5e45 }
.spot[data-k="boxcars"] { --c1: #d99a3e; --c2: #9c5f1d }

<script>
(() => {
  'use strict';
  const C = window.Casino;
  C.init({ id: 'dirty-dicing', title: 'Dirty Dicing', minBet: 5 });
  const { wallet, sfx, fx, rng } = C;
  const $ = (s) => document.querySelector(s);
  const clamp = C.clamp;
  const lerp = (a, b, t) => a + (b - a) * t;
  const fmt = C.fmt;
  const RM = () => fx.reducedMotion;
  // Haptics only after the page has been touched (Chrome logs an error for earlier calls).
  const vib = (p) => { if (!navigator.userActivation || navigator.userActivation.hasBeenActive) fx.vibrate(p); };

  /* MATH-BEGIN */
  // Two fair dice from Casino.rng: 36 equally likely outcomes. Each spot returns a fixed multiple of its stake
  // (stake included), settled independently:
  //   UNDER 7  totals 2-6   15/36 x 2.3 = 95.83%      SNAKE EYES  1-1   1/36 x 34 = 94.44%
  //   LUCKY 7  total 7       6/36 x 5.8 = 96.67%      ANY DOUBLES       6/36 x 5.8 = 96.67%
  //   OVER 7   totals 8-12  15/36 x 2.3 = 95.83%      BOXCARS     6-6   1/36 x 34 = 94.44%
  // THE LIFT: a roll whose total return beats its total stake is a winning roll. Three winning rolls in a row WITH THE
  // SAME BETS pay a bonus of 25% of the smallest of those three net wins, then the meter empties. Changing the bets
  // starts a new streak. (QA found that, without the same-bets rule, switching mixes between streak steps, e.g. a
  // high-hit Under+Seven mix sized to the earlier wins on the third roll, reached 98.6%.) With it, every streak is
  // one fixed mix, so the long-run RTP can never beat the best fixed mix.
  // EXACT (renewal-reward over every 36^3 roll sequence, run through this block): under/over 97.31%,
  //   seven/doubles 97.13%, snake/boxcars 94.46%; best possible fixed mix (LUCKY 7 + DOUBLES, equal chips) 97.89%.
  // Half chips (2.3 x 5 = 11.5) are settled by a fair coin flip, so the expected return is exact at every stake.
  // MEASURED by a node Monte Carlo through this exact block, 4M rolls per strategy (with THE LIFT):
  //   under 97.26%, over 97.31%, seven 97.01%, doubles 96.89%, snake 94.19%, boxcars 94.40% (34x spots: +-0.3%),
  //   seven+doubles 97.82%, under+over hedge 96.70%, 5-chip under (coin-flip rounding) 97.32%, random mixes 96.18%;
  //   the three mix-switching exploits that used to beat 98% now never complete a LIFT (96.5-96.7%).
  const MATH = {
    LIFT_SHARE: 0.25,
    SPOTS: [
      { k: 'under', m10: 23, hit: (a, b) => a + b < 7 },
      { k: 'seven', m10: 58, hit: (a, b) => a + b === 7 },
      { k: 'over', m10: 23, hit: (a, b) => a + b > 7 },
      { k: 'snake', m10: 340, hit: (a, b) => a === 1 && b === 1 },
      { k: 'doubles', m10: 58, hit: (a, b) => a === b },
      { k: 'boxcars', m10: 340, hit: (a, b) => a === 6 && b === 6 },
    ],
    fairRound(x, float) {
      const f = Math.floor(x + 1e-9);
      const frac = x - f;
      return frac > 1e-9 && float() < frac ? f + 1 : f;
    },
    // A bet layout's signature: THE LIFT only carries over between rolls with the same signature.
    sig(bets) { return MATH.SPOTS.map((s) => (bets && bets[s.k]) || 0).join(','); },
    // bets: { key: chips }. lift: { streak, min, sig } carried between rolls. Everything one roll settles.
    settle(bets, a, b, lift, float) {
      const sig = MATH.sig(bets);
      const carried = lift && lift.streak > 0 && lift.sig === sig;
      const reset = !!(lift && lift.streak > 0 && !carried);
      const prev = carried ? lift : { streak: 0, min: Infinity };
      let stake = 0;
      let ret10 = 0;
      const wins = {};
      for (const s of MATH.SPOTS) {
        const v = bets[s.k] || 0;
        stake += v;
        if (v && s.hit(a, b)) {
          ret10 += v * s.m10;
          wins[s.k] = (v * s.m10) / 10;
        }
      }
      const ret = ret10 / 10;
      const profit = ret - stake;
      const won = profit > 1e-9;
      let streak = won ? prev.streak + 1 : 0;
      let min = won ? Math.min(prev.min, profit) : Infinity;
      let bonusRaw = 0;
      let lifted = false;
      if (streak >= 3) {
        lifted = true;
        bonusRaw = MATH.LIFT_SHARE * min;
        streak = 0;
        min = Infinity;
      }
      return {
        stake, ret, profit, wins, won, lifted, bonusRaw, reset,
        pay: MATH.fairRound(ret, float),
        bonus: lifted ? MATH.fairRound(bonusRaw, float) : 0,
        liftAfter: { streak, min, sig },
      };
    },
  };
  /* MATH-END */

  const SPOT_UI = {
    under: { name: 'UNDER 7', sub: 'Slow dance', pay: '2.3×', aria: 'Under 7, totals 2 to 6' },
    seven: { name: 'LUCKY 7', sub: 'Seventh heaven', pay: '5.8×', aria: 'Lucky 7, total of 7' },

  /* ---------- 3D maths for the cubes ---------- */

    g.stroke();
    g.restore();
  }, { size: [10, 16], speed: [60, 200], gravity: -90, drag: 1.2, life: [1.1, 1.8], colors: ['#2ee6c9', '#ffd166', '#fff3e0', '#ff8fab'] });

  /* ---------- Betting state ---------- */
  const LAST_KEY = 'bmc.dirty-dicing.last';
  const CHIP_KEY = 'bmc.dirty-dicing.chip';
  function sanitize(b) {
    if (!b || typeof b !== 'object') return null;
    const o = {};
    let n = 0;
    for (const k of KEYS) {
      const v = Math.floor(+b[k] || 0);
      if (v > 0) { o[k] = v; n += v; }
    }
    return n ? o : null;
  }
  const sum = (b) => KEYS.reduce((s, k) => s + ((b && b[k]) || 0), 0);
  const state = {
    phase: 'idle', // idle | charging | rolling | paying
    bets: {},
    last: sanitize(C.store.get(LAST_KEY, null)),
    chip: CHIPS.includes(C.store.get(CHIP_KEY, 25)) ? C.store.get(CHIP_KEY, 25) : 25,
    lift: { streak: 0, min: Infinity, sig: '' },
    rounds: 0,
  };

  const chipsFor = (v) => {
    const out = [];
    for (const c of [500, 100, 25, 5]) while (v >= c && out.length < 5) { out.push(c); v -= c; }
    if (!out.length) out.push(5);
    return out;
  };
  function renderStack(k, opts = {}) {
    const st = spotEls[k].querySelector('.stack');
    const v = state.bets[k] || 0;
    st.classList.remove('sweep');
    if (!v) {
      st.classList.add('empty');
      st.innerHTML = '';
      return st;
    }
    st.classList.remove('empty');
    const cs = chipsFor(v);
    st.innerHTML = cs.map((c, i) => `<i data-v="${c}" style="bottom:${i * 3}px"></i>`).join('') + `<b style="top:${-(cs.length - 1) * 3 - 14}px">${fmt(v)}</b>`;
    if (opts.anim) fx.anim(st, 'c-jelly');
    return st;
  }
  function renderAllStacks() { for (const k of KEYS) renderStack(k); }

  function stakePoint(k) {
    const r = spotEls[k].getBoundingClientRect();
    return { x: r.right - 21, y: r.bottom - 21 };
  }
  function flyChip(from, to, v, opts = {}) {
    const a = fx.point(from);
    const b = fx.point(to);
    const el = document.createElement('div');
    el.className = 'cchip flychip';
    el.dataset.v = v;
    document.body.appendChild(el);
    const ms = RM() ? 140 : opts.ms || 300;
    const lift = RM() ? 0 : 50 + Math.random() * 40;
    const mx = (a.x + b.x) / 2;
    const my = Math.min(a.y, b.y) - lift;
    const anim = el.animate([
      { transform: `translate(${a.x}px, ${a.y}px) scale(${opts.s0 || 1.4}) rotate(0deg)` },
      { transform: `translate(${mx}px, ${my}px) scale(1.25) rotate(200deg)`, offset: 0.55 },
      { transform: `translate(${b.x}px, ${b.y}px) scale(${opts.s1 || 1}) rotate(360deg)` },
    ], { duration: ms, easing: 'cubic-bezier(.4,.1,.5,1)', delay: opts.delay || 0, fill: 'both' });
    const done = () => el.remove();
    return anim.finished.then(done, done);
  }

  function selectChip(v, sound = true) {
    state.chip = v;
    C.store.set(CHIP_KEY, v);
    for (const c of CHIPS) chipEls[c].setAttribute('aria-pressed', String(c === v));
    if (sound) {
      sfx.chip(0.8 + CHIPS.indexOf(v) * 0.12);
      fx.anim(chipEls[v], 'c-pop');
    }
  }

  function nudge(el, msg) {
    wobble(el);
    sfx.buzz();
    vib(30);
    if (msg) C.toast(msg, 'bad');
  }

  const busy = () => state.phase !== 'idle';

  function placeChip(k) {
    if (busy()) return;
    const v = state.chip;
    const cur = sum(state.bets);
    if (cur + v > wallet.balance) {
      nudge(spotEls[k], wallet.balance < MIN_BET ? 'Out of chips, darling. Your residuals are up top.' : 'Not enough chips for that move, darling.');
      return;
    }
    clearResults();
    state.bets[k] = (state.bets[k] || 0) + v;
    const n = chipsFor(state.bets[k]).length;
    sfx.tap();
    flyChip(chipEls[v], stakePoint(k), v).then(() => {
      renderStack(k, { anim: true });
      sfx.chip(0.86 + n * 0.05 + Math.random() * 0.04);
      fx.burst(stakePoint(k), { type: 'spark', count: 6, speed: [120, 300] });
    });
    updateUI();
  }
  function removeBet(k) {
    if (busy() || !state.bets[k]) return;
    const v = state.bets[k];
    delete state.bets[k];
    flyChip(stakePoint(k), chipEls[state.chip], chipsFor(v)[0], { s0: 1, s1: 0.6 });
    renderStack(k);
    sfx.chips(2);
    updateUI();
  }
  function clearBets(quiet) {
    if (busy()) return;
    const ks = KEYS.filter((k) => state.bets[k]);
    if (!ks.length) {
      if (!quiet) nudge(clearBtn);
      return;
    }
    ks.forEach((k, i) => flyChip(stakePoint(k), chipEls[state.chip], chipsFor(state.bets[k])[0], { s0: 1, s1: 0.6, delay: i * 40, ms: 260 }));
    state.bets = {};
    renderAllStacks();
    clearResults();
    sfx.chips(4);
    sfx.whoosh(0.25, 0.1);
    setHint('Fresh dance card. Place your chips.');
    updateUI();
  }
  // Put last round's chips back on the board. Returns false (and says why) if that is not possible.
  function rebet(quiet) {
    if (busy()) return false;
    const last = state.last;
    if (!last) {
      if (!quiet) nudge(rebetBtn, 'No last dance to repeat yet.');
      return false;
    }
    const need = sum(last);
    if (need > wallet.balance) {
      nudge(rebetBtn, `Rebet needs ${fmt(need)} chips. You have ${fmt(wallet.balance)}.`);
      return false;
    }
    clearResults();
    state.bets = { ...last };
    let i = 0;
    for (const k of KEYS) {
      if (!state.bets[k]) { renderStack(k); continue; }
      const top = chipsFor(state.bets[k])[0];
      const from = chipEls[top] || chipEls[state.chip];
      flyChip(from, stakePoint(k), top, { delay: i * 45, ms: 260 }).then(() => {
        renderStack(k, { anim: true });
        sfx.chip(0.9 + Math.random() * 0.2);
      });
      i++;
    }
    sfx.chips(Math.min(6, i + 2));
    updateUI();
    return true;
  }

  /* ---------- HUD ---------- */
  let hintTimer = 0;
  function setHint(text, tone = '') {
    hintEl.textContent = text;
    hintEl.className = `hint ${tone}`;
    void hintEl.offsetWidth;
    hintEl.classList.add('pop');
    clearTimeout(hintTimer);
  }
  let shownStake = 0;
  function updateUI() {
    const st = sum(state.bets);
    if (st !== shownStake) {
      shownStake = st;
      stakeEl.textContent = fmt(st);
      fx.anim(stakeEl, 'pulse');
    }
    const idle = !busy();
    for (const k of KEYS) spotEls[k].classList.toggle('locked', !idle);
    for (const k of KEYS) spotEls[k].setAttribute('aria-label', `${SPOT_UI[k].aria}, pays ${SPOT_UI[k].pay}${state.bets[k] ? `, ${state.bets[k]} chips on it` : ''}`);
    clearBtn.disabled = !idle || !st;
    rebetBtn.disabled = !idle || !state.last;
    let sub = 'hold to blow';
    if (state.phase === 'charging') sub = 'let go!';
    else if (!idle) sub = 'rolling…';
    else if (!st && state.last) sub = 'rebet + roll';
    else if (!st) sub = 'place chips';
    rollSub.textContent = sub;
    rollBtn.setAttribute('aria-disabled', String(!idle && state.phase !== 'charging'));
    rollBtn.classList.toggle('idle-pulse', idle && (st > 0 || !!state.last));
    paintLift();
  }
  // pending: a heart count to show mid-reveal. Otherwise the meter shows the streak, and warns when the chips on the
  // board differ from the streak's bets (rolling them would start a new streak).
  let liftWarned = false;
  function paintLift(pending) {
    const n = pending ?? state.lift.streak;
    const warn = pending === undefined && n > 0 && state.phase === 'idle' && sum(state.bets) > 0 && MATH.sig(state.bets) !== state.lift.sig;
    hearts.forEach((h, i) => h.classList.toggle('on', i < n));
    liftEl.classList.toggle('hot', n === 2 && !warn);
    liftEl.classList.toggle('warn', warn);
    liftSub.textContent = warn ? 'new bets restart it' : n === 0 ? '3 wins, same bets' : n === 1 ? '2 more wins' : 'one more win!';
    if (warn && !liftWarned) {
      fx.anim(liftEl, 'c-wobble');
      setHint('New bets restart THE LIFT. Clear, then Rebet to keep your streak.');
    }
    liftWarned = warn;
  }
  function clearResults() {
    for (const k of KEYS) {
      spotEls[k].classList.remove('win', 'lose');
      spotEls[k].querySelector('.won')?.remove();
    }
    totalEl.className = 'total';
    callEl.className = 'call';
    winEl.className = 'winline';
    scene.classList.remove('showing');
    haloEls.forEach((h) => h.classList.remove('on'));
  }

  /* ---------- Dice poses and the render loop ---------- */
  const rand = (a, b) => a + Math.random() * (b - a); // cosmetic only; outcomes come from Casino.rng
  const wrap = (d) => ((((d + 180) % 360) + 360) % 360) - 180;
  const easeOut = (t) => 1 - (1 - t) ** 3;
  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const HAND = [{ x: -10.5, y: YFRONT - 12, z: 9 }, { x: 10.5, y: YFRONT - 11, z: 11 }];

  function restPose(face, x, y) {
    return { x, y, z: 0, yaw: rand(-30, 30), a: BASE[face][0], b: BASE[face][1], face };
  }
  const dice = [0, 1].map((i) => ({
    i,
    el: dieEls[i],
    sh: shEls[i],
    halo: haloEls[i],
    rest: restPose(i ? 4 : 3, i ? 10 : -10, 46 + i * 4),
    pose: null,
  }));
  dice.forEach((d) => { d.pose = { ...d.rest }; });

  function renderDie(d, p) {
    const u = L.u;
    let M = orient(p.yaw, p.a, p.b);
    let tilt = '';
    if (p.td && p.tk) {
      M = mMul(mAxis(p.tk[0], p.tk[1], p.td), M);
      tilt = `rotate3d(${p.tk[0].toFixed(4)},${p.tk[1].toFixed(4)},0,${p.td.toFixed(2)}deg) `;
    }
    const ext = (S / 2) * (Math.abs(M[6]) + Math.abs(M[7]) + Math.abs(M[8]));
    // Fake lighting: darken each face by how far its normal turns away from a light above and in front.
    if (!d.shades) d.shades = [0, 1, 2, 3, 4, 5, 6].map((f) => (f ? d.el.querySelector(`.f${f} .shade`) : null));
    if (!d.shadeV) d.shadeV = [];
    for (let f = 1; f <= 6; f++) {
      const n = NORMAL[f];
      const dot = (M[0] * n[0] + M[1] * n[1] + M[2] * n[2]) * LIGHT[0] + (M[3] * n[0] + M[4] * n[1] + M[5] * n[2]) * LIGHT[1] + (M[6] * n[0] + M[7] * n[1] + M[8] * n[2]) * LIGHT[2];
      const v = Math.round(clamp(0.66 * (1 - Math.max(0, dot)) ** 1.2, 0, 0.66) * 100) / 100;
      if (d.shadeV[f] !== v) { d.shadeV[f] = v; d.shades[f].style.opacity = v; }
    }
    const sq = clamp(p.sq || 0, -0.25, 0.4);
    const sz = 1 - sq;
    const sxy = 1 + sq * 0.55;
    const X = L.fw / 2 + p.x * u;
    const Y = p.y * u;
    const Z = (Math.max(0, p.z) + ext * sz) * u;
    d.el.style.transform = `translate3d(${X.toFixed(2)}px,${Y.toFixed(2)}px,${Z.toFixed(2)}px) scale3d(${sxy.toFixed(3)},${sxy.toFixed(3)},${sz.toFixed(3)}) ${tilt}rotateZ(${p.yaw.toFixed(2)}deg) rotateX(${p.a.toFixed(2)}deg) rotateY(${p.b.toFixed(2)}deg)`;
    const hz = Math.max(0, p.z);
    const k = 1 / (1 + hz * 0.06);
    d.sh.style.transform = `translate(${X.toFixed(2)}px,${(Y + hz * u * 0.12).toFixed(2)}px) rotateZ(${p.yaw.toFixed(1)}deg) scale(${(1.05 + (1 - k) * 0.7).toFixed(3)})`;
    d.sh.style.opacity = (0.9 * k).toFixed(3);
    d.halo.style.transform = `translate(${X.toFixed(2)}px,${Y.toFixed(2)}px)`;
    d.depth = p.y + p.z * 0.35;
  }
  // The die nearer the camera (larger y) draws on top.
  let frontDie = -1;
  function depthSort() {
    const f = (dice[1].depth || 0) > (dice[0].depth || 0) ? 1 : 0;
    if (f === frontDie) return;
    frontDie = f;
    planeEls[f].style.zIndex = 4;
    planeEls[1 - f].style.zIndex = 3;
  }

  // Ballistic die with floor bounces, a back wall, side walls and a skid to rest. Units: floor units and seconds.
  function simulate(o) {
    const dt = 1 / 240;
    const G = 560;
    const FR = 115;
    const hs = S / 2;
    let { x, y, z, vx, vy, vz } = o;
    const f = [];
    const ev = [];
    let dist = 0;
    let t = 0;
    let grounded = false;
    for (let i = 0; i < 1400; i++) {
      const px = x, py = y, pz = z;
      if (!grounded) vz -= G * dt;
      x += vx * dt;
      y += vy * dt;
      z += vz * dt;
      if (y < hs) {
        y = hs;
        if (vy < 0) {
          const vin = -vy;
          ev.push({ t, type: 'wall', v: vin });
          vy = vin * 0.5;
          vx += rand(-18, 18);
          vz = Math.max(vz, 0) + vin * 0.32;
          grounded = false;
        }
      }
      if (x < -XMAX + hs && vx < 0) { x = -XMAX + hs; ev.push({ t, type: 'side', v: -vx }); vx = -vx * 0.5; }
      if (x > XMAX - hs && vx > 0) { x = XMAX - hs; ev.push({ t, type: 'side', v: vx }); vx = -vx * 0.5; }
      if (y > YFRONT && vy > 0) { y = YFRONT; vy = -vy * 0.3; }
      if (!grounded && z <= 0) {
        z = 0;
        const vin = -vz;
        if (vin > 45) {
          ev.push({ t, type: 'floor', v: vin });
          vz = vin * 0.4;
          vx *= 0.84;
          vy *= 0.84;
        } else {
          vz = 0;
          grounded = true;
          ev.push({ t, type: 'land', v: Math.hypot(vx, vy) });
        }
      }
      if (grounded) {
        const sp = Math.hypot(vx, vy);
        const dec = FR * dt;
        if (sp <= dec) { vx = 0; vy = 0; } else { vx -= (vx / sp) * dec; vy -= (vy / sp) * dec; }
      }
      dist += Math.hypot(x - px, y - py, z - pz);
      f.push([t, x, y, z, dist, grounded ? 1 : 0]);
      t += dt;
      if (grounded && !vx && !vy) break;
    }
    let ti = f.length - 1;
    while (ti > 0 && f[ti - 1][5]) ti--;
    const last = f[f.length - 1];
    return { f, ev, end: last[0], tumbleIdx: ti, tumbleT: f[ti][0], tumbleD: Math.max(1, f[ti][4]), totalD: last[4], x: last[1], y: last[2] };
  }

  // Pick a natural-looking throw: dice end apart, inside the floor, and one clearly stops before the other.
  function planThrow(power) {
    let best = null;
    for (let attempt = 0; attempt < 80; attempt++) {
      const sims = dice.map((d, i) => {
        const p = d.pose;
        return simulate({
          x: p.x, y: p.y, z: Math.max(0, p.z),
          vx: (i ? 1 : -1) * rand(0, 12) + rand(-10, 10),
          vy: -(150 + 75 * power) * rand(0.86, 1.1),
          vz: rand(25, 70),
        });
      });
      const [a, b] = sims;
      const gap = Math.hypot(a.x - b.x, a.y - b.y);
      const okY = sims.every((s) => s.y > S * 0.6 && s.y < YFRONT - 16);
      const sep = Math.abs(a.end - b.end);
      const score = (gap >= S * 1.75 ? 2 : 0) + (okY ? 2 : 0) + (sep >= 0.25 ? 1 : 0);
      if (!best || score > best.score) best = { sims, score };
      if (score === 5) break;
    }
    return best.sims;
  }

  // Orientation track: Euler angles that unwind onto the target face as the die rolls (by distance travelled).
  function orientPlan(d, sim, face) {
    const p = d.pose;
    const aF = BASE[face][0];
    const bF = BASE[face][1];
    const yawF = rand(-180, 180);
    const turns = Math.round(clamp(sim.tumbleD / (S * 4.2), 1, 3));
    const sgn = () => (Math.random() < 0.5 ? -1 : 1);
    const skidYaw = sgn() * rand(20, 110) * clamp((sim.totalD - sim.tumbleD) / 20, 0.2, 1.4);
    const fi = sim.tumbleIdx;
    const f0 = sim.f[Math.max(0, fi - 8)];
    const f1 = sim.f[Math.min(sim.f.length - 1, fi + 8)];
    const dx = f1[1] - f0[1], dy = f1[2] - f0[2];
    const dl = Math.hypot(dx, dy) || 1;
    return {
      face, aF, bF, yawF, skidYaw,
      offA: wrap(p.a - aF) + 360 * turns * sgn(),
      offB: wrap(p.b - bF) + 360 * Math.round(rand(0, turns)) * sgn(),
      offY: wrap(p.yaw - (yawF + skidYaw)) + 360 * Math.round(rand(0, 1)) * sgn(),
      wobAxis: [-dy / dl, dx / dl],
      wobAmp: RM() ? 3 : clamp(6 + (sim.f[fi] ? 8 : 0), 6, 14),
    };
  }

  /* Loop state */
  const loop = {
    mode: 'idle', // idle | charge | throw
    clock: 0,
    charge: null,
    thr: null,
    dance: null,
    lift: null,
    fidget: null,
    slump: null,
  };
  let fidgetTimer = 0;
  function scheduleFidget() {
    clearTimeout(fidgetTimer);
    fidgetTimer = setTimeout(() => {
      if (state.phase === 'idle' && !loop.dance && !loop.lift && !loop.fidget && !loop.slump && !document.hidden && !RM()) {
        const turn = (Math.random() < 0.5 ? -1 : 1) * rand(30, 75);
        loop.fidget = { die: Math.random() < 0.5 ? 0 : 1, t0: loop.clock, dur: 0.62, h: rand(3.5, 6), turn, landed: false };
        wake();
      }
      scheduleFidget();
    }, 5200 + Math.random() * 4200);
  }

  function idlePose(d, t) {
    const p = { ...d.rest, td: 0, tk: null, sq: 0 };
    // Idle fidget: now and then one die crouches, hops, turns a little and lands (the floor is never dead).
    const fg = loop.fidget;
    if (fg && fg.die === d.i) {
      const k = (t - fg.t0) / fg.dur;
      if (k >= 1) {
        loop.fidget = null;
        d.rest.yaw += fg.turn;
        p.yaw = d.rest.yaw;
      } else if (k >= 0) {
        if (k < 0.16) p.sq = 0.2 * Math.sin((k / 0.16) * Math.PI * 0.5);
        else if (k < 0.7) {
          const a = (k - 0.16) / 0.54;
          p.z = Math.sin(Math.PI * a) * fg.h;
          p.sq = -0.12 * (1 - a);
        } else {
          p.yaw += fg.turn;
          p.sq = 0.2 * Math.sin(((k - 0.7) / 0.3) * Math.PI);
          if (!fg.landed) { fg.landed = true; snd.tok(0.22, 1.15); }
        }
        if (k < 0.7) p.yaw = d.rest.yaw + (k < 0.16 ? 0 : fg.turn * easeInOut((k - 0.16) / 0.54));
      }
    }
    // Loss slump: both dice sag like a sigh, then perk back up.
    const sl = loop.slump;
    if (sl) {
      const e = t - sl.t0 - d.i * 0.06;
      if (t - sl.t0 > sl.dur + 0.1) loop.slump = null;
      else if (e > 0 && e < sl.dur) p.sq = e < 0.14 ? 0.3 * (e / 0.14) : 0.3 * (1 - easeOut((e - 0.14) / (sl.dur - 0.14))) - 0.05 * Math.sin(((e - 0.14) / (sl.dur - 0.14)) * Math.PI);
    }
    const dn = loop.dance;
    if (dn) {
      const beat = (t - dn.t0) / dn.beat;
      if (beat >= dn.beats) loop.dance = null;
      else if (beat >= 0) {
        const k = Math.floor(beat);
        const ph = beat - k;
        if (k % 2 === d.i) {
          const h = RM() ? 2 : 7;
          p.z = Math.sin(Math.PI * Math.min(1, ph / 0.8)) * h * (ph < 0.8 ? 1 : 0);
          p.yaw += (k % 4 < 2 ? 1 : -1) * 14 * Math.sin(Math.PI * Math.min(1, ph / 0.8));
          if (ph >= 0.8) p.sq = 0.22 * Math.sin(((ph - 0.8) / 0.2) * Math.PI);
          else if (ph < 0.15) p.sq = 0.2 * (1 - ph / 0.15);
          else p.sq = -0.08 * Math.sin(Math.PI * ph);
        }
        if (Math.floor(beat) !== dn.lastBeat) {
          dn.lastBeat = Math.floor(beat);
          if (!RM()) fx.burst(dice[k % 2].el, { type: 'note', count: 2, angle: -Math.PI / 2, spread: 1.4 });
        }
      }
    }
    const lf = loop.lift;
    if (lf) {
      const e = t - lf.t0;
      const top = dice[lf.top];
      const bot = dice[1 - lf.top];
      if (e > lf.dur) loop.lift = null;
      else if (d === top) {
        const up = e < 0.55 ? easeOut(e / 0.55) : e < lf.dur - 0.5 ? 1 : 1 - easeInOut((e - (lf.dur - 0.5)) / 0.5);
        p.x = lerp(top.rest.x, bot.rest.x, up);
        p.y = lerp(top.rest.y, bot.rest.y, up);
        p.z = up * (RM() ? 14 : 30 + 3 * Math.sin(e * 5));
        p.yaw = top.rest.yaw + e * 140;
        p.td = 0;
        p.sq = e < 0.12 ? -0.18 : 0;
      } else {
        p.sq = e > 0.05 && e < 0.4 ? 0.12 * Math.sin(((e - 0.05) / 0.35) * Math.PI) : 0;
        p.td = 0;
      }
    }
    return p;
  }

  function chargePose(d, dt) {
    const c = loop.charge;
    const k = c.k;
    const blend = easeOut(clamp(c.t / 0.22, 0, 1));
    const h = HAND[d.i];
    const amp = (RM() ? 0.3 : 1) * (0.6 + 2.6 * k);
    const sp = d.spin || (d.spin = { a: rand(-1, 1), b: rand(-1, 1), y: rand(-1, 1) });
    const rate = 60 + 520 * k;
    const p = d.pose;
    p.a += sp.a * rate * dt + rand(-1, 1) * amp * 2;
    p.b += sp.b * rate * dt + rand(-1, 1) * amp * 2;
    p.yaw += sp.y * rate * 0.5 * dt;
    p.x = lerp(d.rest.x, h.x, blend) + rand(-1, 1) * amp * 0.35;
    p.y = lerp(d.rest.y, h.y, blend) + rand(-1, 1) * amp * 0.25;
    p.z = lerp(0, h.z + 1.5 * Math.sin(c.t * (8 + 14 * k) + d.i * 2), blend) + Math.sin(Math.PI * clamp(c.t / 0.22, 0, 1)) * 6;
    p.td = 0;
    p.sq = 0.05 * Math.sin(c.t * (20 + 30 * k) + d.i);
    return p;
  }

  /* Throw playback: sim frames + orientation tracks + events + optional near-miss teeter on the later die. */
  function startThrow(sims, faces, opts) {
    return new Promise((resolve) => {
      const order = sims[0].end <= sims[1].end ? [0, 1] : [1, 0]; // order[0] stops first
      const tracks = dice.map((d, i) => ({ sim: sims[i], o: orientPlan(d, sims[i], faces[i]), evi: 0, sqAmp: 0, sqT: -9, done: false, teeter: null }));
      loop.thr = { t: 0, tracks, order, hitStop: 0, slow: 1, resolve, opts, firstDone: false, end: 0, walls: 0 };
      if (opts.teeter) {
        const tr = tracks[order[1]];
        const axis = tipAxis(tr.o.yawF, tr.o.aF, tr.o.bF, opts.teeter.face);
        if (axis) tr.teeter = { axis, dur: RM() ? 1.0 : 1.55, beats: 0 };
      }
      loop.thr.end = Math.max(...tracks.map((tr) => tr.sim.end + (tr.teeter ? tr.teeter.dur : 0))) + 0.32;
      loop.mode = 'throw';
      wake();
    });
  }

  const TEETER = [[0, 0], [0.32, 37], [0.55, 43], [0.72, 37.5], [0.92, 44], [1.08, 41.5], [1.28, 44.6], [1.36, 44.6], [1.5, 0]];
  function teeterAngle(e, dur) {
    const k = e * (1.5 / dur);
    for (let i = 1; i < TEETER.length; i++) {
      const [t1, v1] = TEETER[i];
      const [t0, v0] = TEETER[i - 1];
      if (k <= t1) {
        const u = (k - t0) / (t1 - t0);
        return lerp(v0, v1, i === TEETER.length - 1 ? u * u : easeInOut(u));
      }
    }
    return 0;
  }

  function throwPose(d, tr, t) {
    const { sim, o } = tr;
    const f = sim.f;
    const idx = Math.min(f.length - 1, Math.max(0, Math.round(t * 240)));
    const fr = f[idx];
    const dist = fr[4];
    const p = d.pose;
    p.x = fr[1];
    p.y = fr[2];
    p.z = fr[3];
    const pr = clamp(dist / sim.tumbleD, 0, 1);
    const q = sim.totalD - sim.tumbleD > 0.01 ? clamp((dist - sim.tumbleD) / (sim.totalD - sim.tumbleD), 0, 1) : 1;
    p.a = o.aF + o.offA * (1 - pr);
    p.b = o.bF + o.offB * (1 - pr);
    p.yaw = o.yawF + o.skidYaw * (1 - easeOut(q)) + o.offY * (1 - pr);
    p.tk = null;
    p.td = 0;
    if (t > sim.tumbleT) {
      const tau = t - sim.tumbleT;
      p.tk = o.wobAxis;
      p.td = o.wobAmp * Math.exp(-tau * 6.5) * Math.sin(tau * 27);
    }
    if (tr.teeter && t > sim.end) {
      p.tk = tr.teeter.axis;
      p.td = teeterAngle(t - sim.end, tr.teeter.dur);
    }
    const st = t - tr.sqT;
    p.sq = st >= 0 && st < 0.5 ? tr.sqAmp * Math.exp(-st * 11) * Math.cos(st * 30) : 0;
    return p;
  }

  // A dust ring that spreads across the floorboards where a die hits (drawn on the tilted floor plane).
  let rings = 0;
  function impact(d, scale = 1, color) {
    if (rings > 6 || (RM() && scale < 1.3)) return;
    const p = d.pose;
    const X = L.fw / 2 + p.x * L.u;
    const Y = p.y * L.u;
    const el = document.createElement('div');
    el.className = 'impact';
    if (color) el.style.borderColor = color;
    floor.appendChild(el);
    rings++;
    const a = el.animate([
      { transform: `translate(${X.toFixed(1)}px,${Y.toFixed(1)}px) scale(.55)`, opacity: 0.95 },
      { transform: `translate(${X.toFixed(1)}px,${Y.toFixed(1)}px) scale(${(1.4 + 1.1 * scale).toFixed(2)})`, opacity: 0 },
    ], { duration: 380 + 220 * scale, easing: 'cubic-bezier(.15,.75,.3,1)', fill: 'forwards' });
    const done = () => { el.remove(); rings--; };
    a.finished.then(done, done);
  }

  function fireEvents(d, tr, t) {
    const evs = tr.sim.ev;
    while (tr.evi < evs.length && evs[tr.evi].t <= t) {
      const e = evs[tr.evi++];
      const v = e.v;
      const thr = loop.thr;
      if (e.type === 'floor') {
        snd.tok(v / 230, 0.9 + d.i * 0.12);
        tr.sqT = e.t;
        tr.sqAmp = clamp(v / 420, 0.06, 0.32);
        if (v > 120) {
          impact(d, clamp(v / 260, 0.5, 1.2));
          fx.burst(d.el, { type: 'fluff', count: RM() ? 2 : 6, angle: -Math.PI / 2, spread: 2.2 });
          fx.burst(d.el, { type: 'smoke', count: 2, speed: [30, 90], scale: 0.4, life: [0.4, 0.7], colors: ['rgba(255,230,210,.3)'] });
        }
      } else if (e.type === 'wall') {
        thr.walls++;
        snd.wall(clamp(v / 200, 0.5, 1.2));
        tr.sqT = e.t;
        tr.sqAmp = clamp(v / 380, 0.1, 0.32);
        if (thr.walls === 1) {
          thr.hitStop = RM() ? 0 : 0.055;
          fx.shake(2 + 4 * thr.opts.power, 260);
          vib(18);
        }
        impact(d, 1.5, 'rgba(255, 209, 102, .95)');
        fx.burst(d.el, { type: 'fluff', count: RM() ? 3 : 10, angle: Math.PI / 2, spread: 2.6, speed: [150, 420] });
        fx.burst(d.el, { type: 'spark', count: 6 });
      } else if (e.type === 'side') {
        snd.tok(v / 300, 1.2);
      } else if (e.type === 'land') {
        snd.tok(0.45, 1.05);
        tr.sqT = e.t;
        tr.sqAmp = 0.14;
        const left = tr.sim.end - e.t;
        if (left > 0.12) snd.skid(left, clamp(v / 60, 0.3, 1.2));
      }
    }
  }

  function stepThrow(dtR) {
    const thr = loop.thr;
    let dt = dtR;
    if (thr.hitStop > 0) {
      thr.hitStop -= dtR;
      dt = 0;
    }
    const first = thr.tracks[thr.order[0]];
    const second = thr.tracks[thr.order[1]];
    // Drama: once the first die rests and the second still decides a fat bet, time slows and the heart pounds.
    if (thr.opts.drama && first.done && thr.t < second.sim.end) {
      dt *= RM() ? 0.7 : 0.42;
      if (!thr.dramaOn) {
        thr.dramaOn = true;
        thr.beat = 0;
        scene.classList.add('drama');
        sfx.heartbeat();
      }
      thr.beat += dtR;
      if (thr.beat > 0.62) { thr.beat = 0; sfx.heartbeat(); vib(12); }
    }
    thr.t += dt;
    const t = thr.t;
    thr.tracks.forEach((tr, i) => {
      const d = dice[i];
      fireEvents(d, tr, t);
      renderDie(d, throwPose(d, tr, t));
      if (!tr.done && t >= tr.sim.end) {
        tr.done = true;
        if (!tr.teeter) dieSettled(d, tr);
      }
      if (tr.teeter) {
        const e = t - tr.sim.end;
        if (e > 0) {
          const k = e * (1.5 / tr.teeter.dur);
          const marks = [0.3, 0.9];
          while (tr.teeter.beats < marks.length && k >= marks[tr.teeter.beats]) {
            tr.teeter.beats++;
            sfx.heartbeat();
            vib(15);
          }
          if (!tr.teeter.fell && k >= 1.5) {
            tr.teeter.fell = true;
            snd.wall(0.7);
            tr.sqT = t;
            tr.sqAmp = 0.22;
            fx.shake(4, 220);
            dieSettled(d, tr);
          }
        }
      }
      if (tr.done && i === thr.order[0] && !thr.firstDone) thr.firstDone = true;
      if (thr.dramaOn && second === tr) spotOn(d.el);
    });
    if (t >= thr.end) finishThrow();
  }
  function dieSettled(d, tr) {
    snd.settle(d.i ? 1.12 : 1);
    impact(d, 0.7, 'rgba(46, 230, 201, .9)');
    fx.burst(d.el, { type: 'star', count: RM() ? 2 : 5, speed: [60, 200] });
  }
  function finishThrow() {
    const thr = loop.thr;
    if (!thr) return;
    loop.thr = null;
    loop.mode = 'idle';
    scene.classList.remove('drama');
    thr.tracks.forEach((tr, i) => {
      const d = dice[i];
      d.rest = { x: tr.sim.x, y: tr.sim.y, z: 0, yaw: tr.o.yawF, a: tr.o.aF, b: tr.o.bF, face: tr.o.face };
      d.pose = { ...d.rest };
      d.spin = null;
    });
    thr.resolve();
  }

  function spotOn(el) {
    const r = el.getBoundingClientRect();
    const s = scene.getBoundingClientRect();
    scene.style.setProperty('--spot-x', `${(((r.left + r.width / 2 - s.left) / s.width) * 100).toFixed(1)}%`);
    scene.style.setProperty('--spot-y', `${(((r.top + r.height / 2 - s.top) / s.height) * 100).toFixed(1)}%`);
  }
  // The loop only runs while something moves (charge, throw, dance, lift, fidget, slump); idle sway is pure CSS.
  let lastNow = performance.now();
  let rafId = 0;
  let calm = 0;
  function wake() {
    calm = 0;
    if (rafId) return;
    lastNow = performance.now();
    rafId = requestAnimationFrame(frame);
  }
  function frame(now) {
    rafId = 0;
    let dtR = Math.min(0.1, Math.max(0, (now - lastNow) / 1000));
    lastNow = now;
    if (dbg.stage && loop.dance && (loop.clock - loop.dance.t0) / loop.dance.beat > 2.42) dtR = 0;
    loop.clock += dtR;
    try {
      if (loop.mode === 'throw' && loop.thr) stepThrow(dtR);
      else if (loop.mode === 'charge' && loop.charge) {
        stepCharge(dtR);
        if (loop.mode === 'charge' && loop.charge) dice.forEach((d) => renderDie(d, chargePose(d, dtR)));
      } else {
        dice.forEach((d) => {
          d.pose = idlePose(d, loop.clock);
          renderDie(d, d.pose);
        });
      }
      depthSort();
      if (loop.lift) spotOn(dice[loop.lift.top].el);
    } catch (err) {
      console.error(err);
      if (loop.thr) finishThrow();
    }
    const moving = loop.mode !== 'idle' || loop.dance || loop.lift || loop.fidget || loop.slump;
    calm = moving ? 0 : calm + 1;
    if (calm < 3) rafId = requestAnimationFrame(frame);
  }

  /* ---------- Copy ---------- */
  const QUIPS = {
    win: [

    snakeLose: ['Sssnake eyes. Winking at someone else.', 'Sssseductive, but not for you.'],
    boxWin: ['Boxcars! All aboard the love train.', 'Double sixes. Choo-choo, hot stuff.'],
    boxLose: ['Boxcars! The love train left without you.', 'Double sixes. Wrong platform, darling.'],

    boxNone: ['Boxcars! Choo-choo, the love train pulls in.', 'Double sixes. All aboard, hot stuff.'],
    lift: ['Three in a row! The whole lodge is watching.', 'Up, up and away, hot stuff.', 'Held it. Nailed it. Nobody saw that coming.'],
    streak: ['Two in a row! Hot streak, hot stuff.', 'You’re on fire. Somebody fetch an ice bucket.', 'Two for two. One more for THE LIFT!'],
    sevenWin: ['Lucky Seven! Seventh heaven, darling.', 'Seven came to dance. With you.'],
    sevenLose: ['Seven came to dance. You weren’t on its card.', 'Lucky for somebody. Not tonight.'],

    teaseHit: ['It flirted… then it delivered!', 'Played hard to get. Then didn’t.'],
  };
  const lastQuip = {};
  function quip(kind) {
    const list = QUIPS[kind];
    let q = C.rng.pick(list);
    if (list.length > 1 && q === lastQuip[kind]) q = list[(list.indexOf(q) + 1) % list.length];
    lastQuip[kind] = q;
    return q;
  }
  function callFor(a, b, anyWin) {
    const t = a + b;
    const plain = anyWin ? '' : 'sad';
    if (a === 1 && b === 1) return { text: 'SNAKE EYES!', cls: 'snake' };
    if (a === 6 && b === 6) return { text: 'BOXCARS!', cls: plain };
    if (t === 7) return anyWin ? { text: 'LUCKY SEVEN!', cls: 'seven' } : { text: 'SEVEN OUT!', cls: plain };
    if (a === b) return { text: `HARD ${t}!`, cls: plain };
    return { text: t < 7 ? 'UNDER 7' : 'OVER 7', cls: plain };
  }

  /* ---------- Test hooks: #force=1-1,3-4  #bets=under:25,snake:5  #streak=2  #stage=thumb, window.__dd ----------
     Only live under automation (navigator.webdriver, set by Playwright), so a visitor can't choose outcomes. */
  const DEBUG = navigator.webdriver === true;
  const dbg = { queue: [] };
  function parseHash() {
    const h = new URLSearchParams(DEBUG ? location.hash.slice(1) : '');
    const force = h.get('force');
    if (force) dbg.queue = force.split(',').map((s) => s.split('-').map(Number)).filter((p) => p.length === 2 && p.every((n) => n >= 1 && n <= 6));
    const bets = h.get('bets');
    if (bets) {
      const o = {};
      for (const part of bets.split(',')) {
        const [k, v] = part.split(':');
        if (KEYS.includes(k) && +v > 0) o[k] = Math.floor(+v);
      }
      if (sum(o) && sum(o) <= wallet.balance) state.bets = o;
    }
    const st = +h.get('streak');
    if (st === 1 || st === 2) state.lift = { streak: st, min: 50, sig: MATH.sig(state.bets) };
    return h;
  }

  /* ---------- Charging: hold ROLL to blow on the dice ---------- */
  const MIN_HOLD = 0.3;
  const FULL = 1.1;
  const AUTO = 3.6;
  function startCharge(src, pointerId) {
    if (state.phase !== 'idle') return false;
    if (!sum(state.bets)) {
      if (state.last) {
        if (!rebet(true)) return false;
      } else {
        nudge(board, 'Put a chip on a spot first, darling.');
        return false;
      }
    }
    const stake = sum(state.bets);
    if (!wallet.bet(stake)) {
      nudge(rollBtn, `That dance costs ${fmt(stake)}. You have ${fmt(wallet.balance)}.`);
      wobble(board);
      fx.shake(4, 220);
      return false;
    }
    state.phase = 'charging';
    state.round = { bets: { ...state.bets }, stake };
    state.last = { ...state.bets };
    C.store.set(LAST_KEY, state.last);
    clearResults();
    loop.charge = { t: 0, k: 0, src, pointerId, release: false, full: false, clackT: 0, puffT: 0.05 };
    loop.mode = 'charge';
    loop.fidget = null;
    loop.slump = null;
    wake();
    rollBtn.classList.add('held');
    rollBtn.classList.remove('idle-pulse');
    scene.classList.add('charging');
    loop.charge.breath = breath.start();
    sfx.pop(0.8);
    vib(10);
    updateUI();
    return true;
  }
  function releaseCharge() {
    if (state.phase === 'charging' && loop.charge) loop.charge.release = true;
  }
  function stepCharge(dt) {
    const c = loop.charge;
    c.t += dt;
    c.k = clamp((c.t - 0.05) / FULL, 0, 1);
    ringFill.style.strokeDashoffset = (100 - c.k * 100).toFixed(1);
    // The very first tap may still be waking the audio context: start the breath once it is up.
    if (!c.breath && c.t < 2) c.breath = breath.start();
    breath.set(c.k);
    c.clackT -= dt;
    if (c.clackT <= 0) {
      snd.clack();
      c.clackT = 0.24 - 0.17 * c.k + Math.random() * 0.04;
    }
    c.puffT -= dt;
    if (c.puffT <= 0 && c.t > 0.15) {
      c.puffT = 0.14;
      const r0 = dieEls[0].getBoundingClientRect();
      const r1 = dieEls[1].getBoundingClientRect();
      const at = { x: (r0.left + r0.right + r1.left + r1.right) / 4, y: Math.max(r0.bottom, r1.bottom) + 6 };
      fx.burst(at, { type: 'smoke', count: 1, angle: -Math.PI / 2, spread: 1.2, speed: [40, 120], jitter: 30, scale: 0.45, life: [0.5, 0.8], colors: ['rgba(255,225,240,.32)'] });
      if (c.k > 0.55 && Math.random() < 0.5) fx.burst(at, { type: 'heart', count: 1, angle: -Math.PI / 2, spread: 1, speed: [120, 260] });
    }
    if (!c.full && c.k >= 1) {
      c.full = true;
      sfx.chime(7);
      sfx.spark();
      fx.burst(rollBtn, { type: 'star', count: 14 });
      rollBtn.classList.add('ready');
      scene.classList.add('charged');
      vib(20);
    }
    if ((c.release && c.t >= MIN_HOLD) || c.t >= AUTO) doThrow();
  }

  function retOf(bets, a, b) {
    let r = 0;
    for (const s of MATH.SPOTS) if (bets[s.k] && s.hit(a, b)) r += (bets[s.k] * s.m10) / 10;
    return r;
  }
  // When the first die has landed and the second still decides a fat payout: slow motion, heartbeat, maybe a teeter.
  function dramaFor(bets, stake, a, b) {
    const rs = [0];
    for (let f = 1; f <= 6; f++) rs.push(retOf(bets, a, f));
    const max = Math.max(...rs.slice(1));
    const min = Math.min(...rs.slice(1));
    const out = { drama: false, teeter: null };
    if (max <= min) return out;
    const big = max >= 10 * stake;
    out.drama = max >= 5 * stake && (big || Math.random() < 0.55);
    if (big) {
      const faces = [1, 2, 3, 4, 5, 6].filter((f) => f !== b && f !== 7 - b);
      const pool = rs[b] < max ? faces.filter((f) => rs[f] === max) : faces.filter((f) => rs[f] < max);
      if (pool.length) out.teeter = { face: pool[Math.floor(Math.random() * pool.length)], hit: rs[b] >= max };
    }
    if (out.teeter) out.drama = true;
    return out;
  }

  function doThrow() {
    const c = loop.charge;
    if (!c || state.phase !== 'charging') return;
    loop.charge = null;
    state.phase = 'rolling';
    breath.stop();
    if (!document.hidden) {
      snd.puff();
      sfx.whoosh(0.28 + 0.2 * c.k, 0.2);
      vib(15);
    }
    rollBtn.classList.remove('held', 'ready');
    ringFill.style.strokeDashoffset = '100';
    scene.classList.remove('charging', 'charged');
    scene.classList.add('rolling');
    hintEl.textContent = '';
    const power = 0.45 + 0.55 * c.k;
    const forced = DEBUG ? dbg.queue.shift() : null;
    const r1 = forced ? forced[0] : rng.int(6) + 1;
    const r2 = forced ? forced[1] : rng.int(6) + 1;
    updateUI();
    playRound(r1, r2, power);
  }

  let partyToken = 0;
  async function playRound(r1, r2, power) {
    const R = state.round;
    const res = MATH.settle(R.bets, r1, r2, state.lift, () => rng.float());
    const pending = { res, R, paid: false, bonusPaid: false, recorded: false };
    state.lastRes = { faces: [r1, r2], bets: { ...R.bets }, stake: R.stake, ret: res.ret, pay: res.pay, bonus: res.bonus, bonusRaw: res.bonusRaw, won: res.won, lifted: res.lifted };
    state.pending = pending;
    const prevStreak = state.lift.streak;
    state.lift = res.liftAfter;
    try {
      const sims = planThrow(power);
      const firstIdx = sims[0].end <= sims[1].end ? 0 : 1;
      const faces = [];
      faces[firstIdx] = r1;
      faces[1 - firstIdx] = r2;
      const dr = dramaFor(R.bets, R.stake, r1, r2);
      await startThrow(sims, faces, { power, drama: dr.drama, teeter: dr.teeter });
      await reveal(r1, r2, res, R, dr, pending, prevStreak);
    } catch (err) {
      console.error(err);
    } finally {
      settleRound(pending);
    }
  }

  // Credits whatever the celebration has not paid yet, records the round once and unlocks the table.
  function settleRound(pending) {
    if (!pending || pending.settled) return;
    pending.settled = true;
    const { res, R } = pending;
    if (!pending.paid) { pending.paid = true; if (res.pay > 0) wallet.win(res.pay); }
    if (!pending.bonusPaid) { pending.bonusPaid = true; if (res.bonus > 0) wallet.win(res.bonus, 'bonus'); }
    if (!pending.recorded) {
      pending.recorded = true;
      C.record({ bet: R.stake, win: res.pay + res.bonus });
      state.rounds++;
    }
    if (state.pending === pending) state.pending = null;
    if (loop.thr) finishThrow();
    loop.charge = null;
    loop.mode = 'idle';
    state.phase = 'idle';
    state.bets = {};
    renderAllStacks();
    scene.classList.remove('rolling', 'charging', 'charged', 'drama', 'lifting');
    liftBanner.classList.remove('on');
    liftEl.classList.remove('full');
    updateUI();
    wake();
  }

  // Split the (whole-chip) payout across the winning spots for their gold pills.
  function payoutSplit(res, keys) {
    const out = {};
    let used = 0;
    for (const k of keys) { out[k] = Math.floor(res.wins[k] + 1e-9); used += out[k]; }
    const big = keys.reduce((m, k) => (res.wins[k] > (res.wins[m] || 0) ? k : m), keys[0]);
    if (big) out[big] += res.pay - used;
    return out;
  }
  // Squash/wobble via the Web Animations API, so they also play on elements whose own CSS animation is running.
  function jelly(el, k = 1) {
    if (!el || !el.animate) return;
    const a = 0.14 * k;
    el.animate([{ scale: '1 1' }, { scale: `${1 + a} ${1 - a}` }, { scale: `${1 - a * 0.6} ${1 + a * 0.6}` }, { scale: `${1 + a * 0.25} ${1 - a * 0.25}` }, { scale: '1 1' }], { duration: 520, easing: 'ease-out' });
  }
  function wobble(el) {
    if (!el || !el.animate) return;
    el.animate([{ rotate: '0deg' }, { rotate: '-9deg' }, { rotate: '7deg' }, { rotate: '-4deg' }, { rotate: '2deg' }, { rotate: '0deg' }], { duration: 520, easing: 'ease-in-out' });
  }
  function popEl(el, k = 1) {
    if (!el || !el.animate) return;
    el.animate([{ scale: 1 }, { scale: 1 + 0.25 * k }, { scale: 1 - 0.05 * k }, { scale: 1 }], { duration: 420, easing: 'cubic-bezier(.34,1.56,.64,1)' });
  }
  // The croupier rake: losing chips skid off to the left and spill.
  function sweepFx(keys) {
    keys.forEach((k, i) => {
      const st = spotEls[k].querySelector('.stack');
      st.classList.add('sweep');
      setTimeout(() => fx.burst(stakePoint(k), { type: 'chip', count: RM() ? 1 : 4, angle: Math.PI * 1.1, spread: 0.9, speed: [260, 560], gravity: 1300, size: [6, 9] }), 80 + i * 50);
    });
  }

  async function reveal(a, b, res, R, dr, pending, prevStreak) {
    const t = a + b;
    // If the round was settled early (page hidden for good, then restored), stop the show: money is already in.
    const gone = () => pending.settled;
    scene.classList.remove('rolling');
    scene.classList.add('showing');
    totalEl.textContent = t;
    totalEl.className = 'total';
    callEl.className = 'call';
    winEl.className = 'winline';
    void totalEl.offsetWidth;
    totalEl.classList.add('on');
    const call = callFor(a, b, res.pay > 0);
    callEl.textContent = call.text;
    callEl.className = `call ${call.cls} on`;
    sfx.thud(1.35);
    sfx.pop(res.pay > 0 ? 1.25 : 0.9);
    fx.shake(res.pay > 0 ? 4 : 3, 180);
    await C.sleep(RM() ? 120 : 230);
    if (gone()) return;

    const winKeys = KEYS.filter((k) => res.wins[k]);
    const loseKeys = KEYS.filter((k) => R.bets[k] && !res.wins[k]);
    const sevenWon = !!res.wins.seven;
    const snake = a === 1 && b === 1;
    const box = a === 6 && b === 6;
    if (t === 7 && sevenWon) snd.fanfare7();
    if (snake) snd.hiss();
    if (box) snd.whistle();
    if (loseKeys.length) {
      for (const k of loseKeys) spotEls[k].classList.add('lose');
      sweepFx(loseKeys);
      sfx.whoosh(0.22, 0.09);
      setTimeout(() => sfx.chips(3), 120);
    }

    let kind = null;
    if (snake) kind = res.wins.snake ? 'snakeWin' : R.bets.snake ? 'snakeLose' : 'snakeNone';
    else if (box) kind = res.wins.boxcars ? 'boxWin' : R.bets.boxcars ? 'boxLose' : 'boxNone';
    else if (t === 7) kind = sevenWon ? 'sevenWin' : R.bets.seven ? 'sevenLose' : null;
    // A teetering die gets a tease line, unless it paid a jackpot spot (then the jackpot's own pun wins).
    if (dr.teeter && !(dr.teeter.hit && kind && kind.endsWith('Win'))) kind = dr.teeter.hit ? 'teaseHit' : 'tease';

    if (!winKeys.length) {
      setHint(quip(kind || 'lose'), 'bad');
      sfx.lose();
      wobble(totalEl);
      loop.slump = { t0: loop.clock, dur: 0.7 };
      wake();
      vib(12);
      if (prevStreak > 0) {
        hearts.forEach((h) => wobble(h));
        sfx.boing(0.6);
      }
      paintLift(0);
      await C.sleep(RM() ? 250 : 520);
      return;
    }

    // Wins: spots light up one after another, the floor parties, the win rolls up, then the chips fly home.
    const split = payoutSplit(res, winKeys);
    const mult = res.pay / R.stake;
    const streakNow = res.won ? (res.lifted ? 3 : res.liftAfter.streak) : 0;
    winKeys.forEach((k, i) => {
      setTimeout(() => {
        if (gone()) return;
        const sp = spotEls[k];
        sp.classList.add('win');
        const w = document.createElement('span');
        w.className = 'won';
        w.textContent = '+0';
        sp.appendChild(w);
        fx.countUp(w, 0, split[k], { ms: RM() ? 120 : 360, sound: false, format: (v) => `+${fmt(v)}` });
        jelly(sp, 1);
        sfx.coin(1 + i * 0.18);
        fx.burst(sp, { type: 'star', count: 14, speed: [120, 380] });
        fx.burst(sp, { type: 'spark', count: 10 });
      }, i * 140);
    });
    if (res.won) {
      const tok = ++partyToken;
      scene.classList.add('party');
      haloEls.forEach((h) => h.classList.add('on'));
      const delay = sevenWon ? 1.05 : 0;
      setTimeout(() => {
        if (tok !== partyToken) return;
        // The riff climbs a whole tone per win in the streak.
        const len = snd.mambo(mult >= 5 ? 2 : 1, Math.max(0, streakNow - 1) * 2);
        loop.dance = { t0: loop.clock, beat: 0.28, beats: Math.round(len / 0.28), lastBeat: -1 };
        wake();
        if (dbg.stage) {
          setTimeout(() => {
            paintLift(2);
            dice.forEach((d) => fx.fountain(d.el, { type: 'note', rate: 3, ms: 60000, spread: 1.6, speed: [60, 160] }));
            dice.forEach((d) => fx.fountain(d.el, { type: 'heart', rate: 1.6, ms: 60000, spread: 1.2, speed: [160, 300] }));
          }, 900);
          return;
        }
        setTimeout(() => {
          if (tok !== partyToken) return;
          scene.classList.remove('party');
          haloEls.forEach((h) => h.classList.remove('on'));
        }, len * 1000 + 200);
      }, delay * 1000);
      const heat = mult + streakNow;
      fx.flash(mult >= 5 ? '#ffd166' : '#ff8fab', 240, clamp(0.18 + heat * 0.05, 0.22, 0.5));
      fx.shake(clamp(2 + mult + streakNow, 3, 12), 300 + mult * 30);
      vib(mult >= 5 ? [20, 30, 50] : 25);
      if (mult >= 5) fx.burst(totalEl, { type: 'confetti', count: 40 });
      fx.burst(totalEl, { type: 'heart', count: 6 + streakNow * 4, speed: [140, 360] });
      setHint(quip(kind || (streakNow === 2 && !res.lifted ? 'streak' : 'win')), 'good');
    } else {
      setHint(quip('part'));
    }
    // Roll the win up under the call, with ticks.
    winEl.textContent = '+0';
    winEl.className = `winline ${res.won ? '' : 'part'} on`;
    const rollUp = fx.countUp(winEl, 0, res.pay, { ms: RM() ? 250 : clamp(420 + mult * 80, 450, 1200), format: (v) => `+${fmt(v)}` });
    await Promise.all([rollUp, C.sleep(winKeys.length * 140 + (RM() ? 120 : 260))]);
    if (gone()) return;
    popEl(winEl, res.won ? 1 : 0.6);
    if (dbg.stage) return new Promise(() => {}); // staged thumbnail still: hold the party, never settle
    if (res.won) {
      fx.burst(winEl, { type: 'star', count: 18, speed: [140, 420] });
      sfx.chime(4 + Math.min(4, Math.round(mult)));
    }
    await C.sleep(RM() ? 80 : 180);
    if (gone()) return;

    if (mult >= 10) {
      const label = snake ? 'SNAKE EYES!' : box ? 'LOVE TRAIN!' : undefined;
      await C.bigWin(res.pay, R.stake, label ? { label } : {});
      if (gone()) return;
    }
    const count = clamp(Math.round(5 + mult * 1.6), 5, 26);
    await Promise.all(winKeys.map((k, i) => C.sleep(i * 90).then(() => fx.collect(spotEls[k].querySelector('.won') || spotEls[k], null, { count: Math.ceil(count / winKeys.length) + 2, type: 'coin' }))));
    if (!pending.paid) {
      pending.paid = true;
      wallet.win(res.pay);
    }
    sfx.cash();
    for (const k of winKeys) spotEls[k].querySelector('.stack').classList.add('sweep');
    if (gone()) return;

    if (res.won) await liftStep(res, pending);
    else if (prevStreak > 0) paintLift(0);
  }

  async function liftStep(res, pending) {
    const n = res.lifted ? 3 : res.liftAfter.streak;
    paintLift(n);
    const h = hearts[n - 1];
    if (h) {
      fx.anim(h, 'c-jelly');
      fx.burst(h, { type: 'heart', count: 8 + n * 4, speed: [120, 340] });
      sfx.chime(n * 2 + 2);
      sfx.kiss();
      vib(12 * n);
    }
    if (res.reset && n === 1) setHint('New moves, new streak. Rebet to keep it going.', 'good');
    if (!res.lifted) return;
    await doLift(res, pending);
  }

  async function doLift(res, pending) {
    liftEl.classList.add('full');
    await C.sleep(220);
    if (pending.settled) return;
    snd.lift();
    scene.classList.add('lifting');
    const top = dice[0].rest.y < dice[1].rest.y ? 0 : 1;
    loop.lift = { t0: loop.clock, dur: 2.7, top };
    wake();
    await C.sleep(850);
    if (pending.settled) return;
    fx.flash('#ffd1e6', 320, 0.5);
    fx.shake(10, 650);
    vib([30, 40, 90]);
    liftAmt.textContent = res.bonus > 0 ? '+0 bonus' : 'pure class';
    liftBanner.classList.add('on');
    setHint(quip('lift'), 'good');
    fx.shower('feather', 44);
    fx.shower('heart', 26);
    fx.burst(dice[top].el, { type: 'star', count: 30 });
    fx.burst(liftBanner, { type: 'confetti', count: 50 });
    if (res.bonus > 0) {
      await C.sleep(RM() ? 100 : 450);
      await fx.countUp(liftAmt, 0, res.bonus, { ms: RM() ? 200 : 700, format: (v) => `+${fmt(v)} bonus` });
      popEl(liftAmt);
      sfx.coin(1.4);
    }
    await C.sleep(RM() ? 700 : 900);
    if (pending.settled) return;
    if (res.bonus > 0) {
      await fx.collect(liftAmt, null, { count: 14, type: 'coin' });
      if (!pending.bonusPaid) {
        pending.bonusPaid = true;
        wallet.win(res.bonus, 'bonus');
      }
      sfx.cash();
    } else pending.bonusPaid = true;
    liftBanner.classList.remove('on');
    scene.classList.remove('lifting');
    liftEl.classList.remove('full');
    paintLift(0);
  }

  /* ---------- Input ---------- */
  rollBtn.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    if (state.phase !== 'idle') {
      if (state.phase !== 'charging') wobble(rollBtn);
      return;
    }
    if (startCharge('pointer', e.pointerId)) {
      try { rollBtn.setPointerCapture(e.pointerId); } catch { /* fine without capture */ }
    }
  });
  const pointerUp = (e) => {
    const c = loop.charge;
    if (c && c.src === 'pointer' && c.pointerId === e.pointerId) releaseCharge();
  };
  rollBtn.addEventListener('pointerup', pointerUp);
  rollBtn.addEventListener('pointercancel', pointerUp);
  rollBtn.addEventListener('lostpointercapture', pointerUp);
  rollBtn.addEventListener('contextmenu', (e) => e.preventDefault());
  // Keyboard or assistive-tech activation (no pointer): a quick tap-throw.
  rollBtn.addEventListener('click', (e) => {
    if (e.detail !== 0 || state.phase !== 'idle') return;
    if (startCharge('click')) releaseCharge();
  });

  const dialogOpen = () => !!document.querySelector('dialog[open]') || !!document.querySelector('.cbig');
  addEventListener('keydown', (e) => {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (dialogOpen() || e.target.closest?.('input, textarea, select')) return;
    e.preventDefault();
    if (e.repeat) return;
    if (state.phase === 'idle') startCharge('key');
  });
  addEventListener('keyup', (e) => {
    if (e.key !== ' ' && e.code !== 'Space') return;
    if (e.target.closest?.('input, textarea, select')) return;
    e.preventDefault();
    if (loop.charge && loop.charge.src === 'key') releaseCharge();
  });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.repeat || dialogOpen()) return;
    if (e.target !== document.body && e.target !== document.documentElement) return;
    e.preventDefault();
    if (state.phase === 'idle' && startCharge('key-enter')) releaseCharge();
  });
  // Losing the window mid-blow throws the dice instead of leaving them hanging. A hidden tab throws at once (rAF is
  // paused), so the outcome exists and a later pagehide can settle it.
  addEventListener('blur', releaseCharge);
  document.addEventListener('visibilitychange', () => { if (document.hidden && state.phase === 'charging') doThrow(); });
  // Leaving mid-round still pays what the dice already decided; a stake is never charged without a roll.
  addEventListener('pagehide', () => {
    if (state.phase === 'charging') doThrow();
    if (state.pending) settleRound(state.pending);
  });

  // Tap a spot to add the selected chip; right-click or long-press it to take its chips back.
  for (const k of KEYS) {
    const sp = spotEls[k];
    let lp = 0;
    let lpDone = false;
    let touchy = false;
    sp.addEventListener('pointerdown', (e) => {
      touchy = e.pointerType !== 'mouse';
      lpDone = false;
      clearTimeout(lp);
      if (!touchy) return;
      lp = setTimeout(() => {
        if (busy() || !state.bets[k]) return;
        lpDone = true;
        removeBet(k);
        vib(20);
      }, 520);
    });
    for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) sp.addEventListener(ev, () => clearTimeout(lp));
    sp.addEventListener('click', () => {
      if (lpDone) { lpDone = false; return; }
      if (busy()) { wobble(sp); return; }
      placeChip(k);
    });
    sp.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearTimeout(lp);
      if (busy() || !state.bets[k]) return;
      removeBet(k);
      if (touchy) lpDone = true;
    });
  }
  for (const v of CHIPS) chipEls[v].addEventListener('click', () => selectChip(v));
  clearBtn.addEventListener('click', () => clearBets(false));
  rebetBtn.addEventListener('click', () => {
    if (rebet(false)) setHint('Same moves, new dance. Hold ROLL!');
  });

  $('#help').addEventListener('click', () => {
    sfx.tap();
    C.dialog({
      title: 'Dirty Dicing',
      button: 'Let’s dance',
      html: `
        <p>Put chips on any spots, then <b>hold ROLL</b> to blow on the dice and let go to throw (or hold <b>Space</b>). With an empty board, ROLL repeats your last bets. Right-click or long-press a spot to take its chips back.</p>
        <table>
          <tr><th>Spot</th><th>Wins on</th><th>Pays</th></tr>
          <tr><td>Under 7</td><td>total 2 to 6</td><td>2.3×</td></tr>
          <tr><td>Lucky 7</td><td>total 7</td><td>5.8×</td></tr>
          <tr><td>Over 7</td><td>total 8 to 12</td><td>2.3×</td></tr>
          <tr><td>Any doubles</td><td>a matching pair</td><td>5.8×</td></tr>
          <tr><td>Snake eyes</td><td>1 and 1</td><td>34×</td></tr>
          <tr><td>Boxcars</td><td>6 and 6</td><td>34×</td></tr>
        </table>
        <p>Pays are the total return, your stake included. Every spot is settled on its own, so snake eyes also pays Under 7 and Doubles. Half chips are settled by a fair coin flip.</p>
        <p><b>THE LIFT</b>: win three rolls in a row with the same bets (a roll wins when it returns more than you staked; ROLL on an empty board repeats your bets) and the house adds a bonus of 25% of the smallest of those three wins. Changing your bets starts a new streak. Then the meter starts again.</p>
        <p><b>RTP</b> per spot before THE LIFT: Under/Over 95.8%, Lucky 7 and Doubles 96.7%, Snake eyes and Boxcars 94.4%. Including THE LIFT (exact, confirmed by 4 million simulated rolls per strategy): Snake eyes/Boxcars 94.5%, Lucky 7/Doubles 97.1%, Under/Over 97.3%, and the best possible mix (Lucky 7 + Doubles, equal chips) 97.9%.</p>
        <p style="font-size:13px;opacity:.8">Parody. Fake chips, no real money.</p>`,
    });
  });

  /* ---------- Boot ---------- */
  const hash = parseHash();
  layout();
  renderAllStacks();
  selectChip(state.chip, false);
  updateUI();
  if (state.lift.streak) paintLift();
  if (state.last && !sum(state.bets)) setHint('Welcome back, hot stuff. ROLL repeats your last dance.');
  if ('ResizeObserver' in window) new ResizeObserver(() => layout()).observe(scene);
  else addEventListener('resize', layout);
  wake();
  scheduleFidget();

  if (DEBUG) window.__dd = {
    force(a, b) { dbg.queue.push([a, b]); },
    state: () => ({ phase: state.phase, bets: { ...state.bets }, lift: { ...state.lift }, balance: wallet.balance, rounds: state.rounds, last: state.last && { ...state.last } }),
    setBets(o) { if (!busy()) { state.bets = sanitize(o) || {}; renderAllStacks(); updateUI(); } },
    roll(hold = 0.4) {
      if (!startCharge('test')) return false;
      setTimeout(releaseCharge, hold * 1000);
      return true;
    },
    faceUp: () => dice.map((d) => faceUp(d.rest.yaw, d.rest.a, d.rest.b)),
    loopInfo: () => ({ mode: loop.mode, thr: loop.thr && { t: loop.thr.t, end: loop.thr.end, ends: loop.thr.tracks.map((tr) => [tr.sim.end, tr.teeter && tr.teeter.dur, tr.done]), drama: loop.thr.opts.drama } }),
    math: MATH,
    lastRes: () => state.lastRes,
  };

  // #stage=thumb: a staged Lucky Seven so the gallery thumbnail shows the floor mid-party.
  // It freezes the dance mid-hop and never pays out (automation only), so any capture after ~6 s gets the same still.
  if (DEBUG && hash.get('stage') === 'thumb') {
    dbg.stage = true;
    state.bets = { seven: 100 };
    state.lift = { streak: 1, min: 480, sig: MATH.sig(state.bets) };
    renderAllStacks();
    updateUI();
    dbg.queue = [[3, 4]];
    setTimeout(() => window.__dd.roll(0.9), 250);
  }
})();
</script>
</body>
</html>
