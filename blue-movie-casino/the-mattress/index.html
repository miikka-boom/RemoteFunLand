<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Mattress · Blue Movie Casino</title>
<meta name="description" content="A Matrix-parody plinko game: take the blue, purple or red pill and drop it through a field of boinging bedsprings onto a quilted mattress.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;600&family=Bungee&family=Monoton&family=Shrikhand&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="../shared/casino.css">
<style>
  :root {
    --accent: #4dff9a;
    --accent-2: #ff4fa8;
    --mx: #3dff86;
    --mx-hi: #b9ffd3;
    --pinky: #ff4fa8;
    --p-blue: #3b8cff;
    --p-purple: #b45cff;
    --p-red: #ff3347;
    --f-mono: "Share Tech Mono", ui-monospace, "DejaVu Sans Mono", Menlo, monospace;
  }
  body.mx {
    background: radial-gradient(130% 80% at 50% 0%, #072613 0%, #020c06 55%, #010402 100%) fixed #010402;
    overflow-x: hidden;
  }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .55; transition: opacity .4s, filter .4s }
  body.intro-on #rain { z-index: 9650; opacity: .8 }
  body.intro-on::before { content: ""; position: fixed; inset: 0; z-index: 9640; background: #000 }
  body.bt-on #rain { opacity: .9; filter: saturate(1.5) brightness(1.2) }

  .shake-clip { position: relative; z-index: 1; overflow: hidden; overflow: clip }
  .mx-main {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    height: calc(100vh - var(--bar-h) - env(safe-area-inset-top, 0px));
    height: calc(100dvh - var(--bar-h) - env(safe-area-inset-top, 0px));
    min-height: 580px;
    overflow-x: clip;
    padding: 6px max(10px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left, 0px));
  }

  /* ---------- Logo ---------- */
  .logo { display: flex; align-items: center; gap: 10px; min-width: 0 }
  .logo-text { flex: 1 1 auto; min-width: 0 }
  .logo h1 {
    margin: 0;
    font: 400 clamp(23px, 7vw, 30px)/1 var(--f-mono);
    letter-spacing: .14em;
    white-space: nowrap;
    color: #a6ffc9;
    text-shadow: 0 0 8px rgba(61, 255, 134, .85), 0 0 24px rgba(61, 255, 134, .4), 2px 0 0 rgba(255, 79, 168, .5), -2px 0 0 rgba(62, 240, 255, .3);
  }
  .logo h1 em { font-style: normal; color: #ff8cc8; text-shadow: 0 0 10px rgba(255, 79, 168, .95), 0 0 26px rgba(255, 79, 168, .45), -2px 0 0 rgba(61, 255, 134, .45) }
  .logo-tag {
    margin: 3px 0 0;
    transform-origin: 0 50%;
    min-height: 1.3em;
    font: 400 13px/1.3 var(--f-retro);
    color: #ff9fd2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color .2s;
  }
  .logo-tag.quip-good { color: #fff3b0; text-shadow: 0 0 12px rgba(255, 207, 74, .6) }
  .logo-tag.tag-in { animation: tag-in .42s var(--ease-back) }
  @keyframes tag-in { from { opacity: 0; translate: 0 9px; letter-spacing: .12em } to { opacity: 1; translate: 0 0 } }
  .logo-tag.quip-bad { color: #c9b6ff }
  .logo-bunny { display: none; width: 56px; height: 56px; flex: none }
  @keyframes bunny-idle { 0%, 70%, 100% { translate: 0 0; scale: 1 1 } 76% { scale: 1.12 .86 } 84% { translate: 0 -12px; scale: .94 1.08 } 92% { translate: 0 0; scale: 1.06 .94 } }
  .help { flex: none; font: 800 22px/1 var(--f-cond) }

  /* ---------- Board ---------- */
  .board-wrap { position: relative; flex: 1 1 auto; min-height: 280px; overflow: hidden }
  .board-wrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block }
  .hud {
    position: absolute;
    left: 8px;
    top: 8px;
    z-index: 2;
    display: grid;
    grid-template-columns: auto auto;
    gap: 3px 8px;
    align-items: baseline;
    padding: 6px 10px;
    border-radius: 10px;
    background: rgba(2, 16, 8, .66);
    box-shadow: inset 0 0 0 1px rgba(77, 255, 154, .28), 0 4px 14px rgba(0, 0, 0, .35);
    font: 400 10.5px/1.1 var(--f-mono);
    letter-spacing: .08em;
    color: var(--mx-hi);
    pointer-events: none;
  }
  .hud b { font: 800 16px/1 var(--f-cond); letter-spacing: .02em; color: #fff; font-variant-numeric: tabular-nums; text-align: right }
  .hud b.pos { color: #8dffbf }
  .hud b.neg { color: #ffb3c9 }
  .recent {
    position: absolute;
    right: 8px;
    top: 8px;
    z-index: 2;
    margin: 0;
    padding: 0;
    list-style: none;
    display: grid;
    gap: 4px;
    justify-items: end;
    pointer-events: none;
  }
  .recent li {
    min-width: 46px;
    padding: 4px 7px 3px;
    border-radius: 999px;
    background: linear-gradient(180deg, var(--hi), var(--c));
    color: var(--t);
    font: 800 13px/1 var(--f-cond);
    letter-spacing: .02em;
    text-align: center;
    font-variant-numeric: tabular-nums;
    box-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .35) inset;
  }
  .recent li:first-child { box-shadow: 0 2px 0 rgba(0, 0, 0, .45), 0 0 0 1.5px #fff inset, 0 0 14px var(--c) }
  .recent li:nth-child(n+7) { display: none }
  .bt-fx {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
    background: radial-gradient(ellipse at 50% 60%, transparent 38%, rgba(0, 22, 9, .78) 100%);
  }
  .board-wrap.bt .bt-fx { opacity: 1 }
  /* near miss: a red heartbeat vignette while a pill could still reach a 10x+ pillow */
  .board-wrap.tense:not(.bt) .bt-fx { opacity: 1; background: radial-gradient(ellipse at 50% 70%, transparent 42%, rgba(70, 0, 18, .62) 100%); animation: tense-beat .62s ease-in-out infinite }
  @keyframes tense-beat { 0%, 100% { filter: brightness(1) } 18% { filter: brightness(1.9) } 34% { filter: brightness(1.15) } 50% { filter: brightness(1.6) } }
  .bt-banner {
    position: absolute;
    left: 50%;
    top: 16%;
    z-index: 3;
    translate: -50% 0;
    font: 400 clamp(22px, 6.5vw, 44px)/1 var(--f-mono);
    letter-spacing: .28em;
    white-space: nowrap;
    color: #e3ffee;
    text-shadow: 3px 0 0 rgba(255, 79, 168, .85), -3px 0 0 rgba(61, 255, 134, .85), 0 0 22px rgba(61, 255, 134, .9);
    opacity: 0;
    scale: 1.8;
    pointer-events: none;
    transition: opacity .18s, scale .4s var(--ease-back);
  }
  .bt-banner small { display: block; margin-top: 8px; font: 400 .42em/1 var(--f-retro); letter-spacing: .06em; color: #ffc2e2; text-align: center; text-shadow: 0 2px 0 rgba(0, 0, 0, .5), 0 0 14px rgba(255, 79, 168, .9) }
  .board-wrap.bt .bt-banner { opacity: 1; scale: 1; animation: bt-flick .14s steps(2) infinite }
  @keyframes bt-flick { 50% { translate: calc(-50% + 1px) 0; filter: brightness(1.3) } }

  /* ---------- Controls ---------- */
  .controls { display: grid; gap: 8px; padding: 10px; background: linear-gradient(180deg, rgba(20, 30, 24, .88), rgba(10, 16, 12, .92)); box-shadow: 0 0 0 1px rgba(77, 255, 154, .16), 0 14px 40px rgba(0, 0, 0, .5) }
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
  .pillbtn {
    --pc: var(--p-blue);
    position: relative;
    cursor: pointer;
    display: grid;
    grid-template-columns: auto 1fr;
    grid-template-rows: auto auto;
    column-gap: 8px;
    row-gap: 2px;
    align-items: center;
    min-height: 50px;
    padding: 6px 10px 6px 8px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255, 255, 255, .08), rgba(0, 0, 0, .28));
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--pc) 45%, transparent), 0 4px 0 rgba(0, 0, 0, .55);
    text-align: left;
    transition: translate .2s var(--ease-back), box-shadow .2s, background .2s, opacity .2s;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .pillbtn[data-risk="purple"] { --pc: var(--p-purple) }
  .pillbtn[data-risk="red"] { --pc: var(--p-red) }
  .pillbtn[aria-checked="true"] {
    translate: 0 -3px;
    background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 55%, #fff 4%), color-mix(in srgb, var(--pc) 28%, #000 62%));
    box-shadow: inset 0 0 0 2px var(--pc), inset 0 1px 0 rgba(255, 255, 255, .5), 0 0 24px color-mix(in srgb, var(--pc) 65%, transparent), 0 7px 0 rgba(0, 0, 0, .55);
  }
  .pillbtn[aria-disabled="true"]:not([aria-checked="true"]) { opacity: .45 }
  .pillbtn:active { translate: 0 2px }
  .pill-ico {
    grid-row: 1 / 3;
    width: 30px;
    height: 14px;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--pc) 0 50%, #f6f1ff 50%);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .22), inset 0 2px 0 rgba(255, 255, 255, .55), 0 0 0 1px rgba(0, 0, 0, .45), 0 0 12px color-mix(in srgb, var(--pc) 75%, transparent);
    rotate: -28deg;
  }
  .pillbtn[aria-checked="true"] .pill-ico { animation: pill-bob 1.6s ease-in-out infinite }
  @keyframes pill-bob { 50% { rotate: -14deg; translate: 0 -2px } }
  .pb-name { font: 800 16px/1 var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: #fff }
  .pb-sub { font: 700 10.5px/1 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; color: rgba(230, 220, 245, .72) }

  .row2 { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: end }
  .grp { display: grid; gap: 4px; min-width: 0 }
  .grp .clabel { font-size: 10.5px; padding-left: 4px }
  .seg { display: inline-flex; gap: 3px; padding: 3px; border-radius: 14px; background: rgba(0, 0, 0, .4); box-shadow: inset 0 0 0 1px var(--rule) }
  .seg button {
    cursor: pointer;
    min-width: 44px;
    min-height: 44px;
    border: 0;
    border-radius: 11px;
    background: transparent;
    color: var(--ink-soft);
    font: 800 19px/1 var(--f-cond);
    transition: background .15s, color .15s, scale .2s var(--ease-back);
    touch-action: manipulation;
  }
  .seg button[aria-checked="true"] { background: linear-gradient(180deg, #9dffc8, var(--mx)); color: #032a14; box-shadow: 0 0 16px rgba(61, 255, 134, .55), inset 0 1px 0 rgba(255, 255, 255, .6) }
  .seg[aria-disabled="true"] button:not([aria-checked="true"]) { opacity: .4 }
  .stepper { display: flex; align-items: center; justify-content: space-between; gap: 4px; padding: 3px; border-radius: 14px; background: rgba(0, 0, 0, .4); box-shadow: inset 0 0 0 1px var(--rule) }
  .stepper .cbtn { width: 44px; min-height: 44px; padding: 0; font-size: 24px; border-radius: 11px; box-shadow: 0 3px 0 var(--b3), inset 0 1px 0 rgba(255, 255, 255, .3) }
  .stepper output { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-width: 0; flex: 1; font: 800 22px/1 var(--f-cond); color: var(--gold); font-variant-numeric: tabular-nums }
  .stepper .cchip-icon { --chip: #2f7bff }

  .row3 { display: grid; grid-template-columns: 1fr 1.9fr 1fr; gap: 8px; align-items: stretch }
  .auto { flex-direction: column; gap: 1px; min-height: 58px; padding: 6px 4px; font-size: 13px; line-height: 1 }
  .auto b { font: 800 21px/1 var(--f-cond); letter-spacing: .02em }
  .auto.on { --b1: #ffe58a; --b2: var(--gold); --b3: #9a6500; --bt: #2b1600; text-shadow: none }
  .auto.on::after, .drop::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; box-shadow: 0 0 22px 2px rgba(255, 207, 74, .75); animation: glow-pulse .8s ease-in-out infinite }
  .drop::after { box-shadow: 0 0 30px 4px rgba(255, 61, 154, .6); animation-duration: 2.4s }
  @keyframes glow-pulse { 50% { opacity: 1 } }
  .drop { min-height: 58px; padding: 8px 10px; font-size: 24px; letter-spacing: .1em }
  .drop .di { width: 26px; height: 12px; border-radius: 999px; background: linear-gradient(90deg, #fff 0 50%, rgba(255, 255, 255, .35) 50%); box-shadow: 0 0 0 1px rgba(0, 0, 0, .3); rotate: -30deg; flex: none }
  .drop kbd { font: 400 11px/1 var(--f-mono); padding: 3px 5px; border-radius: 5px; border: 1px solid rgba(255, 255, 255, .45); opacity: .8; letter-spacing: .04em }
  @media (pointer: coarse) { .drop kbd { display: none } }
  .fine { margin: 0; text-align: center; font: 700 10.5px/1.2 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: rgba(196, 176, 216, .55) }
  /* the shared mute button is 36px; give it a 44px touch target without changing its look */
  .cbar-mute { position: relative }
  .cbar-mute::after { content: ""; position: absolute; inset: -4px; border-radius: 50% }
  .pb-sub { white-space: nowrap }
  @media (max-width: 380px) {
    .pillbtn { column-gap: 6px; padding: 6px 6px 6px 6px }
    .pill-ico { width: 24px; height: 11px }
    .pb-name { font-size: 15px }
    .pb-sub { letter-spacing: .05em }
  }

  /* ---------- Desktop ---------- */
  @media (min-width: 900px) and (min-height: 600px) {
    .mx-main {
      display: grid;
      grid-template-columns: minmax(310px, 360px) 1fr;
      grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "logo board" "controls board";
      gap: 14px 22px;
      padding: 14px 24px 18px;
    }
    .logo { grid-area: logo; display: grid; grid-template-columns: 56px 1fr 44px; grid-template-areas: "bunny . help" "text text text"; align-items: center; gap: 4px 10px }
    .logo-bunny { display: block; grid-area: bunny; animation: bunny-idle 3.2s ease-in-out infinite; transform-origin: 50% 100% }
    .help { grid-area: help }
    .logo-text { grid-area: text }
    .board-wrap { grid-area: board }
    .controls { grid-area: controls; align-self: start; gap: 12px; padding: 16px; min-height: 0; max-height: 100%; overflow-y: auto }
    .logo h1 { font-size: 34px; letter-spacing: .12em }
    .logo-tag { font-size: 17px; white-space: normal; height: 2.6em; min-height: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical }
    .pills { grid-template-columns: 1fr; gap: 10px }
    .pillbtn { min-height: 56px; padding-left: 14px; column-gap: 14px }
    .pill-ico { width: 36px; height: 17px }
    .pb-name { font-size: 19px }
    .pb-sub { font-size: 12px }
    .row2 { grid-template-columns: 1fr; gap: 12px }
    .seg { display: flex }
    .seg button { flex: 1 }
    .row3 { grid-template-columns: 1fr 2fr 1fr }
    .row3 .drop { min-height: 66px; font-size: 27px }
    .recent li { min-width: 58px; font-size: 15px; padding: 5px 9px 4px }
    .recent li:nth-child(n+7) { display: block }
    .recent li:nth-child(n+10) { display: none }
    .hud { font-size: 12px; padding: 8px 12px }
    .hud b { font-size: 19px }
  }

  /* ---------- Intro ---------- */
  .intro { position: fixed; inset: 0; z-index: 9700; display: grid; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 50%, rgba(0, 0, 0, .94) 30%, rgba(0, 0, 0, .7) 100%); color: var(--mx); cursor: pointer; transition: opacity .45s }
  .intro.out { opacity: 0; pointer-events: none }
  .intro-term { padding: 24px; max-width: 92vw; font: 400 clamp(21px, 5.6vw, 36px)/1.3 var(--f-mono); text-shadow: 0 0 10px rgba(61, 255, 134, .75); }
  .intro[data-line="2"] .intro-term { color: #ff8cc8; text-shadow: 0 0 12px rgba(255, 79, 168, .8) }
  .intro-cursor { display: inline-block; width: .55em; height: 1.05em; margin-left: 3px; vertical-align: -.16em; background: currentColor; box-shadow: 0 0 10px currentColor; animation: blink 1s steps(1) infinite }
  @keyframes blink { 50% { opacity: 0 } }
  .intro-skip { position: absolute; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); translate: -50% 0; min-height: 44px; padding: 10px 18px; border: 1px solid rgba(61, 255, 134, .4); border-radius: 999px; background: none; color: rgba(140, 255, 190, .8); font: 400 13px/1 var(--f-mono); letter-spacing: .14em; cursor: pointer }
  .intro-bunny { position: absolute; left: -100px; bottom: 20%; width: 80px; height: 80px; pointer-events: none }
  .intro.bunny .intro-bunny { animation: bunny-run 1.6s linear forwards }
  .intro.bunny .intro-bunny svg { animation: hop .27s ease-in-out infinite alternate }
  @keyframes bunny-run { to { left: calc(100% + 100px) } }
  @keyframes hop { from { translate: 0 0; rotate: -4deg } to { translate: 0 -34px; rotate: 6deg } }

  /* ---------- Help ---------- */
  .mx-help h3 { margin: 6px 0 0; font: 800 14px/1.2 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--mx) }
  .mx-help b { color: var(--ink) }
  .mx-help .tbl-wrap { overflow-x: auto }
  .mx-help table { font-size: 14px }
  .mx-help td.num, .mx-help th.num { text-align: right }
  .mx-help .fine-print { font-size: 12px; line-height: 1.35; color: rgba(196, 176, 216, .7) }
  .mx-help p { line-height: 1.4 }
  .mx-help table td, .mx-help table th { padding: 4px 4px }
  .mx-help table.rtp small { display: block; font-size: 11px; font-weight: 500; color: rgba(196, 176, 216, .75) }

  @media (prefers-reduced-motion: reduce) {
    .drop::after, .auto.on::after, .pillbtn[aria-checked="true"] .pill-ico, .board-wrap.bt .bt-banner, .logo-bunny, .board-wrap.tense .bt-fx { animation: none }
  }
</style>
<body class="mx">
<canvas id="rain" aria-hidden="true"></canvas>

<div class="shake-clip">
<main class="mx-main" data-shake>
  <header class="logo">
    <svg class="logo-bunny" viewBox="0 0 64 64" aria-hidden="true"><use href="#bunny"/></svg>
    <div class="logo-text">
      <h1 aria-label="The Mattress"><span data-txt="THE ">THE </span><span data-txt="MAT">MAT</span><em data-txt="TRESS">TRESS</em></h1>
      <p class="logo-tag" id="tag" aria-live="polite">There is no spoon. Only spooning.</p>
    </div>
    <button class="cbtn cbtn--ghost cbtn--round help" id="help" type="button" aria-label="Rules, paytable and odds">?</button>
  </header>

  <div class="board-wrap" id="boardWrap">
    <canvas id="board" role="img" aria-label="A quilted mattress full of bedsprings. Pills bounce off the springs and land on pillows that pay a multiplier."></canvas>
    <div class="bt-fx" aria-hidden="true"></div>
    <div class="hud" id="hud" aria-live="off">
      <span>IN BED</span><b id="inflight">0</b>
      <span>NET</span><b id="net">0</b>
    </div>
    <ol class="recent" id="recent" aria-label="Recent results"></ol>
    <div class="bt-banner" aria-hidden="true">BULLET TIME<small>whoa.</small></div>
  </div>

  <section class="controls cpanel" aria-label="Controls">
    <div class="pills" role="radiogroup" aria-label="Pick your pill (risk)">
      <button class="pillbtn" type="button" role="radio" data-risk="blue" title="Blue pill: stay in bed. Gentle bounces, small steady wins."><i class="pill-ico" aria-hidden="true"></i><span class="pb-name">Blue</span><span class="pb-sub">Low risk</span></button>
      <button class="pillbtn" type="button" role="radio" data-risk="purple" title="Purple pill: a little tingly. Medium risk."><i class="pill-ico" aria-hidden="true"></i><span class="pb-name">Purple</span><span class="pb-sub">Mid risk</span></button>
      <button class="pillbtn" type="button" role="radio" data-risk="red" title="Red pill: see how deep the mattress goes. High risk, huge edges."><i class="pill-ico" aria-hidden="true"></i><span class="pb-name">Red</span><span class="pb-sub">High risk</span></button>
    </div>
    <div class="row2">
      <div class="grp">
        <span class="clabel" id="rowsLabel">Rows of springs</span>
        <div class="seg" id="rowsSeg" role="radiogroup" aria-labelledby="rowsLabel">
          <button type="button" role="radio" data-rows="8">8</button>
          <button type="button" role="radio" data-rows="12">12</button>
          <button type="button" role="radio" data-rows="16">16</button>
        </div>
      </div>
      <div class="grp" id="stakeGrp">
        <span class="clabel" id="stakeLabel">Stake per pill</span>
        <div class="stepper" role="group" aria-labelledby="stakeLabel">
          <button class="cbtn cbtn--ghost" id="stakeDown" type="button" aria-label="Lower stake">&minus;</button>
          <output id="stakeOut" aria-live="polite"><i class="cchip-icon" aria-hidden="true"></i><span>10</span></output>
          <button class="cbtn cbtn--ghost" id="stakeUp" type="button" aria-label="Raise stake">+</button>
        </div>
      </div>
    </div>
    <div class="row3">
      <button class="cbtn cbtn--ghost auto" type="button" data-auto="10"><span>Auto</span><b>×10</b></button>
      <button class="cbtn drop" id="drop" type="button"><i class="di" aria-hidden="true"></i>Drop <kbd>Space</kbd></button>
      <button class="cbtn cbtn--ghost auto" type="button" data-auto="50"><span>Auto</span><b>×50</b></button>
    </div>
    <p class="fine">Parody. Fake chips, no real money.</p>
  </section>
</main>
</div>

<div class="intro" id="intro" hidden>
  <div class="intro-term"><span id="introText"></span><span class="intro-cursor"></span></div>
