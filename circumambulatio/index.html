<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circumambulatio</title>
<meta name="description" content="A 75-second tangram title sequence at 128 BPM. Seven pieces slam through shadow, anima, the night sea and the Self, and lock as a square inside a circle.">
<meta name="theme-color" content="#07060a">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden }
body {
  color: #f4efe4;
  font: 16px/1.3 Impact, "Arial Black", "Haettenschweiler", sans-serif;
  -webkit-font-smoothing: antialiased;
  touch-action: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
.back {
  position: fixed; z-index: 5;
  top: max(10px, env(safe-area-inset-top));
  left: max(12px, env(safe-area-inset-left));
  color: rgba(244, 239, 228, .72);
  font: 500 12px/1.2 ui-monospace, Menlo, Consolas, monospace;
  letter-spacing: .08em;
  text-decoration: none;
  touch-action: manipulation;
}
.back:focus-visible, button:focus-visible { outline: 2px solid #f4efe4; outline-offset: 3px }
#gate {
  position: fixed; inset: 0; z-index: 4;
  display: grid; align-content: end; justify-items: center;
  padding: 0 20px max(28px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(7,6,10,.72), rgba(7,6,10,0) 42%);
  transition: opacity .12s linear;
}
#gate.gone { opacity: 0; pointer-events: none }
button {
  min-height: 52px; min-width: 168px;
  padding: 12px 28px;
  border: 0; cursor: pointer;
  background: #f4efe4; color: #07060a;
  font: inherit; font-size: 22px; letter-spacing: .16em;
  text-indent: .16em;
  touch-action: manipulation;
}
button:hover { background: #e24b3a; color: #fff }
.hint {
  margin: 10px 0 0;
  font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
  letter-spacing: .14em;
  color: rgba(244, 239, 228, .7);
}
@media (prefers-reduced-motion: reduce) {
  #gate { transition: none }
}
</style>

<a class="back" href="../">← RemoteFunLand</a>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="gate">
  <button id="begin" type="button">BEGIN</button>
  <p class="hint">75 SECONDS · 128 BPM · SOUND ON</p>
</div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D = Math.PI / 180;
  const BPM = 128;
  const BEAT = 60 / BPM;
  const BARS = 40;
  const BEATS = BARS * 4;
  const END = BEATS * BEAT;
  const CIRCLE = 4 * Math.SQRT2;
  const SQRT2 = Math.SQRT2;

  const centroid = (poly) => {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      const cr = x1 * y2 - x2 * y1;
      a += cr; cx += (x1 + x2) * cr; cy += (y1 + y2) * cr;
    }
    a *= 0.5;
    return [cx / (6 * a), cy / (6 * a)];
  };
  const centerPoly = (raw) => {
    const c = centroid(raw);
    return raw.map(([x, y]) => [x - c[0], y - c[1]]);
  };
  const LOCAL = {
    largeA: centerPoly([[0, 0], [4 * SQRT2, 0], [0, 4 * SQRT2]]),
    largeB: centerPoly([[0, 0], [4 * SQRT2, 0], [0, 4 * SQRT2]]),
    medium: centerPoly([[0, 0], [4, 0], [0, 4]]),
    smallA: centerPoly([[0, 0], [2 * SQRT2, 0], [0, 2 * SQRT2]]),
    smallB: centerPoly([[0, 0], [2 * SQRT2, 0], [0, 2 * SQRT2]]),
    square: centerPoly([[0, 0], [2 * SQRT2, 0], [2 * SQRT2, 2 * SQRT2], [0, 2 * SQRT2]]),
    para: centerPoly([[0, 0], [4, 0], [6, 2], [2, 2]]),
  };
  const ORDER = ['largeA', 'largeB', 'medium', 'para', 'square', 'smallA', 'smallB'];
  const INK = {
    largeA: '#e8c56b', largeB: '#e24b3a', medium: '#f6f1e6',
    smallA: '#3d7ec9', smallB: '#e48aa4', square: '#fff8ee', para: '#2f9e86',
  };
  const INK_DARK = {
    largeA: '#8a6a2e', largeB: '#8e261c', medium: '#b7ad96',
    smallA: '#1c4478', smallB: '#8d4458', square: '#d9cbb0', para: '#14685a',
  };
  const DIR = {
    largeA: [-1, 0.25, 2.4], largeB: [1, -0.15, -2.2], medium: [0.15, 1, 1.7],
    smallA: [-0.85, -1, -1.9], smallB: [0.9, 0.75, 2.1], square: [0.05, -1, 1.4],
    para: [-0.35, -0.9, -1.5],
  };
  const POSES = {
    scatter: {
      largeA: { x: -5.6, y: 3.6, rot: 20 * D }, largeB: { x: 5.8, y: -3.2, rot: 200 * D },
      medium: { x: 0.2, y: 6.4, rot: -30 * D }, smallA: { x: -6.4, y: -3.4, rot: 80 * D },
      smallB: { x: 6.2, y: 4, rot: -20 * D }, square: { x: 0.15, y: 0.05, rot: 45 * D },
      para: { x: 3.4, y: -6.5, rot: 12 * D },
    },
    person: {
      largeA: { x: 0, y: -2.4, rot: 45 * D }, largeB: { x: -6.4, y: -3.6, rot: 18 * D },
      medium: { x: 0, y: 6.35, rot: 225 * D }, smallA: { x: -5.16, y: 0.24, rot: 45 * D },
      smallB: { x: 5.16, y: 0.24, rot: 45 * D }, square: { x: 0, y: 3.25, rot: 45 * D },
      para: { x: 0, y: 0.09, rot: 0 },
    },
    bird: {
      largeA: { x: -0.348, y: 2.625, rot: 225 * D }, largeB: { x: 0.2, y: -2.49, rot: 45 * D },
      medium: { x: -5.279, y: 1.503, rot: 315 * D }, smallA: { x: 7.864, y: 0.719, rot: 8 * D },
      smallB: { x: -6.3, y: -2.15, rot: 210 * D }, square: { x: 5.413, y: 0.343, rot: 15 * D },
      para: { x: 0, y: 0, rot: -6 * D },
    },
    boat: {
      para: { x: -0.2, y: 0, rot: 0 }, largeA: { x: -0.167, y: -2.489, rot: 45 * D },
      largeB: { x: -1.15, y: 2.49, rot: 225 * D }, medium: { x: 5.667, y: -2.501, rot: 15 * D },
      smallA: { x: -3.4, y: 6.15, rot: 150 * D }, smallB: { x: 0.2, y: -6.05, rot: 45 * D },
      square: { x: 4.85, y: 1.35, rot: 6 * D },
    },
    tree: {
      para: { x: 0, y: -2.15, rot: 90 * D }, largeA: { x: 0, y: 2.3, rot: 225 * D },
      largeB: { x: 5.55, y: -2.55, rot: 225 * D }, medium: { x: 0, y: 5.95, rot: 225 * D },
      smallA: { x: -4.55, y: 6.35, rot: 150 * D }, smallB: { x: 4.15, y: 6.55, rot: 30 * D },
      square: { x: 6.4, y: 4.6, rot: 45 * D },
    },
    mandala: {
      largeA: { x: 0, y: 3.49, rot: 225 * D }, largeB: { x: 0, y: -3.49, rot: 45 * D },
      medium: { x: 5.1, y: 0, rot: 135 * D }, smallA: { x: -3.1, y: 6.15, rot: 160 * D },
      smallB: { x: 3.1, y: 6.15, rot: 20 * D }, square: { x: 0, y: 0, rot: 45 * D },
      para: { x: -5.16, y: 0, rot: 90 * D },
    },
    square: {
      largeA: { x: -2.6667, y: 0, rot: 135 * D }, largeB: { x: 0, y: 2.6667, rot: 45 * D },
      medium: { x: 2.6667, y: -2.6667, rot: 90 * D }, smallA: { x: 0, y: -1.3333, rot: 225 * D },
      smallB: { x: 3.3333, y: 2, rot: 315 * D }, square: { x: 2, y: 0, rot: 45 * D },
      para: { x: -1, y: -3, rot: 0 },
    },
  };
  const RADIUS = { scatter: 12.2, person: 11.1, bird: 11.4, boat: 10.8, tree: 12.2, mandala: 10.6, square: 7.15 };
  const FLASH = {
    CIRCUM: '#e8c56b', AMBULA: '#e24b3a', SEVEN: '#f6f1e6', SHADOW: '#e24b3a',
    ANIMA: '#e48aa4', ANIMUS: '#3d7ec9', NIGHT: '#8eb7ff', AXIS: '#2f9e86',
    SELF: '#f6f1e6', SQUARE: '#e8c56b', CIRCUMAMBULATIO: '#f6f1e6',
  };

  const FIGS = [
    { pose: 'person', word: 'SHADOW', shadow: true },
    { pose: 'bird', word: 'ANIMA' },
    { pose: 'bird', word: 'ANIMUS', mirror: true },
    { pose: 'boat', word: 'NIGHT' },
    { pose: 'tree', word: 'AXIS' },
    { pose: 'mandala', word: 'SELF', spin: true },
    { pose: 'square', word: 'SQUARE' },
  ];
  const CUTS = [];
  CUTS.push({ beat: 0, pose: 'scatter', word: 'CIRCUM' });
  CUTS.push({ beat: 2, pose: 'scatter', word: 'AMBULA' });
  CUTS.push({ beat: 4, pose: 'square', word: 'SEVEN' });
  CUTS.push({ beat: 6, pose: 'square', word: 'SEVEN' });
  let beatCursor = 8, fig = 0;
  while (beatCursor < 96) { CUTS.push({ beat: beatCursor, ...FIGS[fig++ % 7] }); beatCursor += 4; }
  while (beatCursor < 128) { CUTS.push({ beat: beatCursor, ...FIGS[fig++ % 7] }); beatCursor += 2; }
  CUTS.push({ beat: 128, pose: 'mandala', word: 'SELF', spin: true });
  CUTS.push({ beat: 144, pose: 'square', word: 'CIRCUMAMBULATIO' });
  CUTS.forEach((c, i) => { c.index = i; c.durBeats = (CUTS[i + 1] ? CUTS[i + 1].beat : BEATS) - c.beat; });

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const easeOutExpo = (u) => (u >= 1 ? 1 : 1 - 2 ** (-10 * u));
  const easeOutBack = (u) => {
    const c1 = 1.35, c3 = c1 + 1;
    return 1 + c3 * (u - 1) ** 3 + c1 * (u - 1) ** 2;
  };
  const worldPoly = (local, x, y, rot, s) => {
    const c = Math.cos(rot), sn = Math.sin(rot);
    return local.map(([px, py]) => {
      const fx = px * s, fy = py * s;
      return [x + fx * c - fy * sn, y + fx * sn + fy * c];
    });
  };
  const trace = (ctx, poly) => {
    ctx.beginPath();
    poly.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
  };

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  let view = { w: 1, h: 1, dpr: 1 };
  const resize = () => {
    const w = innerWidth, h = innerHeight;
    const area = w * h;
    const dpr = Math.min(devicePixelRatio || 1, area > 1400 * 900 ? 1.25 : 1.75);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    view = { w, h, dpr };
  };
  resize();
  addEventListener('resize', resize);

  const sceneAt = (t) => {
    const beat = t / BEAT;
    let s = CUTS[0];
    for (const c of CUTS) { if (c.beat <= beat) s = c; else break; }
    return s;
  };

  const placed = (id, pose, u) => {
    const p = POSES[pose][id];
    const [dx, dy, spin] = DIR[id];
    const k = 1 - u;
    return {
      x: p.x + dx * k * 7.5,
      y: p.y + dy * k * 7.5,
      rot: p.rot + k * spin,
      s: 0.72 + 0.28 * u,
    };
  };

  const drawPoly = (poly, id, alpha) => {
    if (alpha < 0.02) return;
    ctx.globalAlpha = alpha;
    trace(ctx, poly);
    ctx.fillStyle = INK[id];
    ctx.fill();
    ctx.globalAlpha = 1;
  };

  const fitFont = (text, maxW, maxSize) => {
    let size = maxSize;
    ctx.font = `400 ${size}px Impact, "Arial Black", sans-serif`;
    while (size > 18 && ctx.measureText(text).width > maxW) {
      size *= 0.94;
      ctx.font = `400 ${size}px Impact, "Arial Black", sans-serif`;
    }
    return size;
  };

  const draw = (t, live) => {
    const { w, h, dpr } = view;
    const ended = live && t >= END;
    const time = ended ? END - 0.001 : (live ? t : END - 0.001);
    const scene = sceneAt(time);
    const local = time - scene.beat * BEAT;
    const u = reduced ? 1 : easeOutBack(clamp(local / 0.09, 0, 1));
    const punch = reduced ? 0 : Math.exp(-(time % BEAT) * 16);
    const pose = scene.pose;
    const rad = RADIUS[pose];
    const zoom = (reduced ? 1 : 1 + punch * 0.07 + Math.max(0, 1 - local / 0.16) * 0.16);
    const sc = (Math.min(w, h) * dpr * 0.46 * zoom) / rad;
    const tilt = reduced || pose === 'square' ? 0 : ((scene.index % 5) - 2) * 0.1;
    const tiltNow = tilt * (reduced ? 1 : easeOutExpo(clamp(local / 0.16, 0, 1)));
    const spin = !reduced && scene.spin ? (local / (scene.durBeats * BEAT)) * Math.PI : 0;
    const camRot = tiltNow + spin;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07060a';
    ctx.fillRect(0, 0, w, h);

    const wash = reduced ? 0 : Math.exp(-local * 11);
    if (wash > 0.02) {
      ctx.globalAlpha = wash * 0.55;
      ctx.fillStyle = FLASH[scene.word] || '#fff';
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
    }

    if (live && !reduced) {
      const word = scene.word;
      const wu = easeOutExpo(clamp(local / 0.14, 0, 1));
      const size = fitFont(word, w * 0.94, Math.min(w * (word.length > 10 ? 0.11 : 0.2), h * 0.34));
      ctx.save();
      ctx.translate(w * 0.5 + (1 - wu) * w * 0.18, h * (scene.index % 2 ? 0.62 : 0.38));
      ctx.rotate(((scene.index % 2) ? -1 : 1) * 0.04 * (1 - wu));
      ctx.scale(1.45 - 0.45 * wu, 1.45 - 0.45 * wu);
      ctx.font = `400 ${size}px Impact, "Arial Black", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = 'rgba(244,239,228,.14)';
      ctx.fillText(word, 6, 6);
      ctx.fillStyle = FLASH[word] || '#f6f1e6';
      ctx.globalAlpha = 0.92;
      ctx.fillText(word, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    } else if (!live) {
      const size = fitFont('CIRCUMAMBULATIO', w * 0.92, Math.min(w * 0.09, h * 0.12));
      ctx.font = `400 ${size}px Impact, "Arial Black", sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#f6f1e6';
      ctx.fillText('CIRCUMAMBULATIO', w / 2, h * 0.2);
    }

    ctx.setTransform(sc, 0, 0, -sc, (w * dpr) / 2, (h * dpr) / 2);
    ctx.rotate(camRot);
    const px = dpr / sc;

    ctx.lineWidth = 1.6 * px;
    ctx.strokeStyle = 'rgba(244,239,228,.85)';
    ctx.beginPath();
    ctx.arc(0, 0, CIRCLE, 0, Math.PI * 2);
    ctx.stroke();
    if (pose === 'square' || pose === 'mandala') {
      ctx.lineWidth = 1.25 * px;
      ctx.strokeStyle = 'rgba(232,197,107,.9)';
      ctx.strokeRect(-4, -4, 8, 8);
    }
    const head = -Math.PI / 2 + ((time / BEAT) % 4) / 4 * Math.PI * 2;
    ctx.fillStyle = '#f6f1e6';
    ctx.beginPath();
    ctx.arc(Math.cos(head) * CIRCLE, Math.sin(head) * CIRCLE, 0.16, 0, Math.PI * 2);
    ctx.fill();

    const since = time % BEAT;
    const clap = !reduced && since < 0.05 && Math.floor(time / BEAT) % 2 === 1;
    if (clap) {
      ctx.strokeStyle = 'rgba(255,255,255,.85)';
      ctx.lineWidth = 0.8 * px;
      ctx.beginPath();
      ctx.moveTo(-14, 0); ctx.lineTo(14, 0);
      ctx.stroke();
    }

    const drawSet = (ox, oy, alpha, uu) => {
      for (const id of ORDER) {
        const p = placed(id, pose, uu);
        const poly = worldPoly(LOCAL[id], p.x + ox, p.y + oy, p.rot, p.s * (1 + punch * 0.035));
        const sh = worldPoly(LOCAL[id], p.x + ox + 0.12, p.y + oy - 0.1, p.rot, p.s);
        ctx.globalAlpha = alpha * 0.55;
        trace(ctx, sh);
        ctx.fillStyle = '#000';
        ctx.fill();
        drawPoly(poly, id, alpha);
      }
      ctx.globalAlpha = 1;
    };

    if (!reduced && local < 0.16) drawSet(0, 0, 0.28, Math.max(0, u - 0.45));
    if (scene.shadow) drawSet(2.15, -0.35, 0.9, reduced ? 1 : easeOutBack(clamp((local - 0.04) / 0.09, 0, 1)));
    if (scene.mirror) {
      ctx.save();
      ctx.scale(-1, 1);
      drawSet(0, 0, 0.78, u);
      ctx.restore();
    }
    drawSet(0, 0, 1, u);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.42, w / 2, h / 2, Math.max(w, h) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);

    if (live) {
      ctx.font = '500 12px ui-monospace, Menlo, Consolas, monospace';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(244,239,228,.78)';
      const bar = Math.min(BARS, Math.floor(time / BEAT / 4) + 1);
      ctx.fillText(`${scene.word}   ${String(bar).padStart(2, '0')} / ${BARS}`, w - 14, 12);
    }
  };

  let started = false, audioCtx = null, t0 = 0, seek = 0;
  const hashSeek = () => {
    const m = /(?:^|[#&])t=([\d.]+)/.exec(location.hash);
    return m ? clamp(parseFloat(m[1]) || 0, 0, END) : 0;
  };

  const frame = () => {
    const t = started ? ((audioCtx ? audioCtx.currentTime : performance.now() / 1000) - t0 + seek) : 0;
    draw(t, started);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  const N = { D1: 36.71, D2: 73.42, F2: 87.31, Fs2: 92.5, A1: 55, A2: 110, C2: 65.41, D3: 146.83, F3: 174.61, Fs3: 185, A3: 220, D4: 293.66, F4: 349.23, Fs4: 369.99, A4: 440 };

  function buildEvents() {
    const ev = [];
    for (let b = 0; b < BEATS; b++) {
      const t = b * BEAT;
      if (b < 158) ev.push({ t, k: 'kick' });
      if (b % 2 === 1 && b < 156) ev.push({ t, k: 'clap' });
      if (b < 152) ev.push({ t: t + BEAT * 0.5, k: 'hat', open: b % 4 === 3 });
      if (b >= 96 && b < 128) {
        ev.push({ t: t + BEAT * 0.25, k: 'hat' });
        ev.push({ t: t + BEAT * 0.75, k: 'hat' });
      }
      if (b % 8 === 7 && b < 144) ev.push({ t, k: 'riser' });
      if (b % 8 === 0) ev.push({ t, k: 'stab', major: b >= 128 });
    }
    for (let bar = 0; bar < BARS; bar++) {
      const base = bar * 4 * BEAT;
      const major = bar >= 32;
      const notes = major
        ? [[0, N.D1], [0.75, N.D2], [1.5, N.A1], [2.5, N.Fs2], [3.25, N.A2]]
        : [[0, N.D1], [0.75, N.D2], [1.5, N.A1], [2, N.F2], [2.75, N.C2], [3.5, N.D2]];
      if (bar < 38) notes.forEach(([b, f]) => ev.push({ t: base + b * BEAT, k: 'bass', f }));
    }
    ev.sort((a, b) => a.t - b.t);
    return ev;
  }

  function arm(ctx, all) {
    const bus = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 8; comp.ratio.value = 4;
    comp.attack.value = 0.003; comp.release.value = 0.12;
    const lim = ctx.createDynamicsCompressor();
    lim.threshold.value = -1.2; lim.knee.value = 0; lim.ratio.value = 16;
    lim.attack.value = 0.002; lim.release.value = 0.08;
    const master = ctx.createGain();
    master.gain.value = 0.8;
    bus.connect(comp).connect(lim).connect(master).connect(ctx.destination);

    const rate = ctx.sampleRate;
    const noise = ctx.createBuffer(1, rate, rate);
    const nd = noise.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    const burst = (time, type, freq, dest, dur, amp) => {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const f = ctx.createBiquadFilter();
      f.type = type; f.frequency.value = freq; f.Q.value = type === 'bandpass' ? 0.7 : 0.4;
      const g = ctx.createGain();
      g.gain.setValueAtTime(amp, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + dur);
      src.connect(f).connect(g).connect(dest);
      src.start(time); src.stop(time + dur + 0.02);
    };

    const kick = (time) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(172, time);
      o.frequency.exponentialRampToValueAtTime(46, time + 0.09);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.72, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
      o.connect(g).connect(bus);
      o.start(time); o.stop(time + 0.22);
      burst(time, 'highpass', 1800, bus, 0.02, 0.18);
    };
    const clap = (time) => {
      burst(time, 'bandpass', 1900, bus, 0.11, 0.28);
      const o = ctx.createOscillator();
      o.type = 'triangle'; o.frequency.value = 210;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.12, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.08);
      o.connect(g).connect(bus);
      o.start(time); o.stop(time + 0.1);
    };
    const hat = (time, open) => burst(time, 'highpass', 7500, bus, open ? 0.14 : 0.035, open ? 0.07 : 0.045);
    const bass = (time, freq) => {
      const o = ctx.createOscillator();
      o.type = 'square'; o.frequency.value = freq;
      const f = ctx.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.setValueAtTime(480, time);
      f.frequency.exponentialRampToValueAtTime(110, time + 0.1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.2, time);
      g.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
      o.connect(f).connect(g).connect(bus);
      o.start(time); o.stop(time + 0.17);
    };
    const stab = (time, major) => {
      const chord = major ? [N.D4, N.Fs4, N.A4] : [N.D4, N.F4, N.A4];
      chord.forEach((freq) => {
        const o = ctx.createOscillator();
        o.type = 'triangle'; o.frequency.value = freq;
        const f = ctx.createBiquadFilter();
        f.type = 'lowpass'; f.frequency.value = 2200;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.1, time);
        g.gain.exponentialRampToValueAtTime(0.001, time + 0.28);
        o.connect(f).connect(g).connect(bus);
        o.start(time); o.stop(time + 0.32);
      });
    };
    const riser = (time) => {
      const src = ctx.createBufferSource();
      src.buffer = noise;
      const f = ctx.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 4;
      f.frequency.setValueAtTime(300, time);
      f.frequency.exponentialRampToValueAtTime(4000, time + BEAT * 0.9);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.001, time);
      g.gain.exponentialRampToValueAtTime(0.16, time + BEAT * 0.85);
      g.gain.exponentialRampToValueAtTime(0.001, time + BEAT);
      src.connect(f).connect(g).connect(bus);
      src.start(time); src.stop(time + BEAT + 0.02);
    };

    const events = buildEvents();
    const origin = ctx.currentTime + 0.03;
    const play = (e) => {
      const when = origin + e.t;
      if (!all && when < ctx.currentTime - 0.02) return;
      if (e.k === 'kick') kick(when);
      else if (e.k === 'clap') clap(when);
      else if (e.k === 'hat') hat(when, e.open);
      else if (e.k === 'bass') bass(when, e.f);
      else if (e.k === 'stab') stab(when, e.major);
      else if (e.k === 'riser') riser(when);
    };
    if (all) { events.forEach(play); return origin; }
    let cursor = 0;
    const pump = () => {
      const horizon = ctx.currentTime + 0.18;
      while (cursor < events.length && origin + events[cursor].t < horizon) play(events[cursor++]);
      if (cursor < events.length) setTimeout(pump, 40);
    };
    pump();
    return origin;
  }

  const gate = document.getElementById('gate');
  const begin = () => {
    if (started) return;
    started = true;
    seek = hashSeek();
    gate.classList.add('gone');
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      audioCtx = new AC();
      const origin = arm(audioCtx);
      t0 = origin;
      audioCtx.resume();
    } catch (err) {
      audioCtx = null;
      t0 = performance.now() / 1000;
    }
  };
  document.getElementById('begin').addEventListener('click', begin);
  if (new URLSearchParams(location.search).has('autostart')) begin();

})();
</script>
</html>
