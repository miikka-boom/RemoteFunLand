<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circumambulatio</title>
<meta name="description" content="A little tangram square looks for a shadow that fits, and finds the other six pieces holding open a hole the shape of itself.">
<meta name="theme-color" content="#07060a">
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box }
html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden }
body {
  color: #f4ecdc;
  font: 17px/1.4 Palatino, "Palatino Linotype", "Iowan Old Style", Georgia, serif;
  touch-action: none;
}
canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
.back {
  position: fixed; z-index: 5;
  top: max(12px, env(safe-area-inset-top));
  left: max(14px, env(safe-area-inset-left));
  color: rgba(244, 236, 220, .55);
  font: 500 12px/1 ui-monospace, Menlo, Consolas, monospace;
  letter-spacing: .08em;
  text-decoration: none;
  touch-action: manipulation;
}
.back:hover { color: #f4ecdc }
.back:focus-visible, button:focus-visible { outline: 2px solid #f0ddb0; outline-offset: 3px }
#gate {
  position: fixed; z-index: 4; inset: 0;
  display: grid; align-content: end; justify-items: center;
  padding: 0 22px max(26px, env(safe-area-inset-bottom));
  background: linear-gradient(to top, rgba(7,6,10,.78), rgba(7,6,10,0) 46%);
}
#gate.gone { opacity: 0; pointer-events: none }
button {
  min-height: 48px; min-width: 148px;
  padding: 10px 26px;
  border: 1px solid rgba(240, 221, 176, .8);
  background: #f0ddb0; color: #1a140e;
  font: inherit; font-size: 16px; letter-spacing: .18em; text-indent: .18em;
  cursor: pointer; touch-action: manipulation;
}
button:hover { background: #fff6e4 }
.hint {
  margin: 10px 0 0;
  font: 11px/1.3 ui-monospace, Menlo, Consolas, monospace;
  letter-spacing: .12em; color: rgba(244, 236, 220, .62);
}
</style>

<a class="back" href="../">← RemoteFunLand</a>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="gate">
  <button id="begin" type="button">BEGIN</button>
  <p class="hint">A SHORT STORY · SOUND ON</p>
</div>

<script>
(() => {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D = Math.PI / 180;
  const END = 88;
  const SQRT2 = Math.SQRT2;

  const centroid = (poly) => {
    let a = 0, cx = 0, cy = 0;
    for (let i = 0; i < poly.length; i++) {
      const [x1, y1] = poly[i], [x2, y2] = poly[(i + 1) % poly.length];
      const cr = x1 * y2 - x2 * y1;
      a += cr; cx += (x1 + x2) * cr; cy += (y1 + y2) * cr;
    }
    a *= 0.5;
    return [cx / (6 * a), cy / (6 * a)];
  };
  const centerPoly = (raw) => {
    const c = centroid(raw);
    return raw.map(([x, y]) => [x - c[0], y - c[1]]);
  };
  const LOCAL = {
    largeA: centerPoly([[0, 0], [4 * SQRT2, 0], [0, 4 * SQRT2]]),
    largeB: centerPoly([[0, 0], [4 * SQRT2, 0], [0, 4 * SQRT2]]),
    medium: centerPoly([[0, 0], [4, 0], [0, 4]]),
    smallA: centerPoly([[0, 0], [2 * SQRT2, 0], [0, 2 * SQRT2]]),
    smallB: centerPoly([[0, 0], [2 * SQRT2, 0], [0, 2 * SQRT2]]),
    square: centerPoly([[0, 0], [2 * SQRT2, 0], [2 * SQRT2, 2 * SQRT2], [0, 2 * SQRT2]]),
    para: centerPoly([[0, 0], [4, 0], [6, 2], [2, 2]]),
  };
  const ORDER = ['largeA', 'largeB', 'para', 'medium', 'smallA', 'smallB', 'square'];
  const INK = {
    largeA: '#e4c16a', largeB: '#e15a45', medium: '#f3ecdf',
    smallA: '#3f86c8', smallB: '#e59aab', square: '#fff8ec', para: '#3aaa90',
  };

  // The finished tangram, minus the little square. The hole is a diamond.
  const HOME = {
    largeA: { x: -2.6667, y: 0, rot: 135 * D },
    largeB: { x: 0, y: 2.6667, rot: 45 * D },
    medium: { x: 2.6667, y: -2.6667, rot: 90 * D },
    smallA: { x: 0, y: -1.3333, rot: 225 * D },
    smallB: { x: 3.3333, y: 2, rot: 315 * D },
    para: { x: -1, y: -3, rot: 0 },
    square: { x: 2, y: 0, rot: 45 * D },
  };
  // The other six, waiting outside the circle, badly disguised as scenery.
  // Offstage right, spaced so the big triangles never sit on each other.
  const LOUNGE = {
    largeA: { x: 18.2, y: 6.2, rot: -0.4 },
    largeB: { x: 19.0, y: -6.8, rot: 2.3 },
    medium: { x: 16.2, y: 0.3, rot: 0.2 },
    smallA: { x: 15.0, y: 4.6, rot: 0.8 },
    smallB: { x: 15.4, y: -4.8, rot: -0.5 },
    para: { x: 21.2, y: -0.1, rot: 0.1 },
  };

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const easeInOut = (u) => (u < 0.5 ? 4 * u * u * u : 1 - ((-2 * u + 2) ** 3) / 2);
  const easeOut = (u) => 1 - (1 - u) ** 3;
  const smooth = (t, a, b) => easeInOut(clamp((t - a) / (b - a), 0, 1));
  const ang = (a, b) => {
    let d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  };

  const k = (t, x, y, rot, extra) => ({ t, x, y, rot, ...(extra || {}) });

  // The little square. Upright until the moment it has to turn.
  const HERO = [
    k(0, 0, 0.2, 0),
    k(1.15, 0, 0.2, -0.42),
    k(2.35, 0, 0.2, 0.48),
    k(3.5, 0, 0.2, 0),
    k(5.3, -4.1, 1.85, -0.1, { hop: 1.5 }),
    k(8.4, -4.1, 1.85, 0.62),
    k(11.2, -4.1, 1.85, 0),
    k(12.4, -0.6, -3.55, 0.08, { hop: 1.65 }),
    k(15.8, -0.6, -3.55, -0.4),
    k(17.4, -0.6, -3.55, 0),
    k(18.6, -4.7, -1.7, 0.05, { hop: 1.35 }),
    k(21.8, -4.7, -1.7, 0.4),
    k(23.4, -4.7, -1.7, 0),
    k(24.6, -6.5, 0.15, 0.06, { hop: 1.2 }),
    k(39.6, -6.5, 0.15, 0),
    k(40.5, 2, 0, 0, { hop: 2.35 }),          // upright, and the hole is a diamond
    k(41.55, -5.4, -0.5, -0.25, { hop: 1.7 }),
    k(45.8, -5.4, -0.5, 0),
    k(46.7, 2.35, 1.05, 0.35, { hop: 2.5 }),   // still the wrong way up
    k(47.8, -5.6, -0.15, 0.1, { hop: 1.5 }),
    k(52.6, -5.6, -0.15, 0),
    k(54.6, 2, 0, 45 * D, { hop: 2.05 }),      // turns in the air
    k(55.3, 2, 0, 45 * D + 0.12),
    k(56.1, 2, 0, 45 * D),
    k(88, 2, 0, 45 * D),
  ];

  const shadowTrip = (id, leave, spot, backRot) => {
    const home = LOUNGE[id];
    return [
      k(0, home.x, home.y, home.rot),
      k(leave, home.x, home.y, home.rot),
      k(leave + 2.05, spot.x, spot.y, spot.rot),
      k(leave + 3.7, spot.x, spot.y, spot.rot + 0.2),
      k(leave + 4.5, spot.x, spot.y, spot.rot),
      k(leave + 6.1, home.x, home.y, backRot),
    ];
  };

  const TRACKS = {
    largeA: shadowTrip('largeA', 6.4, { x: 1.7, y: -1.35, rot: 0.7 }, -0.4).concat([
      k(26.2, LOUNGE.largeA.x, LOUNGE.largeA.y, 0.2),
      k(29.2, HOME.largeA.x, HOME.largeA.y, HOME.largeA.rot),
      k(88, HOME.largeA.x, HOME.largeA.y, HOME.largeA.rot),
    ]),
    medium: shadowTrip('medium', 13.4, { x: 2.6, y: 1.7, rot: -0.9 }, 0.2).concat([
      k(28.4, LOUNGE.medium.x, LOUNGE.medium.y, -0.3),
      k(31.2, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
      k(41.45, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
      k(41.7, HOME.medium.x + 0.28, HOME.medium.y - 0.22, HOME.medium.rot),
      k(42.5, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
      k(47.6, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
      k(47.85, HOME.medium.x + 0.22, HOME.medium.y - 0.28, HOME.medium.rot),
      k(48.7, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
      k(88, HOME.medium.x, HOME.medium.y, HOME.medium.rot),
    ]),
    para: shadowTrip('para', 19.4, { x: 2.15, y: 2.55, rot: 0.35 }, 0.1).concat([
      k(27.6, LOUNGE.para.x, LOUNGE.para.y, 0.15),
      k(30.4, HOME.para.x, HOME.para.y, HOME.para.rot),
      k(88, HOME.para.x, HOME.para.y, HOME.para.rot),
    ]),
    largeB: [
      k(0, LOUNGE.largeB.x, LOUNGE.largeB.y, LOUNGE.largeB.rot),
      k(27.0, LOUNGE.largeB.x, LOUNGE.largeB.y, LOUNGE.largeB.rot),
      k(30.0, HOME.largeB.x, HOME.largeB.y, HOME.largeB.rot),
      k(88, HOME.largeB.x, HOME.largeB.y, HOME.largeB.rot),
    ],
    smallA: [
      k(0, LOUNGE.smallA.x, LOUNGE.smallA.y, LOUNGE.smallA.rot),
      k(29.0, LOUNGE.smallA.x, LOUNGE.smallA.y, LOUNGE.smallA.rot),
      k(31.6, HOME.smallA.x, HOME.smallA.y, HOME.smallA.rot),
      k(36.4, HOME.smallA.x, HOME.smallA.y, HOME.smallA.rot),
      k(37.1, HOME.smallA.x, HOME.smallA.y, HOME.smallA.rot + 0.35),
      k(38.0, HOME.smallA.x, HOME.smallA.y, HOME.smallA.rot),
      k(88, HOME.smallA.x, HOME.smallA.y, HOME.smallA.rot),
    ],
    smallB: [
      k(0, LOUNGE.smallB.x, LOUNGE.smallB.y, LOUNGE.smallB.rot),
      k(29.8, LOUNGE.smallB.x, LOUNGE.smallB.y, LOUNGE.smallB.rot),
      k(32.4, HOME.smallB.x, HOME.smallB.y, HOME.smallB.rot),
      k(88, HOME.smallB.x, HOME.smallB.y, HOME.smallB.rot),
    ],
  };

  const sample = (keys, t) => {
    if (t <= keys[0].t) return { ...keys[0], u: 1, hop: 0 };
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i].t) {
        const a = keys[i - 1], b = keys[i];
        const dur = Math.max(0.0001, b.t - a.t);
        const raw = clamp((t - a.t) / dur, 0, 1);
        const hop = b.hop || 0;
        const u = hop ? easeOut(raw) : easeInOut(raw);
        const arc = hop ? Math.sin(Math.PI * raw) * hop * (reduced ? 0.3 : 1) : 0;
        return {
          x: lerp(a.x, b.x, u),
          y: lerp(a.y, b.y, u) + arc,
          rot: a.rot + ang(a.rot, b.rot) * u,
          hop, raw,
        };
      }
    }
    const last = keys[keys.length - 1];
    return { ...last, u: 1, hop: 0, raw: 1 };
  };

  const squashOf = (keys, t) => {
    if (reduced) return 1;
    for (let i = 1; i < keys.length; i++) {
      if (!keys[i].hop) continue;
      const dt = keys[i].t - t;
      if (dt > 0 && dt < 0.2) return 1 - 0.18 * Math.sin((1 - dt / 0.2) * Math.PI);
      const since = t - keys[i].t;
      if (since >= 0 && since < 0.16) return 1 - 0.14 * (1 - since / 0.16);
    }
    return 1;
  };

  const heroAt = (t) => sample(HERO, t);
  const pieceAt = (id, t) => (id === 'square' ? heroAt(t) : sample(TRACKS[id], t));

  const reveal = (t) => smooth(t, 54.6, 66);
  const mix = (hex, t) => {
    const n = (i) => parseInt(hex.slice(i, i + 2), 16);
    const d = [44, 40, 36];
    const c = [0, 1, 2].map((i) => Math.round(d[i] + (n(1 + i * 2) - d[i]) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
  };

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  let view = { w: 1, h: 1, dpr: 1 };
  const resize = () => {
    const w = innerWidth, h = innerHeight;
    const dpr = Math.min(devicePixelRatio || 1, w * h > 1400 * 900 ? 1.35 : 1.75);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    view = { w, h, dpr };
  };
  resize();
  addEventListener('resize', resize);

  const cam = (t) => {
    const keys = [
      [0, 0, 0.2, 6.7],
      [5.0, 0, 0.2, 6.7],
      [8, -0.8, 0.4, 10.8],
      [24, -1.4, 0, 11.2],
      [34, -0.4, 0, 9.6],
      [54, 0.3, 0, 8.4],
      [66, 0, 0, 7.35],
      [88, 0, 0, 7.35],
    ];
    let a = keys[0], b = keys[0];
    for (let i = 1; i < keys.length; i++) {
      if (t <= keys[i][0]) { a = keys[i - 1]; b = keys[i]; break; }
      a = b = keys[i];
    }
    const u = a === b ? 1 : easeInOut(clamp((t - a[0]) / (b[0] - a[0]), 0, 1));
    let x = lerp(a[1], b[1], u), y = lerp(a[2], b[2], u);
    if (t < 24) {
      const h = heroAt(Math.max(0, t - 0.28));
      x = h.x * 0.42;
      y = h.y * 0.42;
    }
    if (!reduced) {
      for (const bt of [41.45, 47.7]) {
        const age = t - bt;
        if (age > 0 && age < 0.3) x += Math.sin(age * 46) * Math.exp(-age * 9) * 0.1;
      }
    }
    return { x, y, r: lerp(a[3], b[3], u) };
  };

  const worldPoly = (local, x, y, rot, sx, sy) => {
    const c = Math.cos(rot), s = Math.sin(rot);
    return local.map(([px, py]) => {
      const fx = px * sx, fy = py * sy;
      return [x + fx * c - fy * s, y + fx * s + fy * c];
    });
  };
  const trace = (poly) => {
    ctx.beginPath();
    poly.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
    ctx.closePath();
  };

  const shadowOf = (t) => {
    if (t < 63) return null;
    const u = smooth(t, 63, 71);
    return {
      x: lerp(2.4, 0.55, u),
      y: lerp(1.35, -0.42, u),
      a: lerp(0.12, 0.42, u),
    };
  };

  const drawPiece = (id, t, px) => {
    const p = pieceAt(id, t);
    const sy = id === 'square' ? squashOf(HERO, t) : 1;
    const sx = 1 / sy;
    const poly = worldPoly(LOCAL[id], p.x, p.y, p.rot, sx, sy);
    const col = id === 'square' ? INK.square : mix(INK[id], 0.22 + 0.78 * reveal(t));
    trace(poly);
    ctx.fillStyle = col;
    ctx.fill();
    ctx.lineWidth = 1.35 * px;
    ctx.strokeStyle = id === 'square' ? 'rgba(255,248,236,.9)' : `rgba(244,236,220,${0.28 + 0.45 * reveal(t)})`;
    ctx.stroke();
  };

  const draw = (t, live) => {
    const time = live ? Math.min(t, END) : 3.2;
    const { w, h, dpr } = view;
    const c = cam(time);
    const sc = (Math.min(w, h) * dpr * 0.46) / c.r;
    const px = dpr / sc;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#07060a';
    ctx.fillRect(0, 0, w, h);

    ctx.setTransform(sc, 0, 0, -sc, (w * dpr) / 2 - c.x * sc, (h * dpr) / 2 + c.y * sc);

    ctx.beginPath();
    ctx.arc(0, 0, 4 * SQRT2, 0, Math.PI * 2);
    ctx.fillStyle = '#1c1814';
    ctx.fill();
    ctx.lineWidth = 1.4 * px;
    ctx.strokeStyle = 'rgba(232, 206, 154, .55)';
    ctx.stroke();

    const sh = shadowOf(time);
    if (sh) {
      ctx.save();
      ctx.translate(sh.x, sh.y);
      ctx.globalAlpha = sh.a;
      for (const id of ORDER) {
        const p = pieceAt(id, time);
        const sy = id === 'square' ? squashOf(HERO, time) : 1;
        trace(worldPoly(LOCAL[id], p.x, p.y, p.rot, 1 / sy, sy));
        ctx.fillStyle = '#000';
        ctx.fill();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    for (const id of ORDER) if (id !== 'square') drawPiece(id, time, px);
    drawPiece('square', time, px);

    if (live && time > 54.55 && time < 55.35) {
      const age = time - 54.55;
      ctx.beginPath();
      ctx.arc(2, 0, 0.3 + age * 5.5, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(255, 246, 228, ${0.7 * (1 - age / 0.8)})`;
      ctx.lineWidth = 1.5 * px;
      ctx.stroke();
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const vg = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.4, w / 2, h / 2, Math.max(w, h) * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, w, h);

    const titleA = live ? smooth(time, 74, 82) : 0;
    if (titleA > 0.01) {
      ctx.globalAlpha = titleA;
      ctx.fillStyle = '#f4ecdc';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      const size = Math.min(22, w * 0.045);
      ctx.font = `500 ${size}px Palatino, "Palatino Linotype", Georgia, serif`;
      ctx.fillText('Circumambulatio', w / 2, h - Math.max(18, 22));
      ctx.globalAlpha = 1;
    }
  };

  let started = false, audioCtx = null, t0 = 0, seek = 0;
  const hashSeek = () => {
    const m = /(?:^|[#&])t=([\d.]+)/.exec(location.hash);
    return m ? clamp(parseFloat(m[1]) || 0, 0, END) : 0;
  };
  const frame = () => {
    const t = started ? ((audioCtx ? audioCtx.currentTime : performance.now() / 1000) - t0 + seek) : 0;
    draw(t, started);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);

  const score = (ctx) => {
    const bus = ctx.createGain();
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.knee.value = 10; comp.ratio.value = 3;
    comp.attack.value = 0.01; comp.release.value = 0.2;
    const master = ctx.createGain();
    master.gain.value = 0.85;
    const wetIn = ctx.createGain();
    const conv = ctx.createConvolver();
    conv.normalize = false;
    const rate = ctx.sampleRate;
    const irLen = Math.floor(rate * 1.3);
    const ir = ctx.createBuffer(2, irLen, rate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-(i / rate) * 2.4);
    }
    conv.buffer = ir;
    const wet = ctx.createGain();
    wet.gain.value = 0.28;
    bus.connect(comp);
    comp.connect(master);
    comp.connect(wetIn);
    wetIn.connect(conv).connect(wet).connect(master);
    master.connect(ctx.destination);

    const tone = (time, freq, dur, amp, type = 'sine', dest = bus) => {
      const o = ctx.createOscillator();
      o.type = type;
      o.frequency.value = freq;
      const g = ctx.createGain();
      const atk = Math.min(0.04, dur * 0.25);
      g.gain.setValueAtTime(0.0001, time);
      g.gain.linearRampToValueAtTime(amp, time + atk);
      g.gain.exponentialRampToValueAtTime(0.0001, time + dur);
      o.connect(g).connect(dest);
      o.start(time); o.stop(time + dur + 0.05);
    };
    const step = (time) => {
      const o = ctx.createOscillator();
      o.type = 'triangle';
      o.frequency.value = 180;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.08, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
      o.connect(g).connect(bus);
      o.start(time); o.stop(time + 0.08);
    };
    const bonk = (time) => {
      const o = ctx.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(280, time);
      o.frequency.exponentialRampToValueAtTime(70, time + 0.2);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.14, time);
      g.gain.exponentialRampToValueAtTime(0.0001, time + 0.28);
      o.connect(g).connect(bus);
      o.start(time); o.stop(time + 0.3);
    };
    const motif = (time, bright) => {
      const notes = bright ? [587.33, 739.99, 880, 1174.66] : [587.33, 698.46, 880];
      const gap = bright ? 1.15 : 1.05;
      notes.forEach((f, i) => {
        tone(time + i * gap, f, bright ? 1.6 : 0.9, bright ? 0.07 : 0.075, 'sine');
        tone(time + i * gap, f / 2, bright ? 1.8 : 1.05, 0.03, 'triangle');
      });
    };

    const t0 = ctx.currentTime + 0.05;
    const at = (sec) => t0 + sec;
    motif(at(0.35), false);
    step(at(5.3));
    tone(at(7.6), 155.56, 0.45, 0.05); // the shadow is the wrong note
    step(at(12.4));
    tone(at(14.8), 155.56, 0.4, 0.045);
    step(at(18.6));
    tone(at(21.2), 146.83, 0.35, 0.04);
    step(at(24.6));
    [27, 28.2, 29.4, 30.6, 31.6, 32.6].forEach((s) => step(at(s)));
    motif(at(35.2), false);

    const pedal = ctx.createOscillator();
    pedal.type = 'sine';
    pedal.frequency.value = 73.42;
    const pg = ctx.createGain();
    pg.gain.setValueAtTime(0.0001, at(27));
    pg.gain.linearRampToValueAtTime(0.04, at(32));
    pg.gain.setValueAtTime(0.04, at(74));
    pg.gain.linearRampToValueAtTime(0.0001, at(84));
    pedal.connect(pg).connect(bus);
    pedal.start(at(27)); pedal.stop(at(86));

    step(at(40.5)); bonk(at(41.45));
    step(at(46.7)); bonk(at(47.7));
    step(at(53.2));
    tone(at(54.7), 1174.7, 0.7, 0.06);
    tone(at(54.7), 880, 1.1, 0.05);
    motif(at(63.5), true);

    return t0;
  };

  const gate = document.getElementById('gate');
  const begin = () => {
    if (started) return;
    started = true;
    seek = hashSeek();
    gate.classList.add('gone');
    const AC = window.AudioContext || window.webkitAudioContext;
    try {
      audioCtx = new AC();
      t0 = score(audioCtx);
      audioCtx.resume();
    } catch (err) {
      audioCtx = null;
      t0 = performance.now() / 1000;
    }
  };
  document.getElementById('begin').addEventListener('click', begin);
  if (new URLSearchParams(location.search).has('autostart')) begin();
})();
</script>
</html>
