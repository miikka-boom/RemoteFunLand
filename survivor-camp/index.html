<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Survivor Camp</title>
<meta name="description" content="A landscape metagame prototype for Two Thumbs Left: a survivor camp that unlocks slowly around one fire, fed by simulated runs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: #scene is a full-bleed canvas (the side-on camp); #hot holds one transparent <button> per building, bubble,
   crate, truck and pile, moved by script whenever the camera moves. The HUD, the side sheet, the run overlays and the
   cards are DOM on top; #fx is a canvas above everything for flyers. Sizes per viewport are CSS variables (SPEC 8.3). */
:root {
  --bg: #07090d;
  --panel: rgba(12, 15, 21, .88);
  --panel-solid: #0f131a;
  --ink: #ece8df;
  --ink-soft: #a7a9a6;
  --rule: rgba(236, 232, 223, .14);
  --orange: #ff7a2f;
  --red: #ff4b2f;
  --blood: #c3272b;
  --green: #3bd16f;
  --sodium: #ffc66b;
  --c-scrap: #c9cdd2;
  --c-food: #a6d86e;
  --c-meds: #ff7b7b;
  --c-bat: #ffd84a;
  --c-bp: #78bcff;
  --f-cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --pad-l: max(8px, var(--safe-l));
  --pad-r: max(8px, var(--safe-r));
  --pad-b: max(8px, var(--safe-b));
  /* 568 x 320 baseline (SPEC 8.3 table) */
  --top-h: 44px; --chip-h: 30px; --chip-fs: 16px; --goal-h: 44px; --goal-w: 190px;
  --play-h: 56px; --play-w: 112px; --sheet-w: 260px; --fs: 13px; --fs-h: 20px;
  --row-h: 50px; --load-w: 272px;
  color-scheme: dark;
}
@media (min-width: 640px) { :root { --chip-h: 32px; --chip-fs: 17px; --goal-w: 230px; --play-h: 58px; --play-w: 150px; --sheet-w: 300px } }
@media (min-height: 370px) { :root { --row-h: 60px } }
@media (min-height: 386px) { :root { --row-h: 64px } }
@media (min-width: 800px) and (min-height: 380px) {
  :root { --top-h: 48px; --chip-fs: 18px; --goal-h: 48px; --goal-w: 260px; --play-h: 64px; --play-w: 180px; --sheet-w: 340px; --fs: 14px; --fs-h: 22px; --load-w: 360px }
}
@media (min-width: 900px) and (min-height: 420px) { :root { --chip-h: 34px; --goal-w: 280px; --play-w: 190px; --sheet-w: 360px } }
@media (min-width: 1100px) and (min-height: 600px) {
  :root { --top-h: 56px; --chip-h: 36px; --chip-fs: 20px; --goal-h: 52px; --goal-w: 320px; --play-h: 72px; --play-w: 210px; --sheet-w: 400px; --fs: 15px; --fs-h: 24px; --row-h: 72px; --load-w: 400px }
}
* { box-sizing: border-box }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 400 var(--fs)/1.35 var(--f-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; -webkit-user-select: none; user-select: none; touch-action: manipulation; cursor: pointer }
a { color: inherit }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px }
[hidden] { display: none !important }
svg.i { width: 1em; height: 1em; fill: currentColor; flex: none }
.tab { font-variant-numeric: tabular-nums }

#scene, #fx { position: fixed; inset: 0; width: 100%; height: 100%; display: block }
#scene { z-index: 0; background: var(--bg) }
#fx { z-index: 30; pointer-events: none }
#hot { position: fixed; inset: 0; z-index: 1; pointer-events: none }
.hs {
  position: absolute; left: 0; top: 0; margin: 0; padding: 0; border: 0; border-radius: 12px;
  background: transparent; pointer-events: auto; min-width: 44px; min-height: 44px;
}
.hs:focus-visible { outline: 2px solid var(--sodium); outline-offset: 0 }
#probe { position: fixed; visibility: hidden; pointer-events: none; left: 0; top: 0; width: 0; height: 0;
  padding: 0 var(--safe-r) var(--safe-b) var(--safe-l) }

/* ---------- top bar ---------- */
.topbar {
  position: fixed; z-index: 4; top: 0; left: 0; right: 0; height: calc(var(--top-h) + var(--safe-t));
  padding: var(--safe-t) var(--pad-r) 0 var(--pad-l);
  display: flex; align-items: center; gap: 6px; pointer-events: none;
}
.topbar > * { pointer-events: auto }
.topbar .spacer { flex: 1 1 0; min-width: 0; pointer-events: none }
.iconbtn {
  width: 44px; height: 44px; flex: none; border: 0; border-radius: 12px; padding: 0;
  display: grid; place-items: center; text-decoration: none;
  background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule);
  font: 800 15px/1 var(--f-cond); letter-spacing: .08em;
}
.iconbtn svg { width: 22px; height: 22px; fill: currentColor }
.iconbtn:hover { color: var(--orange) }
#btnLab { opacity: .6; font-size: 14px }
.chip {
  position: relative; flex: none; height: var(--chip-h); min-width: 76px; padding: 0 9px 0 6px; border-radius: 9px;
  display: flex; align-items: center; gap: 5px;
  background: var(--panel); box-shadow: inset 0 0 0 1px var(--rule);
  font: 700 var(--chip-fs)/1 var(--f-cond); font-variant-numeric: tabular-nums; letter-spacing: .02em; white-space: nowrap;
  transition: transform .12s;
}
.chip svg { width: 18px; height: 18px; fill: currentColor; flex: none }
.chip[data-res="scrap"] svg { color: var(--c-scrap) }
.chip[data-res="food"] svg { color: var(--c-food) }
.chip[data-res="meds"] svg { color: var(--c-meds) }
.chip[data-res="surv"] { min-width: 64px }
.chip[data-res="surv"] svg { color: var(--sodium) }
.chip .cap { position: absolute; left: 6px; right: 6px; bottom: 3px; height: 2px; border-radius: 1px; background: rgba(236,232,223,.12); overflow: hidden }
.chip .cap i { position: absolute; inset: 0; background: rgba(236,232,223,.45); transform-origin: 0 50%; transform: scaleX(0) }
.chip.full b { color: var(--orange) }
.chip.full .cap i { background: var(--orange) }
.chip.gulp { transform: scale(1.18) }
.chip.pulse { box-shadow: inset 0 0 0 2px var(--sodium) }
.chip.reveal { animation: chipIn .45s cubic-bezier(.2,1.4,.4,1) }
@keyframes chipIn { from { transform: translateY(-140%); opacity: 0 } to { transform: none; opacity: 1 } }
.shake { animation: shake .2s linear }
@keyframes shake { 0%,100% { translate: 0 } 17% { translate: -4px } 33% { translate: 4px } 50% { translate: -4px } 67% { translate: 4px } 83% { translate: -4px } }
.flashred { box-shadow: inset 0 0 0 2px var(--red) !important; color: var(--red) }
.batbtn { flex: none; height: 44px; min-width: 78px; padding: 0; border: 0; background: none; display: grid; align-items: center }
.batbtn .chip { min-width: 78px; padding-right: 4px }
.batbtn .chip svg { color: var(--c-bat) }
.batbtn .plus { margin-left: auto; width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: rgba(255,216,74,.18); color: var(--c-bat); font: 800 16px/1 var(--f-cond) }

/* ---------- bottom controls ---------- */
.bl {
  position: fixed; z-index: 4; left: var(--pad-l); bottom: var(--pad-b); height: var(--play-h);
  display: flex; align-items: center; gap: 6px; pointer-events: none;
}
.bl > * { pointer-events: auto }
.goal {
  position: relative; height: var(--goal-h); max-width: var(--goal-w); min-width: 120px; padding: 0 12px 0 8px; border: 0; border-radius: 12px;
  display: flex; align-items: center; gap: 8px; text-align: left; overflow: hidden;
  background: var(--panel); box-shadow: inset 0 0 0 1px rgba(255,198,107,.45);
}
.goal svg { width: 20px; height: 20px; fill: var(--sodium); flex: none }
.goal .gt { display: grid; min-width: 0; line-height: 1.12 }
.goal .g1 { font: 700 calc(var(--fs) + 2px)/1.1 var(--f-cond); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.goal .g2 { font: 500 11px/1.2 var(--f-body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.goal .g2:empty { display: none }
.goal .bar { position: absolute; left: 8px; right: 8px; bottom: 3px; height: 2px; background: rgba(255,198,107,.15); border-radius: 1px; overflow: hidden }
.goal .bar i { position: absolute; inset: 0; background: var(--sodium); transform-origin: 0 50%; transform: scaleX(0) }
.goal.collapsed { min-width: 44px; width: 44px; padding: 0; justify-content: center }
.goal.collapsed .gt, .goal.collapsed .bar { display: none }
.goal.done { box-shadow: inset 0 0 0 2px var(--green) }
.play {
  position: fixed; z-index: 4; right: var(--pad-r); bottom: var(--pad-b); width: var(--play-w); height: var(--play-h);
  border: 0; border-radius: 14px; padding: 0 8px; display: grid; place-content: center; gap: 2px; text-align: center;
  background: var(--orange); color: #1a0b03; box-shadow: 0 6px 30px rgba(255, 122, 47, .35);
  font: 800 calc(var(--fs-h) - 1px)/1 var(--f-cond); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.play:hover { background: #ff8d4a }
.play .pl2 { font: 700 12px/1 var(--f-cond); letter-spacing: .1em; opacity: .75 }
.play.pulse { animation: playPulse 1.1s ease-in-out infinite }
.play.rise { animation: rise .45s cubic-bezier(.2,1.3,.4,1) }
@keyframes playPulse { 50% { box-shadow: 0 0 0 7px rgba(255,122,47,.25), 0 6px 30px rgba(255,122,47,.5) } }
@keyframes rise { from { transform: translateY(120%) } to { transform: none } }

body.sheet-left .bl { left: calc(var(--pad-l) + var(--sheet-w) + 8px) }

/* ---------- side sheet ---------- */
.sheet {
  position: fixed; z-index: 5; top: calc(var(--top-h) + var(--safe-t) + 4px); bottom: var(--pad-b); width: var(--sheet-w);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; border-radius: 14px; overflow: hidden;
  background: var(--panel); box-shadow: 0 10px 40px rgba(0,0,0,.55), inset 0 0 0 1px var(--rule);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
.sheet.right { right: var(--pad-r) }
.sheet.left { left: var(--pad-l) }
.sheet.swap .sbody, .sheet.swap .shead { animation: xfade .12s linear }
@keyframes xfade { from { opacity: .2 } to { opacity: 1 } }
.shead { display: flex; align-items: center; gap: 8px; padding: 0 0 0 12px; min-height: 44px; border-bottom: 1px solid var(--rule) }
.shead h2 { margin: 0; font: 800 var(--fs-h)/1 var(--f-cond); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.shead .lv { font: 700 13px/1 var(--f-cond); letter-spacing: .12em; color: var(--sodium); white-space: nowrap }
.shead .x { margin-left: auto; background: none; box-shadow: none; flex: none }
.sbody { overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding: 6px 12px 10px }
.sbody p { margin: 4px 0 }
.desc { color: var(--ink-soft); font-size: 12px }
.erow { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--rule); white-space: nowrap }
.erow span:first-child { color: var(--ink-soft); overflow: hidden; text-overflow: ellipsis }
.erow b { font: 700 calc(var(--fs) + 1px)/1.2 var(--f-cond); font-variant-numeric: tabular-nums; letter-spacing: .02em }
.erow b em { font-style: normal; color: var(--green) }
.note { font-size: 12px; color: var(--sodium) }
.runrow { margin: 6px 0 2px; padding: 4px 8px; border-radius: 8px; background: rgba(255,122,47,.14); color: var(--orange); font: 700 12.5px/1.25 var(--f-cond); letter-spacing: .04em }
.costs { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 2px }
.cost { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 7px; background: rgba(236,232,223,.07); font: 700 14px/1 var(--f-cond); font-variant-numeric: tabular-nums }
.cost svg { width: 14px; height: 14px; fill: currentColor }
.cost.ok { color: var(--ink) } .cost.ok::after { content: "✓"; color: var(--green); font-size: 12px }
.cost.no { color: var(--red); box-shadow: inset 0 0 0 1px rgba(255,75,47,.5) }
.panel { margin-top: 8px }
.panel h3 { margin: 10px 0 4px; font: 700 12px/1 var(--f-cond); letter-spacing: .18em; text-transform: uppercase; color: var(--orange) }
.li { display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 2px 0; border-bottom: 1px solid var(--rule) }
.li .grow { flex: 1 1 auto; min-width: 0; display: grid }
.li .t { font: 700 calc(var(--fs) + 1px)/1.15 var(--f-cond); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .s { font-size: 11.5px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.li .s.red, .red { color: var(--red) }
.li .s.green, .green { color: var(--green) }
.li > svg { width: 22px; height: 22px; fill: var(--ink-soft) }
.mini {
  flex: none; min-width: 44px; height: 44px; padding: 0 10px; border: 0; border-radius: 10px;
  background: rgba(236,232,223,.1); box-shadow: inset 0 0 0 1px var(--rule);
  font: 800 14px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
}
.mini.go { background: var(--green); color: #06180c; box-shadow: none }
.mini.bat { background: rgba(255,216,74,.16); color: var(--c-bat); box-shadow: inset 0 0 0 1px rgba(255,216,74,.5) }
.mini.primary { background: var(--orange); color: #1a0b03; box-shadow: none }
.mini.off { opacity: .45 }
.track { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin: 6px 0 }
.track i { height: 22px; border-radius: 4px; display: grid; place-items: center; font: 700 11px/1 var(--f-cond); font-style: normal; background: rgba(236,232,223,.07); color: var(--ink-soft) }
.track i.on { background: rgba(255,198,107,.85); color: #1b1203 }
.track i.next { box-shadow: inset 0 0 0 1px var(--sodium); color: var(--sodium) }
.check { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; font-size: 12.5px }
.check span b { font-family: var(--f-cond); font-weight: 700 }
.sact { padding: 6px 8px 8px; border-top: 1px solid var(--rule); background: rgba(8,10,14,.6) }
.act {
  width: 100%; min-height: 44px; height: 44px; border: 0; border-radius: 12px; padding: 0 10px;
  font: 800 calc(var(--fs) + 4px)/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase;
  background: rgba(236,232,223,.1); box-shadow: inset 0 0 0 1px var(--rule); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.act.primary { background: var(--orange); color: #1a0b03; box-shadow: 0 4px 18px rgba(255,122,47,.3) }
.act.go { background: var(--green); color: #06180c }
.act.bat { background: rgba(255,216,74,.2); color: var(--c-bat); box-shadow: inset 0 0 0 1px rgba(255,216,74,.6) }
.act.confirm { background: var(--c-bat); color: #1b1603 }
.act.blocked { color: var(--ink-soft); text-transform: none; letter-spacing: .02em; font-weight: 700 }
.act.short { font-size: calc(var(--fs) + 1px); text-transform: none; letter-spacing: .01em }

/* ---------- FTUE coach ---------- */
.spot { position: fixed; inset: 0; z-index: 2; pointer-events: none; transition: opacity .3s }
.coach {
  position: fixed; z-index: 26; left: 0; top: 0; max-width: min(300px, 70vw); padding: 8px 12px 9px; border-radius: 12px;
  background: rgba(236,232,223,.96); color: #15120d; pointer-events: none; box-shadow: 0 8px 30px rgba(0,0,0,.5);
  font: 700 16px/1.2 var(--f-cond); letter-spacing: .02em;
}
.coach b { display: block; font: 800 11px/1 var(--f-cond); letter-spacing: .2em; color: #b34d12; margin-bottom: 3px }
.hand { position: fixed; z-index: 27; left: 0; top: 0; width: 40px; height: 40px; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,.6)) }
.hand svg { width: 40px; height: 40px; fill: #fff; stroke: #15120d; stroke-width: 1; animation: bob .9s ease-in-out infinite }
@keyframes bob { 50% { transform: translate(-4px, -7px) } }

/* ---------- banners and toasts ---------- */
.banners { position: fixed; z-index: 9; left: 50%; top: calc(var(--top-h) + var(--safe-t) + 6px); transform: translateX(-50%); display: grid; justify-items: center; gap: 4px; pointer-events: none; width: max-content; max-width: min(92vw, 560px) }
.banner {
  padding: 6px 14px 7px; border-radius: 10px; background: rgba(8,10,14,.88); box-shadow: inset 0 0 0 1px var(--rule);
  font: 800 16px/1.15 var(--f-cond); letter-spacing: .06em; text-align: center; text-transform: uppercase;
  animation: bannerIn .25s ease-out;
}
.banner small { display: block; font: 700 12px/1.2 var(--f-cond); letter-spacing: .06em; text-transform: none }
.banner.done { background: rgba(59, 209, 111, .94); color: #06180c }
.banner.done small { color: #3a1603 }
.banner .runl { color: #b33f05 }
.banner.warn { background: rgba(150, 18, 14, .9); color: #fff }
.banner.info { text-transform: none; letter-spacing: .02em; font-weight: 700 }
@keyframes bannerIn { from { transform: translateY(-8px); opacity: 0 } }
.toast {
  position: fixed; z-index: 40; left: 50%; bottom: calc(var(--pad-b) + var(--play-h) + 10px); transform: translate(-50%, 8px);
  padding: 9px 14px; border-radius: 12px; background: rgba(236, 232, 223, .96); color: #111; font: 700 15px/1.2 var(--f-cond); letter-spacing: .03em;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; max-width: 86vw; text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0) }

/* ---------- overlays (route + loadout, run, result) ---------- */
.overlay {
  position: fixed; inset: 0; z-index: 10; overflow: hidden;
  padding: 8px var(--pad-r) var(--pad-b) var(--pad-l);
  background: rgba(5, 7, 10, .95);
}
.arming * { pointer-events: none !important }
.ohead { display: flex; align-items: center; gap: 8px; height: 44px }
.ohead h2, .kick + h2 { margin: 0; font: 800 calc(var(--fs-h) + 2px)/1 var(--f-cond); letter-spacing: .02em; text-transform: uppercase; white-space: nowrap }
.kick { margin: 0; font: 700 12px/1 var(--f-cond); letter-spacing: .26em; text-transform: uppercase; color: var(--orange) }
.bigbtn {
  position: fixed; z-index: 12; right: var(--pad-r); bottom: var(--pad-b); width: var(--play-w); height: var(--play-h);
  border: 0; border-radius: 14px; padding: 0 8px; display: grid; place-content: center; gap: 3px; text-align: center;
  background: var(--orange); color: #1a0b03; box-shadow: 0 6px 30px rgba(255, 122, 47, .35);
  font: 800 min(var(--fs-h), calc(var(--play-w) / 7.4))/1 var(--f-cond); letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
}
.bigbtn small { font: 700 11px/1 var(--f-cond); letter-spacing: .08em; opacity: .7 }
.bigbtn.green { background: var(--green); color: #06180c; box-shadow: 0 6px 30px rgba(59,209,111,.3) }

#routes { display: grid; grid-template-columns: minmax(0, 1fr) var(--load-w); column-gap: 8px }
.rcol { display: grid; grid-template-rows: 44px repeat(5, var(--row-h)); min-width: 0 }
.route {
  position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 8px;
  border: 0; border-bottom: 1px solid var(--rule); padding: 0 10px 0 12px; text-align: left; background: none; min-width: 0; min-height: 44px;
}
.route.sel { background: rgba(255,122,47,.13); box-shadow: inset 3px 0 0 var(--orange); border-radius: 8px }
.route.locked { opacity: .5 }
.route .rn { font: 800 calc(var(--fs) + 4px)/1.05 var(--f-cond); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.route .rm { display: flex; align-items: center; gap: 7px; font: 600 11.5px/1.2 var(--f-cond); letter-spacing: .03em; color: var(--ink-soft); white-space: nowrap; overflow: hidden }
.route .rd { display: none; font-size: 11px; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
@media (min-height: 370px) { .route .rd { display: block } }
.danger { display: inline-flex; gap: 2px }
.danger i { width: 4px; height: 11px; border-radius: 1px; background: rgba(236,232,223,.18) }
.danger i.on { background: var(--red) }
.route .haul { display: inline-flex; gap: 2px; align-items: center }
.route .haul svg { width: 12px; height: 12px }
.route .odds { font: 800 calc(var(--fs-h) + 2px)/1 var(--f-cond); font-variant-numeric: tabular-nums; text-align: right }
.route .odds small { display: block; font: 700 10px/1.2 var(--f-cond); letter-spacing: .08em; color: var(--sodium) }
.lcol { display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-y: auto; overscroll-behavior: contain; padding-bottom: calc(var(--play-h) + 6px) }
.seg { display: flex; gap: 3px; background: rgba(0,0,0,.4); border-radius: 12px; padding: 0; flex: none }
.seg button { flex: 1; min-width: 44px; height: 44px; border: 0; border-radius: 10px; background: none; font: 800 14px/1 var(--f-cond); letter-spacing: .06em; text-transform: uppercase; display: grid; place-items: center; gap: 1px; padding: 0 4px }
.seg button svg { width: 26px; height: 14px; fill: currentColor }
.seg button[aria-checked="true"] { background: var(--orange); color: #1a0b03 }
.items { display: flex; gap: 4px; flex: none }
.item {
  flex: 1; min-width: 44px; height: 44px; border: 0; border-radius: 10px; padding: 0 6px; display: flex; align-items: center; gap: 5px;
  background: rgba(236,232,223,.07); box-shadow: inset 0 0 0 1px var(--rule); text-align: left;
}
.item svg { width: 20px; height: 20px; fill: currentColor; flex: none }
.item .it { display: grid; line-height: 1.05; min-width: 0 }
.item .it b { font: 800 13px/1 var(--f-cond); letter-spacing: .04em; white-space: nowrap }
.item .it small { font: 700 11px/1.1 var(--f-cond); color: var(--green); white-space: nowrap }
.item .n { margin-left: auto; font: 800 13px/1 var(--f-cond); color: var(--ink-soft) }
.item[aria-pressed="true"] { background: rgba(59,209,111,.18); box-shadow: inset 0 0 0 2px var(--green) }
.item.none { opacity: .45 }
.runner { flex: none; height: 44px; border: 0; border-radius: 10px; padding: 0 10px; display: flex; align-items: center; gap: 8px; background: rgba(236,232,223,.07); box-shadow: inset 0 0 0 1px var(--rule); text-align: left }
.runner svg { width: 18px; height: 18px; fill: var(--sodium) }
.runner b { font: 800 15px/1 var(--f-cond); letter-spacing: .04em }
.runner .s { font: 600 12px/1 var(--f-cond); color: var(--ink-soft) }
.runner .s.red { color: var(--red) }
.runner .cyc { margin-left: auto; font: 700 11px/1 var(--f-cond); letter-spacing: .1em; color: var(--ink-soft) }
.summary { flex: none; height: 20px; font: 600 12px/20px var(--f-cond); letter-spacing: .03em; color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bigodds { flex: none; display: flex; align-items: baseline; gap: 8px; height: 32px; white-space: nowrap; overflow: hidden }
.bigodds b { font: 800 32px/1 var(--f-cond); font-variant-numeric: tabular-nums }
.bigodds span { font: 700 12px/1.1 var(--f-cond); letter-spacing: .05em; color: var(--ink-soft) }
.bigodds span.tut { color: var(--green) }
details.payload { flex: none; border-radius: 8px; background: rgba(236,232,223,.05); box-shadow: inset 0 0 0 1px var(--rule) }
details.payload summary { height: 28px; padding: 0 10px; display: flex; align-items: center; gap: 6px; cursor: pointer; list-style: none; font: 700 12px/1 var(--f-cond); letter-spacing: .06em; color: var(--sodium); white-space: nowrap; overflow: hidden }
details.payload summary::-webkit-details-marker { display: none }
details.payload summary::before { content: "▸"; color: var(--ink-soft) }
details.payload[open] summary::before { content: "▾" }
details.payload pre { margin: 0; max-height: 46vh; overflow: auto; padding: 6px 10px 8px; font: 500 10.5px/1.35 ui-monospace, Menlo, Consolas, monospace; color: #cfd6c8; white-space: pre; -webkit-user-select: text; user-select: text; touch-action: pan-x pan-y }
details.payload .pnote { margin: 0; padding: 0 10px 8px; font-size: 11px; color: var(--ink-soft) }

/* run screen */
#runscr { display: grid; grid-template-rows: auto 1fr auto; padding-top: max(10px, var(--safe-t)) }
.rhead { display: flex; align-items: flex-start; gap: 10px }
.rhead .grow { flex: 1 1 auto; display: grid; gap: 6px; min-width: 0 }
.strip { position: relative; height: 70px; margin: 6px 6px 0; align-self: center }
.strip .road { position: absolute; left: 0; right: 0; top: 30px; height: 10px; border-radius: 5px; background: rgba(236,232,223,.08); box-shadow: inset 0 0 0 1px var(--rule) }
.strip .done { position: absolute; left: 0; top: 30px; height: 10px; border-radius: 5px; background: rgba(255,198,107,.35); transform-origin: 0 50%; width: 100% }
.strip .room { position: absolute; top: 18px; width: 30px; height: 34px; border-radius: 5px; background: rgba(59,209,111,.22); box-shadow: inset 0 0 0 2px var(--green) }
.strip .room.a { left: -6px } .strip .room.b { right: -6px }
.strip .gate { position: absolute; top: 12px; left: 75%; width: 4px; height: 46px; margin-left: -2px; background: var(--red); border-radius: 2px }
.strip .gate::after { content: "GATE"; position: absolute; top: -12px; left: 50%; transform: translateX(-50%); font: 700 10px/1 var(--f-cond); letter-spacing: .15em; color: var(--red) }
.strip .mk { position: absolute; top: 44px; width: 2px; height: 8px; margin-left: -1px; background: rgba(236,232,223,.4) }
.strip .mk.horde { background: var(--orange); height: 12px } .strip .mk.cache { background: var(--c-food) }
.strip .dot { position: absolute; top: 25px; left: 0; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--sodium); box-shadow: 0 0 14px rgba(255,198,107,.9), 0 0 0 3px rgba(0,0,0,.6) }
.strip .dot.dead { background: var(--red); box-shadow: 0 0 14px rgba(255,75,47,.9) }
.hp {
  position: relative; width: min(420px, 70vw); height: 18px; border-radius: 4px; overflow: hidden; margin: 8px 6px 0;
  background: rgba(0, 0, 0, .55); box-shadow: inset 0 0 0 1px var(--rule);
}
.hp-fill, .hp-temp { position: absolute; inset: 0; transform-origin: 0 50%; transition: transform .25s }
.hp-temp { background: repeating-linear-gradient(135deg, rgba(255,255,255,.55) 0 5px, rgba(255,255,255,.25) 5px 10px) }
.hp-fill { background: linear-gradient(90deg, #2eb35e, var(--green)) }
.hp-fill.low { background: linear-gradient(90deg, #b3261e, var(--red)) }
.hp span { position: absolute; inset: 0 6px; display: flex; align-items: center; justify-content: space-between; font: 700 13px/1 var(--f-cond); letter-spacing: .06em; text-shadow: 0 1px 2px #000 }
.ticker { align-self: end; display: grid; gap: 3px; padding: 0 0 4px 4px; max-width: calc(100% - var(--play-w) - 20px); min-height: 84px; align-content: end }
.ticker p { margin: 0; font: 700 calc(var(--fs) + 3px)/1.2 var(--f-cond); letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; animation: tickIn .2s ease-out }
.ticker p.old { opacity: .55 }
.ticker p.horde { color: var(--orange) } .ticker p.sw { color: var(--red) } .ticker p.good { color: var(--green) }
.ticker p.end { font-size: calc(var(--fs-h) + 6px); text-transform: none }
@keyframes tickIn { from { transform: translateY(8px); opacity: 0 } }
.flashred-bg { animation: redflash .5s ease-out }
@keyframes redflash { from { box-shadow: inset 0 0 0 999px rgba(195,39,43,.45) } }

/* result card */
#result { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); column-gap: 14px; overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; padding-top: max(10px, var(--safe-t)) }
.rleft, .rright { display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.rright { padding-bottom: calc(var(--play-h) + 10px) }
.rtitle { margin: 0; font: 800 clamp(30px, 6vw, 46px)/.95 var(--f-cond); text-transform: none; letter-spacing: -.005em }
.rtitle.win { color: var(--green) } .rtitle.loss { color: var(--red) }
.where { margin: 0; color: var(--ink-soft); font-size: 12.5px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; margin: 0 }
.stats div { border-top: 1px solid var(--rule); padding-top: 4px; min-width: 0 }
.stats dt { font: 600 11px/1.2 var(--f-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); white-space: nowrap }
.stats dd { margin: 0; font: 800 22px/1.1 var(--f-cond); font-variant-numeric: tabular-nums }
.loot { display: grid; gap: 0 }
.lrow { display: flex; align-items: center; gap: 8px; min-height: 24px; border-bottom: 1px solid var(--rule); font: 600 13px/1.2 var(--f-cond); letter-spacing: .03em; white-space: nowrap }
.lrow .k { color: var(--ink-soft); min-width: 64px; text-transform: uppercase; font-size: 11px; letter-spacing: .12em }
.lrow .v { display: flex; gap: 10px; flex-wrap: wrap; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums }
.lrow .v span { display: inline-flex; align-items: center; gap: 3px }
.lrow .v svg { width: 14px; height: 14px }
.lrow.mom { white-space: normal; color: var(--sodium); font-size: 12px }
.lrow.wrap { white-space: normal; padding: 3px 0 } .lrow.wrap .v { font-size: 14px }
.lrow.warn { color: var(--red); white-space: normal }
.c-scrap { color: var(--c-scrap) } .c-food { color: var(--c-food) } .c-meds { color: var(--c-meds) } .c-bat { color: var(--c-bat) } .c-bp { color: var(--c-bp) }
.person { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 12px; background: rgba(255,198,107,.1); box-shadow: inset 0 0 0 1px rgba(255,198,107,.4) }
.person .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; background: #3b2f22; color: var(--sodium); font: 800 20px/1 var(--f-cond) }
.person b { font: 800 18px/1 var(--f-cond); letter-spacing: .04em; text-transform: uppercase }
.person p { margin: 2px 0 0; font-size: 12px; color: var(--ink-soft); white-space: normal }
.person .works { color: var(--sodium); font: 700 12px/1.2 var(--f-cond); letter-spacing: .06em }
.hurt { display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.hurt span { flex: 1 1 140px; font: 700 14px/1.2 var(--f-cond) }
.hint { padding: 8px 10px; border-radius: 10px; background: rgba(236,232,223,.07); font: 700 14px/1.25 var(--f-cond); letter-spacing: .02em; border: 0; text-align: left; min-height: 44px }
.hint.tap { box-shadow: inset 0 0 0 1px rgba(255,198,107,.5); color: var(--sodium) }

/* ---------- cards (CL beat, person, welcome back, other tab) ---------- */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 10px var(--pad-r) var(--pad-b) var(--pad-l); background: rgba(5,7,10,.5) }
.modal.top { place-items: start center; padding-top: calc(var(--top-h) + var(--safe-t) + 6px); background: rgba(5,7,10,.25) }
.modal.top .mcard { width: min(380px, 100%); gap: 4px; padding: 10px 14px }
.modal.top .mcard h2 { font-size: calc(var(--fs-h) + 2px) }
.mcard {
  width: min(440px, 100%); max-height: 100%; overflow-y: auto; overscroll-behavior: contain; padding: 14px 16px 12px; border-radius: 16px;
  background: var(--panel-solid); box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 0 0 1px var(--rule);
  display: grid; gap: 8px; animation: cardIn .3s cubic-bezier(.2,1.3,.4,1);
}
@keyframes cardIn { from { transform: scale(.9); opacity: 0 } }
.mcard h2 { margin: 0; font: 800 calc(var(--fs-h) + 6px)/1 var(--f-cond); text-transform: uppercase; letter-spacing: .02em }
.mcard h2.cl { color: var(--sodium) }
.mcard p { margin: 0 }
.mcard .rows { display: grid; gap: 0 }
.mcard .rows div { padding: 4px 0; border-bottom: 1px solid var(--rule); font: 600 14px/1.2 var(--f-cond); letter-spacing: .02em; animation: rowIn .3s both }
@keyframes rowIn { from { opacity: 0; transform: translateX(-10px) } }
.btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap }
.btn {
  min-height: 44px; border: 0; border-radius: 12px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font: 800 17px/1 var(--f-cond); letter-spacing: .08em; text-transform: uppercase;
  background: rgba(236,232,223,.1); box-shadow: inset 0 0 0 1px var(--rule);
}
.btn.primary { background: var(--orange); color: #1a0b03; box-shadow: 0 6px 24px rgba(255,122,47,.3) }
.btn.go { background: var(--green); color: #06180c }

/* portrait (the full fallback comes later): never scroll sideways */
@media (orientation: portrait) and (max-width: 600px) {
  .topbar { flex-wrap: wrap; height: auto; row-gap: 4px; padding-top: max(6px, var(--safe-t)) }
  .chip { min-width: 0 }
  #routes { grid-template-columns: minmax(0, 1fr); overflow-y: auto }
  #result { grid-template-columns: minmax(0, 1fr) }
}
@media (prefers-reduced-motion: reduce) {
  .chip, .toast, .hp-fill, .hp-temp { transition: none }
  .hand svg, .play.pulse { animation: none }
}

  <div class="chip" id="c-scrap" data-res="scrap" role="img" aria-label="Scrap" hidden><svg aria-hidden="true"><use href="#i-scrap"/></svg><b class="tab">0</b><span class="cap"><i></i></span></div>
  <div class="chip" id="c-food" data-res="food" role="img" aria-label="Food" hidden><svg aria-hidden="true"><use href="#i-food"/></svg><b class="tab">0</b><span class="cap"><i></i></span></div>
  <div class="chip" id="c-meds" data-res="meds" role="img" aria-label="Meds" hidden><svg aria-hidden="true"><use href="#i-meds"/></svg><b class="tab">0</b><span class="cap"><i></i></span></div>
  <div class="chip" id="c-surv" data-res="surv" role="img" aria-label="Survivors" hidden><svg aria-hidden="true"><use href="#i-surv"/></svg><b class="tab">2/3</b></div>
  <span class="spacer"></span>
  <button class="batbtn" id="c-batbtn" type="button" aria-label="Batteries: open the free test shop" hidden><span class="chip" id="c-bat" data-res="bat"><svg aria-hidden="true"><use href="#i-bat"/></svg><b class="tab">0</b><span class="plus" aria-hidden="true">+</span></span></button>
  <button class="iconbtn" id="btnLab" type="button" aria-label="Open the camp lab">LAB</button>
</header>

<div class="bl" id="bl">
  <button class="iconbtn" id="btnSound" type="button" aria-label="Sound is on: tap to mute"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-snd"/></svg></button>
  <button class="goal" id="goal" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-flag"/></svg><span class="gt"><span class="g1"></span><span class="g2"></span></span><span class="bar"><i></i></span></button>
</div>
<button class="play" id="play" type="button" hidden><span class="pl1">GO ON A RUN</span><span class="pl2">Daily ○○○</span></button>

<aside class="sheet right" id="sheet" role="dialog" aria-labelledby="sheetName" hidden>
  <div class="shead"><h2 id="sheetName">Campfire</h2><span class="lv" id="sheetLv"></span><button class="iconbtn x" id="sheetX" type="button" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-close"/></svg></button></div>
  <div class="sbody" id="sheetBody"></div>
  <div class="sact"><button class="act" id="sheetAct" type="button">BUILD</button></div>
</aside>

<div id="coach" class="coach" role="status" aria-live="polite" hidden><b>NOOR</b><span id="coachLine"></span></div>
<div id="hand" class="hand" aria-hidden="true" hidden><svg viewBox="0 0 24 24"><use href="#i-hand"/></svg></div>
<div id="banners" class="banners" role="status" aria-live="polite"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<section id="routes" class="overlay" aria-label="Choose a run" hidden>
  <div class="rcol" id="routeList"></div>
  <div class="lcol" id="loadout"></div>
</section>
<button class="bigbtn" id="start" type="button" hidden>START RUN<small>simulated</small></button>

<section id="runscr" class="overlay" aria-label="Simulated run" hidden>
  <div class="rhead">
    <div class="grow"><p class="kick">Simulated run</p><h2 id="runName">Corner Store</h2></div>
    <button class="iconbtn" id="runSkip" type="button" aria-label="Skip to the end">&gt;&gt;</button>
  </div>
  <div>
    <div class="strip" id="strip"><div class="road"></div><div class="done" id="stripDone"></div><div class="room a"></div><div class="room b"></div><div class="gate"></div><div id="stripMarks"></div><div class="dot" id="runDot"></div></div>
    <div class="hp" role="img" aria-label="Health"><div class="hp-temp" id="hpTemp"></div><div class="hp-fill" id="hpFill"></div><span><b id="hpNum">100</b><small id="hpTag"></small></span></div>
  </div>
  <div class="ticker" id="ticker" aria-live="polite"></div>
</section>

<section id="result" class="overlay" aria-label="Run result" hidden>
  <div class="rleft" id="resLeft"></div>
  <div class="rright" id="resRight"></div>
</section>
<button class="bigbtn green" id="resultBack" type="button" hidden>BACK TO CAMP</button>

<div id="modal" class="modal" hidden><div class="mcard" id="mcard" role="dialog" aria-modal="true"></div></div>

<canvas id="fx" aria-hidden="true"></canvas>

<script src="data.js"></script>
<script src="run.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
<script src="ui.js"></script>
</body>
</html>
