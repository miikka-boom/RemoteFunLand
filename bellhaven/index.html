<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bellhaven: a minimalist isometric city-building metagame prototype for Two Thumbs Left. Build a little town, choose who goes out tonight, and remember everyone.">
<meta name="theme-color" content="#bfcac8">
<title>Bellhaven</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&display=swap">
<style>
/* Bellhaven page: palette tokens (SPEC 8.15), the HUD layouts of 8.3 (844 / 667 / 568 / desktop / portrait), sheets
 * (8.4, 8.11, 8.12), the build tray (8.5), overlays (8.10, 8.13), toasts and the portrait card (8.14).
 * Geometry comes from ui.js as custom properties: --k (UI scale, desktop up to 1.4), --pl / --pr (side pads with the
 * safe areas), --pt (top bar y), --pb (bottom anchor), --sht (sheet top), --shw (sheet width), --abl (action bar x),
 * plus classes on <html>: tb-wide | tb-compact | tb-rows, bb-wide | bb-mid | bb-compact, portrait, rm (reduced
 * motion), placing, sheet-open, tray-open, ov-open, sel. Every size below is written in --u (1 px x the UI scale). */
:root {
  --sky-top: #dce6e4; --sky-bot: #bfcac8; --haze: rgba(214,222,220,.72);
  --asphalt-a: #b4babc; --asphalt-b: #adb3b6; --crack: #9aa1a4; --road-stripe: #ece6d2;
  --ruin-top: #c9cfd1; --ruin-left: #b2b9bc; --ruin-right: #9ea5a9; --ruin-window: #8e959a;
  --rubble-top: #b0b5b8; --rubble-left: #959b9f; --rubble-right: #7d8387;
  --grass-a: #a7d07f; --grass-b: #9dc876; --grid: rgba(60,90,40,.10);
  --soil-left: #8b6a4c; --soil-right: #735740; --plaza-a: #ece2cb; --plaza-b: #e4d8be;
  --fence: #f7f2e8; --fence-shadow: #d8cfbf; --gate-post: #fbf7ee; --shadow: rgba(29,42,32,.13);
  --window-lit: #ffd98a; --window-lit-side: #f2c472; --window-dark: #6d7f91; --window-dark-side: #5d6e7f;
  --door: #8a5a3c; --smoke: rgba(246,243,236,.85);
  --panel: rgba(18,22,28,.86); --panel-solid: #12161c; --line: rgba(255,255,255,.09);
  --ink: #f3efe6; --ink-soft: #a9aeb3; --accent: #ff7a2f; --accent-dark: #d95f1c;
  --good: #3bd16f; --bad: #ff4b2f; --spark: #4fd8ff; --timer: #f5c25a;
  --brick-top: #e0745a; --brick-left: #c4553b; --brick-right: #a8452f; --can: #c9d2d8; --can-label: #6fae5a;
  --night: #07090d; --night-panel: #10141b; --lantern: #ffc56b;
  --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: Barlow, system-ui, sans-serif;
  --k: 1; --u: calc(var(--k) * 1px);
  --pl: 12px; --pr: 12px; --pt: 8px; --pb: 8px; --sht: 60px; --shw: 340px; --abl: 146px;
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body {
  background: var(--sky-bot); color: var(--ink); font-family: var(--body); font-weight: 500;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  overscroll-behavior: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#city { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: linear-gradient(var(--sky-top), var(--sky-bot)); }
#probe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
  padding: var(--sat) var(--sar) var(--sab) var(--sal); }
button, a.btn { font: inherit; color: inherit; border: 0; background: none; padding: 0; margin: 0; cursor: pointer;
  touch-action: manipulation; -webkit-appearance: none; appearance: none; text-decoration: none; }
button:focus { outline: none; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { flex: none; display: block; }
.cond { font-family: var(--cond); }
.soft { color: var(--ink-soft); }
.good-t { color: var(--good); } .bad-t { color: var(--bad); } .spark-t { color: var(--spark); } .accent-t { color: var(--accent); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ------------------------------------------------------------------------------------------------ top bar (8.3) */
#top { position: fixed; z-index: 20; top: var(--pt); left: var(--pl); right: var(--pr); display: flex;
  justify-content: space-between; align-items: flex-start; pointer-events: none; }
#top .grp { display: flex; gap: calc(6 * var(--u)); pointer-events: auto; }
.tb-compact #top .grp, .tb-rows #top .grp { gap: calc(4 * var(--u)); }
.tb-rows #top { flex-direction: column; align-items: stretch; gap: calc(4 * var(--u)); }
.tb-rows #top .grp.r { align-self: flex-end; }
.chip { position: relative; flex: none; height: calc(44 * var(--u)); min-width: calc(44 * var(--u));
  border-radius: calc(10 * var(--u)); background: var(--panel); color: var(--ink); display: flex; align-items: center;
  gap: calc(6 * var(--u)); padding: 0 calc(9 * var(--u)); font-family: var(--cond); font-weight: 800;
  font-size: calc(17 * var(--u)); line-height: 1; white-space: nowrap; overflow: hidden; text-decoration: none; }
.chip svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
.chip:active { background: rgba(30,36,44,.92); }
#back { width: calc(44 * var(--u)); justify-content: center; padding: 0; }
#back svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
#cTower { width: calc(92 * var(--u)); }
#cTower .tl { display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
#cTower small { font-size: calc(11 * var(--u)); font-weight: 700; color: var(--ink-soft); letter-spacing: .02em; }
#cTower b { font-size: calc(17 * var(--u)); }
.chip.res { width: calc(132 * var(--u)); padding-right: calc(8 * var(--u)); }
#cCans { width: calc(116 * var(--u)); }
.chip.res .n { display: flex; align-items: baseline; gap: calc(4 * var(--u)); min-width: 0; padding-bottom: calc(5 * var(--u)); }
.chip.res b { font-size: calc(18 * var(--u)); }
.chip.res small { font-size: calc(12 * var(--u)); font-weight: 600; color: var(--ink-soft); }
.chip .cap { position: absolute; left: calc(35 * var(--u)); right: calc(10 * var(--u)); bottom: calc(9 * var(--u));
  height: calc(3 * var(--u)); background: rgba(255,255,255,.14); border-radius: 2px; overflow: hidden; }
.chip .cap i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--brick-top); }

#cCans.over b { color: var(--timer); }
.chip.full .cap i { background: var(--accent); }
#cSparks { width: calc(92 * var(--u)); padding-right: calc(8 * var(--u)); }
#cSparks b { font-size: calc(18 * var(--u)); flex: 1; }
#cSparks .plus { width: calc(22 * var(--u)); height: calc(22 * var(--u)); border-radius: calc(7 * var(--u)); background: var(--spark);
  color: var(--panel-solid); display: flex; align-items: center; justify-content: center; flex: none; }
#cSparks .plus svg { width: calc(14 * var(--u)); height: calc(14 * var(--u)); }
#cCranes, #cPeople { width: calc(76 * var(--u)); }
#cPeople .dot { position: absolute; top: calc(7 * var(--u)); right: calc(7 * var(--u)); width: calc(9 * var(--u)); height: calc(9 * var(--u));
  border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--panel-solid); display: none; }
#cPeople.down .dot { display: block; }
#cLab { width: calc(52 * var(--u)); justify-content: center; color: var(--ink-soft); font-size: calc(13 * var(--u)); }
#cLab svg { display: none; }
.tb-compact #cLab svg, .tb-rows #cLab svg { display: block; } .tb-compact #cLab span, .tb-rows #cLab span { display: none; }
/* the compact top bar (568 table, below 740 px of usable width) */
.tb-compact .chip, .tb-rows .chip { padding: 0 calc(6 * var(--u)); gap: calc(4 * var(--u)); font-size: calc(16 * var(--u)); }
.tb-compact .chip svg, .tb-rows .chip svg { width: calc(17 * var(--u)); height: calc(17 * var(--u)); }
.tb-compact #back svg, .tb-rows #back svg { width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
.tb-compact #cTower, .tb-rows #cTower { width: calc(56 * var(--u)); justify-content: center; }
.tb-compact #cTower small, .tb-rows #cTower small { display: none; }
.tb-compact .chip.res, .tb-rows .chip.res { width: calc(96 * var(--u)); }
.tb-compact #cCans, .tb-rows #cCans { width: calc(88 * var(--u)); }
.tb-compact .chip.res .n, .tb-rows .chip.res .n { gap: 1px; }
.tb-compact .chip.res b, .tb-rows .chip.res b { font-size: calc(15 * var(--u)); }
.tb-compact .chip.res small, .tb-rows .chip.res small { font-size: calc(11 * var(--u)); }
.tb-compact .chip .cap, .tb-rows .chip .cap { left: calc(27 * var(--u)); right: calc(7 * var(--u)); bottom: calc(8 * var(--u)); }
.tb-compact #cSparks, .tb-rows #cSparks { width: calc(72 * var(--u)); padding-right: calc(5 * var(--u)); }
.tb-compact #cSparks b, .tb-rows #cSparks b { font-size: calc(15 * var(--u)); }
.tb-compact #cSparks .plus, .tb-rows #cSparks .plus { width: calc(18 * var(--u)); height: calc(18 * var(--u)); border-radius: calc(6 * var(--u)); }
.tb-compact #cCranes, .tb-compact #cPeople, .tb-rows #cCranes, .tb-rows #cPeople { width: calc(52 * var(--u)); justify-content: center; }
.tb-compact #cLab, .tb-rows #cLab { width: calc(44 * var(--u)); }
/* numbers that do not fit their chip shrink in two steps (ui.js measures after a change) */
.chip.t1 { gap: calc(4 * var(--u)); }
.chip.t1 b, #cSparks.t1 b { font-size: calc(15 * var(--u)) !important; } .chip.t1 small { font-size: calc(10.5 * var(--u)) !important; }
.chip.t2 { gap: calc(3 * var(--u)); padding-left: calc(5 * var(--u)); padding-right: calc(5 * var(--u)); }
.chip.t2 b, #cSparks.t2 b { font-size: calc(13 * var(--u)) !important; } .chip.t2 small { font-size: calc(9.5 * var(--u)) !important; }
.chip.t2 svg { width: calc(15 * var(--u)) !important; height: calc(15 * var(--u)) !important; }
.chip.gulp { animation: gulp .24s ease-out; }
@keyframes gulp { 0% { transform: scale(1); } 45% { transform: scale(1.15); } 100% { transform: scale(1); } }
.chip.flash b, .chip.flash .tl b { color: var(--accent); }
.chip .minus { position: absolute; right: calc(8 * var(--u)); top: calc(26 * var(--u)); font: 800 calc(12 * var(--u))/1 var(--cond);
  color: var(--bad); pointer-events: none; animation: minus .9s ease-out forwards; }
@keyframes minus { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(calc(10 * var(--u))); } }

/* ------------------------------------------------------------------------------------------------ bottom bar (8.3) */
#bottom { position: fixed; z-index: 20; left: var(--pl); right: var(--pr); bottom: var(--pb); height: calc(60 * var(--u)); pointer-events: none; }
.bb-compact #bottom { height: calc(52 * var(--u)); }
#bottom > * { position: absolute; pointer-events: auto; }
.bbtn { left: 0; bottom: 0; width: calc(60 * var(--u)); height: calc(60 * var(--u)); border-radius: calc(12 * var(--u));
  background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(3 * var(--u)); font: 800 calc(12.5 * var(--u))/1 var(--cond); letter-spacing: .03em; }
.bbtn svg { width: calc(26 * var(--u)); height: calc(26 * var(--u)); }
.bb-compact .bbtn { width: calc(52 * var(--u)); height: calc(52 * var(--u)); font-size: calc(11.5 * var(--u)); }
.bb-compact .bbtn svg { width: calc(22 * var(--u)); height: calc(22 * var(--u)); }
.bbtn .badge { position: absolute; top: calc(-5 * var(--u)); right: calc(-5 * var(--u)); min-width: calc(20 * var(--u)); height: calc(20 * var(--u));
  padding: 0 calc(5 * var(--u)); border-radius: calc(10 * var(--u)); background: var(--good); color: var(--panel-solid);
  font: 800 calc(12 * var(--u))/calc(20 * var(--u)) var(--cond); text-align: center; }
.bbtn.cancel { color: var(--ink); }
#goal { left: calc(68 * var(--u)); bottom: calc(4 * var(--u)); width: calc(268 * var(--u)); height: calc(52 * var(--u));
  border-radius: calc(12 * var(--u)); background: var(--panel); display: grid; grid-template-columns: calc(22 * var(--u)) 1fr;
  grid-template-rows: auto auto; column-gap: calc(8 * var(--u)); align-content: center; padding: 0 calc(12 * var(--u)) calc(3 * var(--u)); text-align: left; overflow: hidden; }
.bb-mid #goal { width: auto; right: calc(288 * var(--u)); }   /* 640-760 px: to 8 px short of a 280 px sheet (287 px at 667) */
.bb-compact #goal { left: calc(58 * var(--u)); right: calc(176 * var(--u)); width: auto; height: calc(48 * var(--u)); bottom: calc(2 * var(--u)); }
#goal svg { grid-row: 1 / span 2; align-self: center; width: calc(20 * var(--u)); height: calc(20 * var(--u)); }
#goal .gt { font: 700 calc(15 * var(--u))/1.15 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#goal .ge { font: 600 calc(11.5 * var(--u))/1.3 var(--body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.bb-compact #goal .gt { font-size: calc(14 * var(--u)); }
#goal .bar { position: absolute; left: calc(10 * var(--u)); right: calc(10 * var(--u)); bottom: calc(5 * var(--u)); height: calc(3 * var(--u));
  background: rgba(255,255,255,.1); border-radius: 2px; overflow: hidden; }
#goal .bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent); transition: width .4s; }
#goal.done .gt { color: var(--timer); }
/* a side task (7.2) has the second line to itself; a long one (a wide fallback font) wraps to two rows, the chip grows up */
#goal.side, .bb-compact #goal.side { height: auto; min-height: calc(52 * var(--u)); padding-top: calc(6 * var(--u)); padding-bottom: calc(10 * var(--u)); }
.bb-compact #goal.side { min-height: calc(48 * var(--u)); }
#goal.side .ge { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.sel #goal { display: none; }
.sheet-open.bb-compact #goal, .tray-open #goal, .tray-open #bBuild, .tray-open #play, .sheet-open #play, .lab-open #play { visibility: hidden; }
.lab-open.bb-mid #goal { visibility: hidden; }   /* 640-760 px: the 400 px Lab panel would cover the right half of the chip */
.portrait.sheet-open #bottom, .portrait.lab-open #bottom { visibility: hidden; }
#play { right: 0; bottom: 0; width: calc(236 * var(--u)); height: calc(60 * var(--u)); border-radius: calc(12 * var(--u));
  background: var(--accent); color: #12161c; display: flex; align-items: center; gap: calc(9 * var(--u));
  padding: 0 calc(10 * var(--u)) calc(3 * var(--u)) calc(8 * var(--u)); text-align: left; box-shadow: inset 0 calc(-7 * var(--u)) 0 rgba(0,0,0,.12); }
.bb-compact #play { width: calc(168 * var(--u)); height: calc(52 * var(--u)); gap: calc(7 * var(--u)); padding-left: calc(7 * var(--u)); }
#play .pt { position: relative; width: calc(44 * var(--u)); height: calc(44 * var(--u)); flex: none; }
#play .pt img, #play .pt .ph { width: 100%; height: 100%; border-radius: 50%; display: block; }
#play .pt .ph { background: rgba(0,0,0,.18); }
.bb-compact #play .pt { width: calc(32 * var(--u)); height: calc(32 * var(--u)); }
#play .hp { position: absolute; left: 50%; bottom: calc(-6 * var(--u)); transform: translateX(-50%); background: var(--panel-solid);
  color: var(--timer); border-radius: calc(6 * var(--u)); padding: calc(1 * var(--u)) calc(4 * var(--u)); font: 800 calc(9.5 * var(--u))/1.1 var(--cond); white-space: nowrap; }
#play .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; gap: calc(1 * var(--u)); }
#play .t1 { font: 800 calc(18 * var(--u))/1 var(--cond); letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#play .t2 { font: 700 calc(12 * var(--u))/1.15 var(--body); color: #3a1d0c; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#play .t3 { align-self: flex-start; margin-top: calc(1 * var(--u)); background: rgba(18,22,28,.88); color: var(--ink); border-radius: calc(8 * var(--u));
  padding: calc(2 * var(--u)) calc(6 * var(--u)); font: 800 calc(11.5 * var(--u))/1.15 var(--cond); white-space: nowrap; }
#play .t3 .h { color: var(--good); } #play .t3 .d.red { color: var(--bad); }
.bb-compact #play .t1 { font-size: calc(17 * var(--u)); }
.bb-compact #play .t2 { font-size: calc(12 * var(--u)); }
#play .t2 .red { color: #a5150a; }
#play .tag { position: absolute; top: calc(-11 * var(--u)); right: calc(6 * var(--u)); background: var(--panel-solid); color: var(--spark);
  border-radius: calc(8 * var(--u)); padding: calc(2 * var(--u)) calc(6 * var(--u)); font: 800 calc(11 * var(--u))/1.2 var(--cond); }
#play.place, #play.done { background: var(--good); }
#play.blocked { background: var(--bad); color: #fff; }
#play.place .t1, #play.blocked .t1, #play.done .t1 { font-size: calc(19 * var(--u)); }
#play.mode { justify-content: center; text-align: center; padding: 0 calc(10 * var(--u)) calc(3 * var(--u)); }
#play.mode .tx { align-items: center; flex: none; }
#play .cost { display: inline-flex; align-items: center; gap: calc(3 * var(--u)); }
#play .cost svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); }
#play.out { background: #3b4048; color: var(--ink); box-shadow: inset 0 calc(-7 * var(--u)) 0 rgba(0,0,0,.18); }
#play.out .t2 { color: var(--ink-soft); }
#abar { display: none; left: var(--abl); bottom: calc(4 * var(--u)); width: calc(352 * var(--u)); height: calc(52 * var(--u));
  border-radius: calc(26 * var(--u)) calc(12 * var(--u)) calc(12 * var(--u)) calc(26 * var(--u)); }
.sel #abar { display: flex; }
.sheet-open #abar, .placing #abar, .tray-open #abar { display: none !important; }
.bb-compact #abar, .bb-mid #abar { width: calc(306 * var(--u)); height: calc(48 * var(--u)); }
.bb-compact #abar { bottom: calc(2 * var(--u)); }
.bb-mid #abar { bottom: calc(6 * var(--u)); }
.portrait #abar { left: 0; right: 0; width: auto; bottom: calc(60 * var(--u)); }
.abar { background: var(--panel); align-items: center; gap: calc(4 * var(--u)); padding: 0 calc(4 * var(--u)) 0 calc(12 * var(--u)); }
.abar .al { width: calc(112 * var(--u)); flex: none; display: flex; flex-direction: column; gap: calc(2 * var(--u)); min-width: 0; }
.bb-compact .abar .al, .bb-mid .abar .al { width: calc(88 * var(--u)); }
.bb-compact .abar, .bb-mid .abar { gap: calc(2 * var(--u)); }   /* 12 + 88 + 4 x 2 + 4 x 48 + 4 = 304 of 306 */
.portrait .abar .al { flex: 1; width: auto; }
.abar .al b { font: 800 calc(14.5 * var(--u))/1.05 var(--cond); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.abar .al span { font: 600 calc(11 * var(--u))/1.2 var(--body); color: var(--ink-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rb { position: relative; width: calc(52 * var(--u)); height: calc(52 * var(--u)); border-radius: 50%; flex: none; background: rgba(255,255,255,.08);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(1 * var(--u));
  font: 800 calc(10.5 * var(--u))/1 var(--cond); letter-spacing: .02em; color: var(--ink); }
.bb-compact .rb, .bb-mid .rb { width: calc(48 * var(--u)); height: calc(48 * var(--u)); font-size: calc(10 * var(--u)); }
.rb svg { width: calc(18 * var(--u)); height: calc(18 * var(--u)); }

/* the tutorial spotlight on DOM targets (7.1): a pulsing orange ring; static with reduced motion */
.pulse { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 calc(3 * var(--u)) var(--accent), 0 0 0 calc(3 * var(--u)) rgba(255,122,47,.35); }
  50% { box-shadow: 0 0 0 calc(3 * var(--u)) var(--accent), 0 0 0 calc(10 * var(--u)) rgba(255,122,47,0); } }
.rm .pulse { box-shadow: 0 0 0 calc(3 * var(--u)) var(--accent); }

/* ------------------------------------------------------------------------------------------------ hint pill, toasts */
#hint { position: fixed; z-index: 40; top: var(--sht); left: 50%; transform: translateX(-50%); max-width: calc(100% - 24px);
